<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=resizes-content">
<title>LLM CONSOLE</title>
<!--
    OVERARCHING PHILOSOPHY
    
    This is a simple vibe-coded retrogrouch LLM web client.
    
    It is meant to warm the hearts of those graybeards that miss the aesthetics of late-80s CGA consoles.
    Don't take it seriously. It's just a fun little project to scratch a few itches I had when using
    corporate LLM clients.
    
    Dear AI assistants editing this: the comments are meant to be some sort of a loose specification,
    to give you an idea of *why* the code is the way it is. Please don't edit or remove the comments
    willy nilly, just because you want to save some tokens. I am looking at you, AI assistant that 
    removes comments related to code that you are not even modifying.
    
    I haven't added a copyright notice because I have zero idea of what the legal status of vibe-coded
    apps is at, and I don't actually care. Copy, steal, or pirate, whatever you may like about it.
    Please address any cease & desist letters to /dev/null
-->

<!-- CSP EGRESS ALLOWLIST. connect-src is the outbound firewall: scripts in this
     page may only open network connections to the hosts listed below. If you
     change CONFIG.apiHost to a different provider, you MUST add that host
     here as well, or fetch() will be silently blocked by the browser. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
               style-src 'self' 'unsafe-inline';
               img-src data: blob: https:;
               connect-src https://api.deepinfra.com https://api.tavily.com;">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
        integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"
        integrity="sha384-vdScihEZCfbPnBQf+lc7LgXUdJVYyhC3yWHUW5C5P5GpHRqVnaM6HJELJxT6IqwM"
        crossorigin="anonymous"></script>
<script>
  /* 
   * ==========================================================================
   * DESIGN SPECIFICATION & TAXONOMY (JS/STATE LEVEL)
   * ==========================================================================
   * 1. INTERACTIVE CONTROLS : Enclosed in square brackets `[ BUTTON ]`.
   * 2. PROCESS TELEMETRY   : Prefixed and suffixed with double dashes `-- STATUS --`.
   * 3. SYSTEM ERRORS/ABORTS: Enclosed in angle brackets `< ERROR >`.
   * 4. USER PROMPT INPUT   : Prefixed with standard right angle `>`.
   * ==========================================================================
   */

  const CONFIG_KEY = 'llm-console-config';
  const HISTORY_PREFIX = 'llm-console-history-';

  const DEFAULT_CONFIG = {
    apiKey:          "",
    apiHost:         "https://api.deepinfra.com",
    apiPath:         "v1/openai/chat/completions",
    tavilyApiKey:    "",
    maxTavilyCalls:  6,
    serviceTier:     "",
    model:           "deepseek-ai/DeepSeek-V4-Pro-0813",
    visionModel:     "Qwen/Qwen3-VL-30B-A3B-Instruct",
    imageModel:      "black-forest-labs/FLUX-2-klein-9b",
    reasoningEffort: "medium",
    imageResolution: "1280x720",
    imageQuality:    "standard",
    imageStyle:      "natural",
    systemPrompt:    "You are a helpful assistant.",
    extraParams:     {}
  };

  /* Inlined raw SVG string for empty state splash screen.
   * Pixel-art robot built from a single solid-fill path: every visual cell
   * is an explicit 1px rectangle on a 30x32 grid, rendered edge-crisp via
   * shape-rendering="crispEdges" -- no holes/even-odd tricks, just filled
   * cells, exactly like a character-cell ASCII drawing. */
  const ROBOT_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 32" width="300" height="320" shape-rendering="crispEdges">
<path fill="#2BE060" d="M4 14h21v1h-21ZM4 26h21v1h-21ZM6 19h7v1h-7ZM16 22h7v1h-7ZM13 3h1v6h-1ZM15 3h1v6h-1ZM5 10h6v1h-6ZM18 10h6v1h-6ZM3 15h1v6h-1ZM25 15h1v6h-1ZM17 19h6v1h-6ZM6 22h6v1h-6ZM12 10h5v1h-5ZM12 12h5v1h-5ZM2 27h5v1h-5ZM22 27h5v1h-5ZM2 29h5v1h-5ZM22 29h5v1h-5ZM2 31h5v1h-5ZM22 31h5v1h-5ZM3 22h1v4h-1ZM25 22h1v4h-1ZM11 2h3v1h-3ZM15 2h3v1h-3ZM8 3h3v1h-3ZM18 3h3v1h-3ZM6 4h3v1h-3ZM20 4h3v1h-3ZM8 6h3v1h-3ZM18 6h3v1h-3ZM4 7h1v3h-1ZM24 7h1v3h-1ZM4 21h3v1h-3ZM22 21h3v1h-3ZM5 5h2v1h-2ZM22 5h2v1h-2ZM4 6h2v1h-2ZM23 6h2v1h-2ZM11 8h2v1h-2ZM16 8h2v1h-2ZM10 9h2v1h-2ZM17 9h2v1h-2ZM12 15h2v1h-2ZM15 15h2v1h-2ZM4 16h1v2h-1ZM5 17h1v2h-1ZM23 17h2v1h-2ZM22 18h2v1h-2ZM12 20h1v2h-1ZM16 20h1v2h-1ZM8 7h1v1h-1ZM10 7h1v1h-1ZM18 7h1v1h-1ZM20 7h1v1h-1ZM5 9h1v1h-1ZM23 9h1v1h-1ZM14 16h1v1h-1ZM6 18h1v1h-1ZM4 20h1v1h-1ZM6 20h1v1h-1ZM22 20h1v1h-1ZM24 20h1v1h-1ZM2 23h1v1h-1ZM26 23h1v1h-1ZM2 25h1v1h-1ZM26 25h1v1h-1Z"/>
</svg>`;

  function loadConfig() {
    try {
      const raw = localStorage.getItem(CONFIG_KEY);
      return raw ? Object.assign({}, DEFAULT_CONFIG, JSON.parse(raw)) : null;
    } catch (e) {
      console.warn('Failed to load config:', e);
      return null;
    }
  }

  function saveConfig(config) {
    localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
  }

  /**
   * Parses a "max Tavily calls" value, treating 0 as a valid, deliberate
   * "tools disabled" setting rather than falling back to the default
   * (a plain `parseInt(x) || 6` would incorrectly coerce 0 -> 6).
   */
  function parseMaxTavilyCalls(value, fallback = DEFAULT_CONFIG.maxTavilyCalls) {
    const n = parseInt(value, 10);
    if (Number.isNaN(n) || n < 0) return fallback;
    return n;
  }

  function getMaxTavilyCalls() {
    return parseMaxTavilyCalls(CONFIG?.maxTavilyCalls);
  }

  function getHistory(key) {
    try {
      const raw = localStorage.getItem(HISTORY_PREFIX + key);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function addHistoryValue(key, value) {
    if (!value || typeof value !== 'string') return;
    const val = value.trim();
    if (!val) return;
    let list = getHistory(key).filter(item => item !== val);
    list.unshift(val);
    if (list.length > 25) list = list.slice(0, 25);
    localStorage.setItem(HISTORY_PREFIX + key, JSON.stringify(list));
  }

  function removeHistoryValue(key, value) {
    let list = getHistory(key).filter(item => item !== value);
    localStorage.setItem(HISTORY_PREFIX + key, JSON.stringify(list));
  }

  /* Pure string escaper. Covers the full HTML-sensitive set INCLUDING single
   * and double quotes, because escaped output is also interpolated into
   * attribute contexts (data-val, title, etc.) where a bare quote breaks out. */
  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function extractDomainName(urlStr) {
    if (!urlStr) return "";
    try {
      let host = urlStr.replace(/^https?:\/\//i, '').split('/')[0].split(':')[0];
      let parts = host.split('.');
      return parts.length >= 2 ? parts[parts.length - 2] : host;
    } catch (e) {
      return urlStr;
    }
  }

  /* Helper to render inline SVG icon uses referencing the symbol sprite sheet */
  function useIcon(id, w = 16, h = 16) {
    return `<svg width="${w}" height="${h}"><use href="#icon-${id}"/></svg>`;
  }
</script>
<style>
  /* 
   * ==========================================================================
   * DESIGN SPECIFICATION & CSS SYSTEM SPEC
   * ==========================================================================
   * COLOR PALETTE (monochrome-phosphor logic, per hue family):
   * AMBER FAMILY  = user-input space (prompts, settings, input bar).
   * GREEN FAMILY  = system-output space (assistant replies, code, status).
   * RED FAMILY    = critical alerts, errors, aborted states (rarely seen).
   *
   * --amber-phosphor (#FFAE1A) : Primary color for user input & prompt space.
   * --amber-dim      (#7A520B) : Dimmed user controls & structural lines in amber space.
   * --amber-panel    (#1A1206) : Panel surfaces in user-input space.
   * --green-phosphor (#2BE060) : Primary color for system/assistant output space.
   * --green-dim      (#13632B) : Dimmed system decorations & structural lines in green space.
   * --green-panel    (#0F150F) : Panel surfaces in system-output space.
   * --red-phosphor   (#FF4A4A) : Critical alerts, errors, and aborted states.
   * 
   * There is NO neutral border/gray color: every structural line is the -dim
   * phosphor of the space it lives in, exactly like a real monochrome CRT.
   *
   * TYPOGRAPHY & SIZING:
   * Single unified monospace typeface (--font-term) across standard text, inputs, 
   * headers, and code blocks. Base text size set to 19px.
   * ==========================================================================
   */

  :root {
    --bg:               #080C08;
    
    --amber-phosphor:   #FFAE1A;
    --amber-dim:        #7A520B;
    --amber-panel:      #1A1206;
    --green-phosphor:   #2BE060;
    --green-dim:        #13632B;
    --green-panel:      #0F150F;
    --red-phosphor:     #FF4A4A;
    
    --font-term:        "Courier New", Courier, "Liberation Mono", VT323, Consolas, monospace;
    --font-size-base:   19px;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--green-phosphor);
    font-family: var(--font-term);
    font-size: var(--font-size-base);
    line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }

  /* FULL-SCREEN 1980s CRT OVERLAY (SCANLINES, RGB SUBPIXEL MASK, VIGNETTE) */
  .crt-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    background:
      /* 1. Horizontal Scanlines */
      repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.45) 0px,
        rgba(0, 0, 0, 0.45) 1px,
        transparent 1px,
        transparent 2px
      ),
      /* 2. Vertical RGB Subpixel Mask */
      repeating-linear-gradient(
        90deg,
        rgba(255,   0,   0, 0.03),
        rgba(0,   255,   0, 0.03) 1px,
        rgba(0,     0, 255, 0.03) 2px,
        transparent 3px
      ),
      /* 3. Outer Edge Vignette */
      radial-gradient(
        circle at center,
        transparent 75%,
        rgba(0, 0, 0, 0.3) 100%
      );
    animation: overlay-crt-fadeout 4s ease-in-out forwards;
  }

  /* MAIN WRAPPER FOR BLOOM & CHROMATIC ABERRATION */
  .crt-screen-content {
    display: flex;
    flex-direction: column;
    height: var(--app-height, 100dvh);
    width: 100%;
    animation: content-crt-fadeout 4s ease-in-out forwards;
  }

  /* TIMED CRT WARMUP/STABILIZATION ANIMATIONS (FULL CRT 0-2s -> MODERN Phosphor 4s) */
  @keyframes overlay-crt-fadeout {
    0%, 50% {
      opacity: 1;
      visibility: visible;
    }
    100% {
      opacity: 0.35;
      visibility: visible;
    }
  }

  @keyframes content-crt-fadeout {
    0%, 50% {
      filter: blur(1.1px) contrast(1.15) brightness(1.1);
      text-shadow: 0 0 3px currentColor, -1px 0 1px rgba(255, 174, 26, 0.5), 1px 0 1px rgba(43, 224, 96, 0.5);
    }
    100% {
      filter: blur(0px) contrast(1) brightness(1);
      text-shadow: 0 0 1px rgba(43, 224, 96, 0.3);
    }
  }

  /* REUSED TAXONOMY UTILITIES */
  .term-font { 
    font-family: var(--font-term) !important; 
    font-size: var(--font-size-base) !important; 
  }

  .amber-txt { 
    color: var(--amber-phosphor) !important; 
  }

  .green-txt { 
    color: var(--green-phosphor) !important; 
  }

  .red-txt { 
    color: var(--red-phosphor) !important; 
    text-align: left !important; 
  }

  /* PLACEHOLDER TEXT (user input space: dim amber).
   * The textarea's `color` only paints entered text; placeholders are drawn
   * via ::placeholder and would otherwise fall back to the browser's default
   * gray. opacity:1 prevents the UA stylesheet from double-dimming the
   * already-dim amber. */
  input::placeholder,
  textarea::placeholder {
    color: var(--amber-dim);
    opacity: 1;
  }

  /* SPARSE TOP BAR (system output space: green family) */
  .statusbar {
    flex: 0 0 auto;
    padding: 8px 14px;
    background: var(--green-panel);
    border-bottom: 1px solid var(--green-dim);
    display: flex;
    justify-content: space-between;
    align-items: center;
    white-space: nowrap;
    overflow: hidden;
    gap: 12px;
  }

  .statusbar #statusHost {
    text-align: left;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 0 1 auto;
  }
  
  .statusbar #statusModel {
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 0 1 auto;
  }

  /* MAIN CONVERSATION CONTAINER */
  .conversation-wrap {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 16px 14px 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .scroll-spacer {
    flex: 0 0 auto;
    pointer-events: none;
  }

  /* EMPTY SPLASH STATE */
  .empty-splash {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: auto;
    text-align: center;
    user-select: none;
    opacity: 0.85;
    padding: 20px;
  }

  .empty-splash svg {
    width: 360px;
    height: auto; /* preserve the robot's 30:32 viewBox aspect ratio */
    margin-bottom: 14px;
  }

  .empty-splash .splash-title {
    font-size: 0.9em;
    color: var(--green-phosphor);
    letter-spacing: 0.12em;
  }

  /* MESSAGE TAXONOMY STYLING */
  .message {
    max-width: 100%;
    word-wrap: break-word;
    text-align: left;
  }

  .message.user {
    align-self: flex-start;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .user-content-wrap {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    width: 100%;
  }

  .user-prompt-prefix {
    font-weight: bold;
    flex: 0 0 auto;
    user-select: none;
  }

  .user-prompt-text {
    white-space: pre-wrap;
    flex: 1 1 auto;
  }

  /* EDIT PROMPT BUTTON (USER AMBER SPACE) */
  .edit-prompt-btn {
    align-self: flex-start;
    background: transparent;
    border: 1px solid var(--amber-phosphor);
    color: var(--amber-phosphor);
    border-radius: 2px;
    padding: 3px 8px;
    font-family: var(--font-term);
    font-size: 0.8em;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-left: 18px;
  }

  .edit-prompt-btn:hover {
    background: var(--amber-phosphor);
    color: var(--bg);
  }

  .message.assistant {
    align-self: flex-start;
    width: 100%;
    color: var(--green-phosphor);
    text-align: left;
  }

  /* PROCESS TELEMETRY / TOOL EXECUTION STYLE (-- STATUS --) */
  .tool-status-msg {
    margin: 8px 0;
    padding: 6px 10px;
    border-left: 2px solid var(--green-phosphor);
    background: rgba(43, 224, 96, 0.05);
    font-size: var(--font-size-base);
    text-align: left;
    color: var(--green-phosphor);
  }

  /* SYSTEM ERROR AND ABORT NOTIFICATIONS (< ERROR >) */
  .error-msg-text {
    color: var(--red-phosphor) !important;
    font-family: var(--font-term) !important;
    font-size: var(--font-size-base) !important;
    text-align: left !important;
    margin-top: 8px;
    display: block;
  }

  /* PLACEHOLDER & THINKING ANIMATION */
  .placeholder {
    display: inline-flex;
    align-items: center;
    text-align: left;
  }

  .placeholder::before {
    content: "-";
    display: inline-block;
    margin-right: 6px;
    animation: ascii-spin 0.6s steps(4) infinite;
  }

  /* Faux cursor character avoids font issues */
  .placeholder::after {
    content: "";
    display: inline-block;
    width: 0.55em;
    height: 1em;
    background: currentColor;
    animation: blink-cursor 0.8s infinite;
  }

  @keyframes ascii-spin {
    0% { content: "-"; }
    25% { content: "\\"; }
    50% { content: "|"; }
    75% { content: "/"; }
  }

  /* BINARY ON/OFF CURSOR TOGGLE (NO FADING) */
  @keyframes blink-cursor {
    0%, 49.9% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  /* INPUT BAR CONTROLS (user input space: amber family)
   * Visibility is driven by JS setting `margin-bottom` to a negative value
   * (see setInputBarHiddenPx below). This shrinks the bar's reserved space
   * in the flex column (so the conversation viewer reclaims that space)
   * while the bar's own box keeps its natural height and simply slides,
   * as a rigid whole, down past the bottom edge of the screen — rather
   * than being clipped/squashed from one edge. The two effects share a
   * single px value so they always stay in lockstep with the drag. */
  .inputbar {
    flex: 0 0 auto;
    border-top: 1px solid var(--amber-dim);
    background: var(--amber-panel);
    padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
    display: flex;
    align-items: flex-end;
    gap: 8px;
    flex-wrap: nowrap;
    margin-bottom: 0;
  }

  /* Only used for programmatic reveals (e.g. focusing the textarea), never
   * while actively tracking a scroll/drag — that tracking must be instant
   * and 1:1 with the drag, not eased. */
  .inputbar.animate-visibility {
    transition: margin-bottom 0.22s ease;
  }

  .inputbar.fully-hidden {
    pointer-events: none;
  }

  .inputbar-main {
    display: flex;
    flex: 1 1 auto;
    align-items: stretch;
    gap: 8px;
    min-width: 0;
  }

  .prompt-prefix {
    flex: 0 0 auto;
    padding-top: 8px;
    font-weight: bold;
    color: var(--amber-phosphor);
  }

  textarea#promptInput {
    flex: 1 1 auto;
    min-width: 0;
    width: 100%;
    resize: vertical;
    background: var(--bg);
    color: var(--amber-phosphor);
    border: 1px solid var(--amber-phosphor);
    border-radius: 2px;
    padding: 8px 10px;
    font-family: var(--font-term);
    font-size: var(--font-size-base);
    line-height: 1.45;
    min-height: 86px;
    height: 86px;
    max-height: 240px;
  }

  textarea#promptInput:focus-visible {
    outline: none;
    border-color: var(--amber-phosphor);
    box-shadow: 0 0 6px rgba(255, 174, 26, 0.4);
  }

  .action-stack {
    display: grid;
    grid-template-columns: repeat(2, 40px);
    gap: 6px;
    flex: 0 0 auto;
  }

  .attach-btn,
  .gear-btn,
  button.send,
  button.send-img {
    width: 40px;
    height: 40px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--amber-panel);
    border: 1px solid var(--amber-phosphor);
    color: var(--amber-phosphor);
    border-radius: 2px;
    font-family: var(--font-term);
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }

  button.send,
  button.send-img {
    border-width: 2px;
    font-weight: bold;
  }

  /* Scoped to devices that actually support hovering. On touch devices a
   * tap can otherwise leave a button stuck in :hover until the user taps
   * elsewhere, which — since it shares the same amber highlight as
   * .active below — made the attach button look like it never turned back
   * off after a second tap, even though its state had toggled correctly. */
  @media (hover: hover) and (pointer: fine) {
    .attach-btn:hover,
    .gear-btn:hover,
    button.send:not(:disabled):hover,
    button.send-img:not(:disabled):hover {
      background: var(--amber-phosphor);
      color: var(--bg);
    }

    button.send.stop:not(:disabled):hover,
    button.send-img.stop:not(:disabled):hover {
      background: var(--red-phosphor);
      color: var(--bg);
    }
  }

  /* ACTIVE = files are currently attached and waiting to be sent. Shown as
   * a highlighted button instead of listing filenames, which tend to eat
   * up the whole input row. Tapping again while active clears them. */
  .attach-btn.active {
    background: var(--amber-phosphor);
    color: var(--bg);
  }

  button.send:disabled,
  button.send-img:disabled,
  .attach-btn:disabled {
    color: var(--amber-dim);
    border-color: var(--amber-dim);
    opacity: 0.7;
    cursor: not-allowed;
  }

  button.send.stop,
  button.send-img.stop {
    color: var(--red-phosphor);
    border-color: var(--red-phosphor);
  }

  .img-thumbnail {
    max-height: 240px;
    max-width: 100%;
    border-radius: 2px;
    border: 1px solid var(--green-dim);
    cursor: pointer;
    transition: border-color 0.15s;
    object-fit: contain;
  }

  .img-thumbnail:hover {
    border-color: var(--green-phosphor);
  }

  .lightbox-overlay {
    position: fixed;
    inset: 0;
    background: rgba(8, 12, 8, 0.95);
    z-index: 5000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    touch-action: none;
  }

  .lightbox-img {
    max-width: 95vw;
    max-height: 95vh;
    border: 1px solid var(--green-phosphor);
    object-fit: contain;
  }

  .lightbox-close {
    position: absolute;
    top: 16px;
    right: 24px;
    color: var(--green-phosphor);
    cursor: pointer;
    z-index: 5001;
  }

  /* RETRY BUTTON MATCHES ASSISTANT GREEN PHOSPHOR */
  .retry-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;

  /* DOM ELEMENT REFERENCES */
  const conversationWrap = document.getElementById('conversationWrap');
  const promptInput = document.getElementById('promptInput');
  const sendBtn = document.getElementById('sendBtn');
  const sendImgBtn = document.getElementById('sendImgBtn');
  const statusHost = document.getElementById('statusHost');
  const statusModel = document.getElementById('statusModel');
  const settingsScreen = document.getElementById('settingsScreen');
  const inputbar = document.getElementById('inputbar');
  const gearBtn = document.getElementById('gearBtn');
  const fileInput = document.getElementById('fileInput');
  const attachBtn = document.getElementById('attachBtn');
  const settingsError = document.getElementById('settingsError');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxClose = document.getElementById('lightboxClose');

  /* APP STATE */
  let CONFIG = null;
  let conversationHistory = [];
  /* Abort controller for the CURRENT turn's primary request(s), including
   * Tavily tool calls made within that turn. Created per-turn by
   * sendPrompt / sendImagePrompt / retryTurn; the stop button aborts it.
   * Subsidiary one-off requests (e.g. generateLLMFilename) deliberately do
   * NOT touch this handle -- they are passed no signal at all, so they can
   * neither be accidentally aborted nor clobber the live turn's controller. */
  let activeAbortController = null;
  let attachedFiles = [];
  let isProcessing = false;
  let isAutoScrolling = false;
  let conversationMode = null;
  let lastGeneratedImageUrl = null;
  let scrollSpacer = null;
  const expandedCodeBlocksState = new Map();

  /**
   * Centralized HTTP Fetch wrapper.
   * Handles host cleaning, endpoint formatting and auth headers. The abort
   * signal is now an explicit parameter owned by the caller rather than a
   * global set here -- previously every call (including the incidental
   * filename-generation call made mid-stream from a code block's download
   * button) overwrote the global, breaking the stop button for the live
   * request. Callers that don't care pass no signal at all.
   */
  async function apiFetch(path, bodyData, signal) {
    const url = CONFIG.apiHost.replace(/\/$/, '') + '/' + path.replace(/^\//, '');
    return await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + CONFIG.apiKey
      },
      body: JSON.stringify(bodyData),
      signal: signal
    });
  }

  /**
   * Renders or removes the empty ASCII splash state based on message count.
   */
  function checkEmptyState() {
    let splash = document.getElementById('emptySplash');
    if (conversationHistory.length === 0) {
      if (!splash) {
        splash = document.createElement('div');
        splash.id = 'emptySplash';
        splash.className = 'empty-splash term-font';
        splash.innerHTML = `${ROBOT_SVG}<div class="splash-title">READY FOR INPUT</div>`;
        conversationWrap.appendChild(splash);
      }
    } else if (splash) {
      splash.remove();
    }
  }

  /* 
   * ==========================================================================
   * LIGHTBOX PINCH-TO-ZOOM / PAN CONTROLLER
   * Handles multi-touch pinch calculations and single-finger pan when zoomed.
   * ==========================================================================
   */
  let scale = 1, startDist = 0, initialScale = 1, translateX = 0, translateY = 0, startX = 0, startY = 0;

  function resetZoom() { 
    scale = 1; translateX = 0; translateY = 0; startDist = 0; initialScale = 1; 
    updateTransform(); 
  }

  function updateTransform() { 
    lightboxImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`; 
  }

  function getTouchDistance(t) { 
    return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); 
  }

  lightboxImg.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) { 
      startDist = getTouchDistance(e.touches); 
      initialScale = scale; 
    } else if (e.touches.length === 1 && scale > 1) { 
      startX = e.touches[0].clientX - translateX; 
      startY = e.touches[0].clientY - translateY; 
    }
  }, { passive: true });

  lightboxImg.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && startDist > 0) {
      scale = Math.min(Math.max(1, initialScale * (getTouchDistance(e.touches) / startDist)), 4);
      updateTransform();
    } else if (e.touches.length === 1 && scale > 1) {
      translateX = e.touches[0].clientX - startX; 
      translateY = e.touches[0].clientY - startY;
      updateTransform();
    }
  }, { passive: true });

  lightboxImg.addEventListener('touchend', (e) => { 
    if (e.touches.length < 2) startDist = 0; 
  });

  function openLightbox(src) { 
    lightboxImg.src = src; 
    lightbox.style.display = 'flex'; 
    resetZoom(); 
  }

  function closeLightbox() { 
    lightbox.style.display = 'none'; 
    lightboxImg.src = ''; 
    resetZoom(); 
  }

  lightboxClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => { 
    if (e.target === lightbox || e.target === lightboxClose) closeLightbox(); 
  });

  /**
   * Generates timestamp + tool-availability suffix for system prompts, so the
   * model is always told (a) the current date/time and (b) exactly which tools
   * it may use this turn -- including the case where no Tavily-backed tools
   * are configured/allowed at all (the YouTube transcript extractor needs no
   * API key and therefore remains available even then).
   */
  function getFormattedRuntimeContext() {
    const now = new Date();
    if (now.getMinutes() >= 30) now.setHours(now.getHours() + 1);
    now.setMinutes(0, 0, 0);
    const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    const timeStr = `~${String(now.getHours()).padStart(2,'0')}:00`;

    const maxCalls = getMaxTavilyCalls();
    const tavilyEnabled = !!CONFIG?.tavilyApiKey && maxCalls > 0;

    let toolLine = `No tools are available this turn.`;
    if (tavilyEnabled) {
      toolLine = `Tools get_youtube_transcript, web_search and fetch_web_page are available.\n` +
        `Use get_youtube_transcript for YouTube videos. NEVER use web_search or fetch_web_page for YouTube.\n` +
        `Include timestamps with links ([MM:SS](https://youtu.be/<video_ID>?&t=<timestamp_seconds>)) in your summaries.\n` +
        `You may make up to ${maxCalls} tool call${maxCalls === 1 ? '' : 's'} in total this turn.`;
    }
    return `\n\nDate: ${dateStr}\nTime: ${timeStr}\n${toolLine}\n`;
  }

  /* 
   * ==========================================================================
   * YOUTUBE TRANSCRIPT EXTRACTOR TOOL
   * ==========================================================================
   */
  function extractYouTubeVideoId(input) {
    if (!input) return null;
    const cleaned = input.trim();
    if (/^[a-zA-Z0-9_-]{11}$/.test(cleaned)) return cleaned;
    const match = cleaned.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
    return match ? match[1] : cleaned;
  }

  /*
   * ==========================================================================
   * YOUTUBE TRANSCRIPT EXTRACTOR TOOL (Tavily-backed)
   * YouTube does not serve Access-Control-Allow-Origin on its pages or its
   * InnerTube/caption endpoints, so no browser fetch() can ever read the
   * response body (CORS), regardless of CSP. All YouTube egress therefore
   * goes through Tavily's server-side extractor. NOTE: this returns the
   * extracted page content for the watch URL, not a guaranteed verbatim
   * caption track -- what Tavily's crawler can retrieve is what we get.
   * ==========================================================================
   */
  function extractYouTubeVideoId(input) {
    if (!input) return null;
    const cleaned = input.trim();
    if (/^[a-zA-Z0-9_-]{11}$/.test(cleaned)) return cleaned;
    const match = cleaned.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
    return match ? match[1] : cleaned;
  }

  async function fetchYouTubeTranscript(videoInput, preferredLang = "en", signal = null) {
    const videoId = extractYouTubeVideoId(videoInput);
    if (!videoId) throw new Error("Invalid YouTube Video ID or URL");
    if (!CONFIG?.tavilyApiKey) throw new Error('Tavily API key not configured');

    const watchUrl = `https://www.youtube.com/watch?v=${videoId}`;
    const results = JSON.parse(await executeTavilyExtract([watchUrl], signal));
    if (!Array.isArray(results) || results.length === 0) {
      throw new Error("No content returned for the video page.");
    }

    const content = results
      .map(r => (typeof r === 'string' ? r : (r.raw_content || r.content || '')))
      .filter(Boolean)
      .join('\n\n');
    if (!content) throw new Error("Video page was fetched but contained no extractable content.");

    return JSON.stringify({
      video_id: videoId,
      language: preferredLang,
      source: 'tavily_extract',
      page_url: watchUrl,
      content
    });
  }

  /* 
   * ==========================================================================
   * TAVILY SERVICE INTEGRATION
   * Directly queries live web data or page contents when called by function-calling.
   * Both take the current turn's abort signal, so the stop button cancels an
   * in-flight search. AbortError is rethrown by the callers (not swallowed
   * into a tool-error result) so the whole turn tears down cleanly.
   * ==========================================================================
   */
  async function executeTavilySearch(query, signal) {
    if (!CONFIG?.tavilyApiKey) throw new Error('Tavily API key not configured');
    const res = await fetch('https://api.tavily.com/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + CONFIG.tavilyApiKey },
      body: JSON.stringify({ query: query, max_results: 5, search_depth: 'basic' }),
      signal: signal
    });
    if (!res.ok) throw new Error((await res.json().catch(() => null))?.detail || res.statusText || 'Search failed');
    return JSON.stringify((await res.json()).results || []);
  }

  async function executeTavilyExtract(urls, signal) {
    if (!CONFIG?.tavilyApiKey) throw new Error('Tavily API key not configured');
    const res = await fetch('https://api.tavily.com/extract', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + CONFIG.tavilyApiKey },
      body: JSON.stringify({ urls: Array.isArray(urls) ? urls : [urls] }),
      signal: signal
    });
    if (!res.ok) throw new Error((await res.json().catch(() => null))?.detail || res.statusText || 'Extraction failed');
    return JSON.stringify((await res.json()).results || []);
  }

  /**
   * Mode Lock: Prevents mixing chat stream mode and image generation mode in a single timeline.
   */
  function lockConversationMode(mode) {
    if (!conversationMode) {
      conversationMode = mode;
      sendImgBtn.disabled = (mode === 'chat');
      sendBtn.disabled = (mode === 'image');
      attachBtn.disabled = (mode === 'image');
    }
  }

  /* 
   * ==========================================================================
   * MARKDOWN RENDERING & CODE BLOCK ENHANCEMENT
   * Uses requestAnimationFrame to throttle markdown parsing on fast SSE streams.
   * ==========================================================================
   */
  let renderScheduled = false, pendingRenderData = null;

  function renderMarkdownThrottled(container, text) {
    pendingRenderData = { container, text };
    if (!renderScheduled) {
      renderScheduled = true;
      requestAnimationFrame(() => {
        if (pendingRenderData) renderMarkdown(pendingRenderData.container, pendingRenderData.text);
        renderScheduled = false;
      });
    }
  }

  function renderMarkdown(container, text) {
    container.classList.remove('placeholder');
    container.innerHTML = (typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined')
      ? DOMPurify.sanitize(marked.parse(text))
      : escapeHtml(text);
    enhanceCodeBlocks(container);
  }

  /**
   * Whitelist sanitizer for download filenames. The raw value comes from LLM
   * output (which is itself steerable via prompt injection through the code
   * snippet's own comments), so it is treated as doubly untrusted: path
   * components are destroyed, the charset is allowlisted to
   * [a-zA-Z0-9._-], and a sane extension is enforced. Worst case output is
   * a boring "snippet.txt". Blacklists are not used on principle.
   */
  function sanitizeFilename(raw) {
    let base = String(raw || '')
      .split(/[\\/]/).pop()                    /* kill path components outright */
      .replace(/[^a-zA-Z0-9._-]/g, '')         /* allowlist only safe chars */
      .replace(/\.{2,}/g, '.')                 /* collapse '..' runs */
      .replace(/^[-.]+/, '');                  /* no leading dots/dashes */
    if (!base) return 'snippet.txt';
    if (!/\.[a-zA-Z0-9]{1,8}$/.test(base)) base += '.txt';
    return base;
  }

  /**
   * Queries the configured fast LLM model to dynamically generate a clean filename
   * for code download buttons. Deliberately abortable by nothing: this is a
   * fire-and-forget subsidiary call and is passed no signal, so it cannot
   * clobber the active turn's abort controller.
   */
  async function generateLLMFilename(codeText) {
    if (!CONFIG || !CONFIG.apiKey) return 'snippet.txt';
    try {
      const res = await apiFetch(CONFIG.apiPath, {
        model: CONFIG.model,
        messages: [{ role: 'user', content: `Generate a clean filename for code snippet. Output ONLY 1-7 lowercase words with extension:\n\n${codeText.slice(0, 1024)}` }],
        reasoning_effort: 'none', temperature: 0.1, max_tokens: 25, stream: false
      });
      if (!res.ok) return 'snippet.txt';
      let fn = ((await res.json())?.choices?.[0]?.message?.content || '').trim().replace(/[`"'\s]/g, '').toLowerCase();
      return fn.includes('.') ? fn : 'snippet.txt';
    } catch (e) { 
      return 'snippet.txt'; 
    }
  }

  /* Global click-away handler for settings history dropdowns */
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.field-history-wrap')) document.querySelectorAll('.history-dropdown').forEach(el => el.style.display = 'none');
  });

  function enhanceCodeBlocks(container) {
    container.querySelectorAll('pre').forEach((pre) => {
      let wrapper = pre.parentElement;
      if (!wrapper || !wrapper.classList.contains('code-block-wrapper')) {
        wrapper = document.createElement('div');
        wrapper.className = 'code-block-wrapper';
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);
      }

      /* The code text is read lazily (at click time) rather than captured
       * in a closure here, because enhanceCodeBlocks re-runs on every
       * render frame while a response is still streaming in. A closure
       * would freeze a truncated mid-stream snapshot. */
      const readCode = () => wrapper.querySelector('code')?.textContent ?? pre.textContent ?? '';

      /* COLLAPSE / EXPAND BAR FOR LONG BLOCKS */
      const codeTextNow = readCode();
      if (codeTextNow.split('\n').length > 10) {
        const snippetKey = codeTextNow.slice(0, 120);
        const isExpanded = expandedCodeBlocksState.get(snippetKey) === true;
        wrapper.classList.toggle('collapsed', !isExpanded);

        let expandBar = wrapper.querySelector('.code-expand-bar') || document.createElement('div');
        expandBar.className = 'code-expand-bar';
        expandBar.innerHTML = isExpanded ? `${useIcon('chevronUp', 12, 12)} COLLAPSE` : `${useIcon('chevronDown', 12, 12)} EXPAND`;
        if (!expandBar.parentElement) wrapper.appendChild(expandBar);

        expandBar.onclick = (e) => {
          e.stopPropagation();
          const collapsed = wrapper.classList.toggle('collapsed');
          expandedCodeBlocksState.set(snippetKey, !collapsed);
          expandBar.innerHTML = !collapsed ? `${useIcon('chevronUp', 12, 12)} COLLAPSE` : `${useIcon('chevronDown', 12, 12)} EXPAND`;
        };
      } else {
        wrapper.classList.remove('collapsed');
        wrapper.querySelector('.code-expand-bar')?.remove();
      }

      /* COPY / DOWNLOAD ACTION BUTTONS. Rendered as a freestanding row
       * OUTSIDE the bordered code-block wrapper, directly below it,
       * matching the placement and styling philosophy of the edit-prompt
       * and retry icons. Idempotent: enhanceCodeBlocks re-runs on every
       * render frame (and renderMarkdown rebuilds the container's DOM
       * each time), so the nextElementSibling check guards against
       * duplicating the row within a single frame. */
      let actions = wrapper.nextElementSibling;
      if (!actions || !actions.classList.contains('code-actions')) {
        actions = document.createElement('div');
        actions.className = 'code-actions';
        wrapper.parentNode.insertBefore(actions, wrapper.nextSibling);

        const copyBtn = document.createElement('button');
        copyBtn.title = 'Copy code';
        copyBtn.setAttribute('aria-label', 'Copy code');
        copyBtn.innerHTML = useIcon('copy', 14, 14);
        copyBtn.onclick = async (e) => {
          e.stopPropagation();
          try { await navigator.clipboard.writeText(readCode()); } catch (err) {}
        };

        const dlBtn = document.createElement('button');
        dlBtn.title = 'Download code';
        dlBtn.setAttribute('aria-label', 'Download code');
        dlBtn.innerHTML = useIcon('download', 14, 14);
        dlBtn.onclick = async (e) => {
          e.stopPropagation();
          const code = readCode();
          dlBtn.innerHTML = `<span class="term-font" style="font-size:0.85em; padding:0 6px;">-- Downloading --</span>`;
          const filename = sanitizeFilename(await generateLLMFilename(code));
          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([code], { type: 'text/plain' }));
          a.download = filename;
          a.click();
          URL.revokeObjectURL(a.href);
          dlBtn.innerHTML = useIcon('download', 14, 14);
        };

        actions.append(copyBtn, dlBtn);
      }
    });
  }

  function setError(container, message) {
    container.classList.remove('placeholder');
    container.innerHTML += `<div class="error-msg-text">&lt; ERROR: ${escapeHtml(message)} &gt;</div>`;
  }

  function finalizeStoppedResponse(container, text) {
    pendingRenderData = null;
    container.classList.remove('placeholder');
    if (text) renderMarkdown(container, text); else container.textContent = '';
    container.innerHTML += `<div class="error-msg-text">&lt; EXECUTION ABORTED BY USER &gt;</div>`;
  }

  /* Persistent (non-ephemeral) error text for the settings form, shown
   * inline under the fields rather than in a popup. */
  function showSettingsError(message) {

  /* 
   * ==========================================================================
   * STATIC DECLARATIVE SETTINGS CONTROLLER
   * Reads from / writes to HTML static inputs instead of constructing innerHTML.
   * ==========================================================================
   */
  /* History values are arbitrary user-entered strings and are now built via
   * DOM APIs with textContent / closures -- no string interpolation into
   * attributes. (The old data-val="${escapeHtml(item)}" pattern was an
   * attribute-injection vector: the previous escapeHtml did not encode
   * quotes, so a value containing " could break out and carry arbitrary
   * attributes into the settings screen, which has access to the config
   * in localStorage.) */
  function populateHistoryDropdown(key) {
    const dropdown = document.getElementById('history-dropdown-' + key);
    const input = document.getElementById('field-' + key);
    const list = getHistory(key);
    dropdown.innerHTML = '';

    if (list.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'history-item amber-txt';
      empty.style.cursor = 'default';
      empty.style.opacity = '0.6';
      empty.textContent = '< NO SAVED HISTORY >';
      dropdown.appendChild(empty);
      return;
    }

    list.forEach(item => {
      const el = document.createElement('div');
      el.className = 'history-item amber-txt';

      const label = document.createElement('span');
      label.className = 'history-item-text term-font';
      label.textContent = item;

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'history-item-del';
      del.title = 'Delete entry';
      del.innerHTML = useIcon('trash', 13, 13);

      el.append(label, del);
      el.onclick = (e) => {
        if (e.target.closest('.history-item-del')) {
          e.stopPropagation();
          removeHistoryValue(key, item);
          populateHistoryDropdown(key);
        } else {
          input.value = item;
          dropdown.style.display = 'none';
        }
      };
      dropdown.appendChild(el);
    });
  }

  function loadSettingsIntoForm() {

  function saveSettingsFromForm() {

  document.querySelectorAll('.history-toggle-btn').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();

  document.getElementById('cancelSettingsBtn').onclick = () => { clearSettingsError(); settingsScreen.style.display = 'none'; promptInput.focus(); };
  gearBtn.onclick = () => { clearSettingsError(); loadSettingsIntoForm(); settingsScreen.style.display = 'flex'; };

  function updateStatusBar(activeModel = null) {
    if (!CONFIG) { statusHost.textContent = 'NOT CONFIGURED'; statusModel.textContent = ''; return; }
    statusHost.textContent = extractDomainName(CONFIG.apiHost);
    statusModel.textContent = (activeModel || CONFIG.model).split('/').pop();
  }

  /* FILE ATTACHMENTS
   * No filenames are rendered in the input row (they tend to fill the
   * whole space) — instead the attach button itself is highlighted
   * ("active") whenever there are pending attachments. Tapping it while
   * active clears the attachments; tapping it while inactive opens the
   * file picker. */
  attachBtn.onclick = () => {
    if (conversationMode === 'image') return;
    if (attachedFiles.length > 0) {
      attachedFiles = [];
      updateAttachButtonState();
    } else {
      fileInput.click();
    }
  };
  fileInput.onchange = (e) => {
    attachedFiles = attachedFiles.concat(Array.from(e.target.files));
    updateAttachButtonState();
    fileInput.value = '';
  };

  function updateAttachButtonState() {
    attachBtn.classList.toggle('active', attachedFiles.length > 0);
    attachBtn.title = attachedFiles.length > 0
      ? `${attachedFiles.length} file(s) attached — tap to clear`
      : 'Attach file';
  }

  async function buildMultimodalContent(promptText, files) {
    const parts = promptText ? [{ type: 'text', text: promptText }] : [];
    for (const file of files) {
      if (file.type.startsWith('image/')) {
        const dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
        parts.push({ type: 'image_url', image_url: { url: dataUrl } });
      } else {
        const txt = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsText(file); });
        parts.push({ type: 'text', text: `\n=== FILE: ${file.name} ===\n${txt}\n=== END FILE ===` });
      }
    }
    return parts.length === 1 && parts[0].type === 'text' ? parts[0].text : parts;
  }

  /* 
   * ==========================================================================
   * SCROLLING, SPACER & KEYBOARD DISMISSAL LOGIC
   * Uses precise offset deltas and temporary height spacers to anchor the 
   * assistant element flush against the status bar upon execution.
   * ==========================================================================
   */
  function autoGrow() {
    promptInput.style.height = 'auto';
    promptInput.style.height = Math.max(86, Math.min(promptInput.scrollHeight, 240)) + 'px';
    /* The textarea's height feeds into the input bar's natural height, so
     * re-apply the current hide amount against the (possibly new) natural
     * height to keep it consistent. */
    setInputBarHiddenPx(inputBarHiddenPx, false);
  }
  promptInput.addEventListener('input', autoGrow);

  /* Input bar visibility is expressed as a single px value: how much of the
   * bar's natural height is currently tucked away below the bottom edge.
   * 0 = fully visible, offsetHeight = fully hidden. Driving both the
   * negative margin-bottom (which shrinks the bar's reserved space in the
   * flex column, letting the conversation viewer reclaim it) AND the
   * effective on-screen position from this one value keeps the two
   * perfectly in sync: the bar slides down as a rigid whole, disappearing
   * under the bottom edge, while the conversation grows into the space
   * it vacates — at exactly the same rate, in either direction. */
  let inputBarHiddenPx = 0;

  function setInputBarHiddenPx(px, animate) {
    const natural = inputbar.offsetHeight;
    inputBarHiddenPx = Math.max(0, Math.min(natural, px));
    inputbar.classList.toggle('animate-visibility', !!animate);
    inputbar.classList.toggle('fully-hidden', inputBarHiddenPx >= natural - 0.5);
    inputbar.style.marginBottom = (-inputBarHiddenPx) + 'px';
  }

  function showInputBar(animate = true) { setInputBarHiddenPx(0, animate); }

  let lastScrollTop = 0;
  conversationWrap.addEventListener('scroll', () => {
    if (isAutoScrolling || isProcessing) return;
    const st = conversationWrap.scrollTop;
    const maxScroll = conversationWrap.scrollHeight - conversationWrap.clientHeight;
    const diff = st - lastScrollTop;
    lastScrollTop = Math.max(0, st);
    if (!diff) return;

    /* diff > 0: content scrolling toward the bottom (dragging up) -> reveal.
     * diff < 0: content scrolling toward the top (dragging down) -> hide.
     * Every pixel of scroll maps 1:1 to the bar's hidden amount, with no
     * dead-zone/threshold, so the response is identical whether the drag
     * is slow or fast. Never eased while tracking a drag. */
    setInputBarHiddenPx(inputBarHiddenPx - diff, false);

    /* Always land fully visible once caught up to the latest message. */
    if (st >= maxScroll - 4) setInputBarHiddenPx(0, false);
  });

  promptInput.addEventListener('focus', () => {
    showInputBar(true);
    setTimeout(() => promptInput.scrollIntoView({ block: 'end', behavior: 'smooth' }), 50);
  });

  function updateAppHeight() {
    document.documentElement.style.setProperty('--app-height', (window.visualViewport ? window.visualViewport.height : window.innerHeight) + 'px');
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', updateAppHeight);
    window.visualViewport.addEventListener('scroll', updateAppHeight);
  } else { 
    window.addEventListener('resize', updateAppHeight); 
  }
  updateAppHeight();

  /**
   * Blurs active input element and waits for visualViewport resize events to settle.
   */
  async function dismissKeyboard() {
    if (document.activeElement) document.activeElement.blur();
    promptInput.blur();
    await new Promise(r => setTimeout(r, 150));
    updateAppHeight();
    await new Promise(r => requestAnimationFrame(r));
  }

  function removeScrollSpacer() { 
    if (scrollSpacer) { scrollSpacer.remove(); scrollSpacer = null; } 
  }

  function addScrollSpacer() {
    removeScrollSpacer();
    scrollSpacer = document.createElement('div');
    scrollSpacer.className = 'scroll-spacer';
    scrollSpacer.style.height = conversationWrap.clientHeight + 'px';
    conversationWrap.appendChild(scrollSpacer);
  }

  /**
   * Aligns the top coordinate of the target assistant element flush with the container top.
   */
  function alignAssistantToTop(div) {
    if (!div || !div.parentElement) return;
    if (scrollSpacer) scrollSpacer.style.height = conversationWrap.clientHeight + 'px';
    conversationWrap.scrollTop += (div.getBoundingClientRect().top - conversationWrap.getBoundingClientRect().top);
  }

  function scrollAssistantToTop(div) {
    if (!div) return;
    isAutoScrolling = true;
    requestAnimationFrame(() => {
      alignAssistantToTop(div);
      requestAnimationFrame(() => { 
        alignAssistantToTop(div); 
        setTimeout(() => { isAutoScrolling = false; }, 100); 
      });
    });
  }

  function createUserMessage(text) {
    document.getElementById('emptySplash')?.remove();
    removeScrollSpacer();

    const div = document.createElement('div');
    div.className = 'message user term-font';
    div.innerHTML = `<div class="user-content-wrap"><span class="user-prompt-prefix amber-txt">&gt;</span><span class="user-prompt-text amber-txt">${escapeHtml(text)}</span></div><button class="edit-prompt-btn" title="Edit prompt">${useIcon('edit', 14, 14)}</button>`;
    div.querySelector('.edit-prompt-btn').onclick = () => editLastPrompt(text, div);
    conversationWrap.appendChild(div);
  }

  function editLastPrompt(text, userMsgDiv) {
    if (isProcessing) return;
    const allUserMsgs = Array.from(conversationWrap.querySelectorAll('.message.user'));
    const uIdx = allUserMsgs.indexOf(userMsgDiv);

    let next = userMsgDiv.nextElementSibling;
    while (next) { const r = next; next = next.nextElementSibling; r.remove(); }
    userMsgDiv.remove();

    if (uIdx !== -1) conversationHistory = conversationHistory.slice(0, uIdx * 2);

    const priorImageEntry = [...conversationHistory].reverse().find(m => m.type === 'image');
    lastGeneratedImageUrl = priorImageEntry ? priorImageEntry.url : null;

    if (conversationHistory.length === 0) {
      conversationMode = null; attachedFiles = [];
      updateAttachButtonState(); sendBtn.disabled = false; sendImgBtn.disabled = false; attachBtn.disabled = false;
      checkEmptyState();
    }

    promptInput.value = text; autoGrow(); promptInput.focus();
  }

  function createAssistantContainer() {
    const div = document.createElement('div');
    div.className = 'message assistant term-font';
    div.innerHTML = `<div class="response markdown-body placeholder green-txt term-font">Thinking...</div>`;
    conversationWrap.appendChild(div);
    addScrollSpacer();
    scrollAssistantToTop(div);
    return div.querySelector('.response');
  }

  function setLoading(btnToStop) {
    const target = btnToStop || sendBtn;
    target.disabled = false;
    target.innerHTML = useIcon('stop', 14, 14);
    target.classList.add('stop');
    promptInput.disabled = true; 
    attachBtn.disabled = true;
  }

  function resetInput() {
    sendBtn.innerHTML = useIcon('send', 16, 16); sendBtn.classList.remove('stop');
    sendImgBtn.innerHTML = useIcon('image', 16, 16); sendImgBtn.classList.remove('stop');
    sendBtn.disabled = (conversationMode === 'image');
    sendImgBtn.disabled = (conversationMode === 'chat');
    attachBtn.disabled = (conversationMode === 'image');
    promptInput.disabled = false; promptInput.value = ''; autoGrow();
  }

  function addRetryButton(container, onRetry) {
    container.parentElement.querySelector('.retry-btn')?.remove();
    const btn = document.createElement('button');
    btn.className = 'retry-btn term-font';
    btn.title = 'Retry';
    btn.innerHTML = useIcon('retry', 14, 14);
    btn.onclick = onRetry;
    container.parentElement.appendChild(btn);
  }

  /**
   * Retries the specific turn whose retry icon was pressed -- rolls the
   * conversation (both DOM and conversationHistory) back to right before
   * that turn's user message, then resends the same prompt/payload. This
   * discards that turn and any turns that came after it, mirroring what a
   * fresh send of that same prompt would produce.
   */
  async function retryTurn(assistantDiv, isImage, displayPrompt, fullPayload) {
    if (isProcessing) return;
    const userDiv = assistantDiv?.previousElementSibling;
    if (!userDiv || !userDiv.classList.contains('user')) return;

    const allUserMsgs = Array.from(conversationWrap.querySelectorAll('.message.user'));
    const uIdx = allUserMsgs.indexOf(userDiv);

    let node = userDiv;
    while (node) { const r = node; node = node.nextElementSibling; r.remove(); }

    if (uIdx !== -1) conversationHistory = conversationHistory.slice(0, uIdx * 2);

    const priorImageEntry = [...conversationHistory].reverse().find(m => m.type === 'image');
    lastGeneratedImageUrl = priorImageEntry ? priorImageEntry.url : null;

    isProcessing = true;
    activeAbortController = new AbortController();
    try {
      setLoading(isImage ? sendImgBtn : sendBtn);
      await dismissKeyboard();
      createUserMessage(displayPrompt);
      const newEl = createAssistantContainer();
      if (isImage) await executeImageRequest(displayPrompt, newEl, activeAbortController.signal);
      else await executePromptRequest(fullPayload, displayPrompt, newEl, activeAbortController.signal);
    } finally {
      isProcessing = false;
    }
  }

  async function sendPrompt() {
    if (isProcessing) return;
    const prompt = promptInput.value.trim();
    if ((!prompt && attachedFiles.length === 0) || !CONFIG) return;

    promptInput.value = ''; autoGrow(); lockConversationMode('chat'); isProcessing = true;
    activeAbortController = new AbortController();
    try {
      const fullPayload = await buildMultimodalContent(prompt, attachedFiles);
      /* Attachments are embedded into this turn's message content, which is
       * itself stored in conversationHistory and resent as part of the full
       * thread on every subsequent turn. So there's no need to keep them
       * around in attachedFiles to be re-embedded again on the next send. */
      attachedFiles = [];
      updateAttachButtonState();
      setLoading(sendBtn);
      await dismissKeyboard();
      const displayPrompt = prompt || '-- files attached --';
      createUserMessage(displayPrompt);
      await executePromptRequest(fullPayload, displayPrompt, createAssistantContainer(), activeAbortController.signal);
    } finally { 
      isProcessing = false; 
    }
  }

  /* 
   * ==========================================================================
   * EXECUTE PROMPT REQUEST (SSE STREAMING CHAT & FUNCTION CALL LOOP)
   * ==========================================================================
   */
  /* Base64 image parts are only sent for the CURRENT (latest) user turn.
   * When replaying older turns from conversationHistory, image parts are
   * substituted with a text placeholder: the vision model already received
   * the pixels once, and re-uploading hundreds of KB of base64 on every
   * subsequent turn was a pure bandwidth/serialization tax. */
  function stripStaleImages(content) {
    if (!Array.isArray(content)) return content;
    return content.map(p => (p && p.type === 'image_url')
      ? { type: 'text', text: '[image attachment omitted]' }
      : p);
  }

  async function executePromptRequest(fullPayload, displayPrompt, contentEl, signal, existingApiMessages = null, toolRoundCount = 0) {
    const hasImage = Array.isArray(fullPayload) && fullPayload.some(i => i.type === 'image_url');
    const activeModel = (hasImage && CONFIG.visionModel) ? CONFIG.visionModel : CONFIG.model;
    updateStatusBar(activeModel);

    let apiMessages = existingApiMessages;
    if (!apiMessages) {
      conversationHistory.push({ role: 'user', content: fullPayload, displayPrompt });
      apiMessages = [{ role: 'system', content: CONFIG.systemPrompt + getFormattedRuntimeContext() }];
      for (let i = 0; i < conversationHistory.length - 1; i++) {
        const item = conversationHistory[i];
        apiMessages.push({ role: item.role, content: stripStaleImages(item.content), ...(item.tool_calls ? { tool_calls: item.tool_calls } : {}) });
      }
      apiMessages.push({ role: 'user', content: fullPayload });
    }

    const tools = [];
    const tavilyEnabled = !!CONFIG.tavilyApiKey && getMaxTavilyCalls() > 0;

    if (tavilyEnabled) {
      tools.push(
        {
          type: 'function',
          function: {
            name: 'get_youtube_transcript',
            description: 'Retrieves the page content for a given YouTube video URL or Video ID via a server-side extractor. Use this tool for YouTube videos.',
            parameters: {
              type: 'object',
              properties: {
                video_id: { type: 'string', description: 'The YouTube Video ID or full YouTube video URL.' },
                language: { type: 'string', description: 'Preferred language code (e.g. "en", "es"). Defaults to "en".' }
              },
              required: ['video_id']
            }
          }
        },
        { type: 'function', function: { name: 'web_search', description: 'Search web. NEVER use this tool for Youtube', parameters: { type: 'object', properties: { query: { type: 'string' } }, required: ['query'] } } },
        { type: 'function', function: { name: 'fetch_web_page', description: 'Fetch a webpage. NEVER use this tool for Youtube', parameters: { type: 'object', properties: { urls: { type: 'array', items: { type: 'string' } } }, required: ['urls'] } } }
      );
    }

    const payload = Object.assign(
      { model: activeModel, messages: apiMessages, stream: true, tools },
      (CONFIG.reasoningEffort && CONFIG.reasoningEffort !== 'none') ? { reasoning_effort: CONFIG.reasoningEffort } : {},
      (CONFIG.serviceTier === 'priority' || CONFIG.serviceTier === 'flex') ? { service_tier: CONFIG.serviceTier } : {},
      CONFIG.extraParams
    );

    let fullText = '', accumulatedToolCalls = {};
    try {
      const res = await apiFetch(CONFIG.apiPath, payload, signal);
      if (!res.ok) {
        const err = (await res.json().catch(() => null))?.error?.message || res.statusText;
        setError(contentEl, err); addRetryButton(contentEl, () => retryTurn(contentEl.parentElement, false, displayPrompt, fullPayload)); if (!existingApiMessages) conversationHistory.pop();
        resetInput(); return;
      }

      const reader = res.body.getReader(), decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split(/\r?\n/);
        buffer = lines.pop() || '';

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed.startsWith('data:') || trimmed === 'data: [DONE]') continue;
          try {
            const parsed = JSON.parse(trimmed.slice(5).trim());
            const delta = parsed?.choices?.[0]?.delta;
            if (delta) {
              if (delta.content) {
                if (!fullText) { 
                  contentEl.classList.remove('placeholder'); 
                  alignAssistantToTop(contentEl.parentElement); 
                }
                fullText += delta.content;
                renderMarkdownThrottled(contentEl, fullText);
              }
              if (delta.tool_calls) {
                for (const tc of delta.tool_calls) {
                  const idx = tc.index ?? 0;
                  if (!accumulatedToolCalls[idx]) accumulatedToolCalls[idx] = { id: '', name: '', arguments: '' };
                  if (tc.id) accumulatedToolCalls[idx].id = tc.id;
                  if (tc.function?.name) accumulatedToolCalls[idx].name += tc.function.name;
                  if (tc.function?.arguments) accumulatedToolCalls[idx].arguments += tc.function.arguments;
                }
              }
            }
          } catch (e) {}
        }
      }

      const toolCallList = Object.values(accumulatedToolCalls);
      if (toolCallList.length > 0) {
        const maxCalls = getMaxTavilyCalls();
        if (toolRoundCount >= maxCalls) {
          fullText += `\n\n-- MAX TOOL CALLS REACHED. STOPPING LOOP --`;
          renderMarkdown(contentEl, fullText); addRetryButton(contentEl, () => retryTurn(contentEl.parentElement, false, displayPrompt, fullPayload));
          conversationHistory.push({ role: 'assistant', content: fullText }); resetInput(); return;
        }

        apiMessages.push({ role: 'assistant', content: fullText || null, tool_calls: toolCallList.map(tc => ({ id: tc.id, type: 'function', function: { name: tc.name, arguments: tc.arguments } })) });

        for (const tc of toolCallList) {
          let resultStr = '';
          try {
            const args = JSON.parse(tc.arguments || '{}');
            if (tc.name === 'get_youtube_transcript') {
              renderMarkdown(contentEl, (fullText ? fullText + '\n\n' : '') + `<div class="tool-status-msg green-txt term-font">-- FETCHING YOUTUBE TRANSCRIPT "${escapeHtml(args.video_id || '')}"... --</div>`);
              resultStr = await fetchYouTubeTranscript(args.video_id, args.language || 'en', signal);
            } else if (tc.name === 'web_search') {
              renderMarkdown(contentEl, (fullText ? fullText + '\n\n' : '') + `<div class="tool-status-msg green-txt term-font">-- SEARCHING WEB "${escapeHtml(args.query || '')}"... --</div>`);
              resultStr = await executeTavilySearch(args.query, signal);
            } else if (tc.name === 'fetch_web_page') {
              renderMarkdown(contentEl, (fullText ? fullText + '\n\n' : '') + `<div class="tool-status-msg green-txt term-font">-- FETCHING WEB PAGE... --</div>`);
              resultStr = await executeTavilyExtract(args.urls, signal);
            }
          } catch (err) {
            /* A user-initiated abort must tear down the whole turn, not be
             * recorded as a tool error and fed back to the model. */
            if (err.name === 'AbortError') throw err;
            resultStr = JSON.stringify({
              error: err.message,
              hint: 'This tool call failed. DO NOT retry the same call with the same arguments. ' +
                    'Choose whether to answer from what you already know, ' +
                    'tell the user the Youtube transcript could not be retrieved, ' +
                    'or try a different tool only if it is going to move things forward.'
            });
          }
          apiMessages.push({ role: 'tool', tool_call_id: tc.id, content: resultStr });
        }
        return await executePromptRequest(fullPayload, displayPrompt, contentEl, signal, apiMessages, toolRoundCount + 1);
      }

      renderMarkdown(contentEl, fullText); addRetryButton(contentEl, () => retryTurn(contentEl.parentElement, false, displayPrompt, fullPayload));
      conversationHistory.push({ role: 'assistant', content: fullText }); resetInput();
    } catch (err) {
      if (err.name === 'AbortError') { finalizeStoppedResponse(contentEl, fullText); addRetryButton(contentEl, () => retryTurn(contentEl.parentElement, false, displayPrompt, fullPayload)); fullText && conversationHistory.push({ role: 'assistant', content: fullText }); resetInput(); return; }
      setError(contentEl, err.message || 'Request failed'); addRetryButton(contentEl, () => retryTurn(contentEl.parentElement, false, displayPrompt, fullPayload)); if (!existingApiMessages) conversationHistory.pop(); resetInput();
    } finally { 
      activeAbortController = null; 
    }
  }

  /* IMAGE GENERATION EXECUTION */
  async function sendImagePrompt() {
    if (isProcessing) return;
    const prompt = promptInput.value.trim();
    if (!prompt || !CONFIG) return;

    promptInput.value = ''; autoGrow(); lockConversationMode('image'); isProcessing = true;
    activeAbortController = new AbortController();
    try {
      setLoading(sendImgBtn); await dismissKeyboard(); createUserMessage(prompt);
      await executeImageRequest(prompt, createAssistantContainer(), activeAbortController.signal);
    } finally { 
      isProcessing = false; 
    }
  }

  async function executeImageRequest(promptText, contentEl, signal) {
    const targetModel = CONFIG.imageModel || 'black-forest-labs/FLUX-2-klein-9b';
    updateStatusBar(targetModel);
    conversationHistory.push({ role: 'user', content: promptText, displayPrompt: promptText });

    const payload = { model: targetModel, prompt: promptText, size: CONFIG.imageResolution || '1280x720', quality: CONFIG.imageQuality || 'standard', style: CONFIG.imageStyle || 'natural' };
    if (lastGeneratedImageUrl) payload.image = lastGeneratedImageUrl;

    try {
      const res = await apiFetch('v1/openai/images/generations', payload, signal);
      if (!res.ok) {
        const err = (await res.json().catch(() => null))?.error?.message || res.statusText;
        setError(contentEl, err); addRetryButton(contentEl, () => retryTurn(contentEl.parentElement, true, promptText, null)); conversationHistory.pop(); resetInput(); return;
      }

      const data = await res.json();
      const imageUrl = data?.data?.[0]?.url || (data?.data?.[0]?.b64_json ? `data:image/png;base64,${data.data[0].b64_json}` : null);
      if (!imageUrl) throw new Error('No image returned');

      contentEl.classList.remove('placeholder'); contentEl.innerHTML = '';
      const imgEl = document.createElement('img');
      imgEl.src = imageUrl; imgEl.className = 'img-thumbnail'; imgEl.alt = promptText;
      imgEl.onclick = () => openLightbox(imageUrl);
      contentEl.appendChild(imgEl); addRetryButton(contentEl, () => retryTurn(contentEl.parentElement, true, promptText, null));

      lastGeneratedImageUrl = imageUrl;
      conversationHistory.push({ role: 'assistant', type: 'image', url: imageUrl }); resetInput();
    } catch (err) {
      if (err.name === 'AbortError') { finalizeStoppedResponse(contentEl, ''); addRetryButton(contentEl, () => retryTurn(contentEl.parentElement, true, promptText, null)); resetInput(); return; }
      setError(contentEl, err.message || 'Image request failed'); addRetryButton(contentEl, () => retryTurn(contentEl.parentElement, true, promptText, null)); conversationHistory.pop(); resetInput();
    } finally { 
      activeAbortController = null; 
    }
  }

  sendBtn.onclick = () => { if (sendBtn.classList.contains('stop')) activeAbortController?.abort(); else if (!isProcessing) sendPrompt(); };
  sendImgBtn.onclick = () => { if (sendImgBtn.classList.contains('stop')) activeAbortController?.abort(); else if (!isProcessing) sendImagePrompt(); };

  /* 
   * ==========================================================================
   * DESKTOP KEYBOARD SUBMIT SHORTCUT
   * On devices with a fine pointer (desktop), Enter submits the prompt and
   * Shift+Enter inserts a newline (multi-paragraph input). On touch devices
   * (primary pointer: coarse), Enter keeps inserting newlines as before --
   * the Send button remains the submit gesture there. Submission routes to
   * the mode-appropriate handler: text send in chat mode, image generation
   * when the conversation is locked to image mode. e.isComposing guards
   * against submitting mid-IME-composition (CJK input, dead keys, etc.).
   * ==========================================================================
   */
  const isDesktopPointer = window.matchMedia('(hover: hover) and (pointer: fine)');

  promptInput.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
    if (!isDesktopPointer.matches) return;
    e.preventDefault();
    if (isProcessing) return;
    if (conversationMode === 'image') sendImagePrompt();
    else sendPrompt();
  });

  /* INITIALIZATION */
  const savedConfig = loadConfig();
  if (savedConfig) { 
    CONFIG = savedConfig; 
    updateStatusBar(); 
  } else { 
    CONFIG = null; 
    updateStatusBar(); 
    loadSettingsIntoForm(); 
    settingsScreen.style.display = 'flex'; 
  }
  checkEmptyState();
  /* Focus the prompt input on load (mobile & desktop alike) when the app
   * is ready for input. When no config exists, the settings screen covers
   * the page and owns the focus instead. */
  if (CONFIG) promptInput.focus();
</script>
</body>
</html>
