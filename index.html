<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=resizes-content">
<title>LLM CONSOLE</title>
<!--
    OVERARCHING PHILOSOPHY
    
    This is a simple vibe-coded retrogrouch LLM web client.
    
    It is meant to warm the hearts of those graybeards that miss the aesthetics of late-80s CGA consoles.
    Don't take it seriously. It's just a fun little project to scratch a few itches I had when using
    corporate LLM clients.

    Dear AI assistants editing this: the comments are meant to be some sort of a loose specification,
    to give you an idea of *why* the code is the way it is. Please don't edit or remove the comments
    willy nilly, just because you want to save some tokens. I am looking at you, AI assistant that 
    removes comments related to code that you are not even modifying.
    
    I haven't added a copyright notice because I have zero idea of what the legal status of vibe-coded
    apps is at, and I don't actually care. Copy, steal, or pirate, whatever you may like about it.
    Please address any cease & desist letters to /dev/null

    INTENDED USAGE & THREAT MODEL
    
    This is a single-user, single-origin, client-only toy. There is exactly one
    human in the loop: the same person who configures the API hosts and API keys
    is the person whose keys they are. The hosts and keys in the config are
    therefore USER-PROVIDED INPUT THE USER ALREADY OWNS, not secrets to defend
    against the user. External-attacker hardening is limited to what comes free
    (the CSP egress allowlist, sanitizing model output); do not "fix" this app
    by second-guessing the user's own host/key choices, and do not rank issues
    as if this were a multi-user product.

-->

<!-- CSP EGRESS ALLOWLIST. connect-src is the outbound firewall: scripts in this
     page may only open network connections to the hosts listed below. If you
     change CONFIG.apiHost to a different provider, you MUST add that host
     here as well, or fetch() will be silently blocked by the browser. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
               style-src 'self' 'unsafe-inline';
               img-src data: blob: https:;
               media-src blob:;
               connect-src https://api.deepinfra.com https://api.tavily.com https://sponsor.ajay.app;">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
        integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.15/dist/purify.min.js"
        integrity="sha256-8mOwU2ngUPoXXU7LnJNY60JTYC1RApet+zHfSLLxxNU="
        crossorigin="anonymous"></script>
<script>
  /* 
   * ==========================================================================
   * DESIGN SPECIFICATION & TAXONOMY (JS/STATE LEVEL)
   * ==========================================================================
   * 1. INTERACTIVE CONTROLS : Enclosed in square brackets `[ BUTTON ]`.
   * 2. PROCESS TELEMETRY   : Prefixed and suffixed with double dashes `-- STATUS --`.
   * 3. SYSTEM ERRORS/ABORTS: Enclosed in angle brackets `< ERROR >`.
   * 4. USER PROMPT INPUT   : Prefixed with standard right angle `>`.
   * ==========================================================================
   */

  const CONFIG_KEY = 'llm-console-config';
  const HISTORY_PREFIX = 'llm-console-history-';

  const DEFAULT_CONFIG = {
    apiKey:          "",
    apiHost:         "https://api.deepinfra.com",
    apiPath:         "v1/openai/chat/completions",
    tavilyApiKey:    "",
    maxTavilyCalls:  6,
    serviceTier:     "",
    model:           "deepseek-ai/DeepSeek-V4-Pro-0813",
    visionModel:     "Qwen/Qwen3-VL-30B-A3B-Instruct",
    imageModel:      "black-forest-labs/FLUX-2-klein-9b",
    reasoningEffort: "medium",
    imageResolution: "1280x720",
    imageQuality:    "standard",
    imageStyle:      "natural",
    ttsVoice:        "Ono_Anna",
    ttsInstruct:     "Friendly Canadian",
    systemPrompt:    "You are a helpful assistant.",
    extraParams:     {}
  };

  /* Inlined raw SVG string for empty state splash screen.
   * Pixel-art robot built from a single solid-fill path: every visual cell
   * is an explicit 1px rectangle on a 30x32 grid, rendered edge-crisp via
   * shape-rendering="crispEdges" -- no holes/even-odd tricks, just filled
   * cells, exactly like a character-cell ASCII drawing. */
  const ROBOT_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 32" width="300" height="320" shape-rendering="crispEdges">
<path fill="#2BE060" d="M4 14h21v1h-21ZM4 26h21v1h-21ZM6 19h7v1h-7ZM16 22h7v1h-7ZM13 3h1v6h-1ZM15 3h1v6h-1ZM5 10h6v1h-6ZM18 10h6v1h-6ZM3 15h1v6h-1ZM25 15h1v6h-1ZM17 19h6v1h-6ZM6 22h6v1h-6ZM12 10h5v1h-5ZM12 12h5v1h-5ZM2 27h5v1h-5ZM22 27h5v1h-5ZM2 29h5v1h-5ZM22 29h5v1h-5ZM2 31h5v1h-5ZM22 31h5v1h-5ZM3 22h1v4h-1ZM25 22h1v4h-1ZM11 2h3v1h-3ZM15 2h3v1h-3ZM8 3h3v1h-3ZM18 3h3v1h-3ZM6 4h3v1h-3ZM20 4h3v1h-3ZM8 6h3v1h-3ZM18 6h3v1h-3ZM4 7h1v3h-1ZM24 7h1v3h-1ZM4 21h3v1h-3ZM22 21h3v1h-3ZM5 5h2v1h-2ZM22 5h2v1h-2ZM4 6h2v1h-2ZM23 6h2v1h-2ZM11 8h2v1h-2ZM16 8h2v1h-2ZM10 9h2v1h-2ZM17 9h2v1h-2ZM12 15h2v1h-2ZM15 15h2v1h-2ZM4 16h1v2h-1ZM5 17h1v2h-1ZM23 17h2v1h-2ZM22 18h2v1h-2ZM12 20h1v2h-1ZM16 20h1v2h-1ZM8 7h1v1h-1ZM10 7h1v1h-1ZM18 7h1v1h-1ZM20 7h1v1h-1ZM5 9h1v1h-1ZM23 9h1v1h-1ZM14 16h1v1h-1ZM6 18h1v1h-1ZM4 20h1v1h-1ZM6 20h1v1h-1ZM22 20h1v1h-1ZM24 20h1v1h-1ZM2 23h1v1h-1ZM26 23h1v1h-1ZM2 25h1v1h-1ZM26 25h1v1h-1Z"/>
</svg>`;

  function loadConfig() {
    try {
      const raw = localStorage.getItem(CONFIG_KEY);
      return raw ? Object.assign({}, DEFAULT_CONFIG, JSON.parse(raw)) : null;
    } catch (e) {
      console.warn('Failed to load config:', e);
      return null;
    }
  }

  function saveConfig(config) {
    localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
  }

  /**
   * Parses a "max Tavily calls" value, treating 0 as a valid, deliberate
   * "tools disabled" setting rather than falling back to the default
   * (a plain `parseInt(x) || 6` would incorrectly coerce 0 -> 6).
   */
  function parseMaxTavilyCalls(value, fallback = DEFAULT_CONFIG.maxTavilyCalls) {
    const n = parseInt(value, 10);
    if (Number.isNaN(n) || n < 0) return fallback;
    return n;
  }

  function getMaxTavilyCalls() {
    return parseMaxTavilyCalls(CONFIG?.maxTavilyCalls);
  }

  function getHistory(key) {
    try {
      const raw = localStorage.getItem(HISTORY_PREFIX + key);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function addHistoryValue(key, value) {
    if (!value || typeof value !== 'string') return;
    const val = value.trim();
    if (!val) return;
    let list = getHistory(key).filter(item => item !== val);
    list.unshift(val);
    if (list.length > 25) list = list.slice(0, 25);
    localStorage.setItem(HISTORY_PREFIX + key, JSON.stringify(list));
  }

  function removeHistoryValue(key, value) {
    let list = getHistory(key).filter(item => item !== value);
    localStorage.setItem(HISTORY_PREFIX + key, JSON.stringify(list));
  }

  /* Pure string escaper. Covers the full HTML-sensitive set INCLUDING single
   * and double quotes: harmless in element-content contexts, and required
   * the moment an escaped value is ever interpolated into an attribute
   * (title, data-*, ...), where a bare quote would break out. */
  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function extractDomainName(urlStr) {
    if (!urlStr) return "";
    try {
      let host = urlStr.replace(/^https?:\/\//i, '').split('/')[0].split(':')[0];
      let parts = host.split('.');
      return parts.length >= 2 ? parts[parts.length - 2] : host;
    } catch (e) {
      return urlStr;
    }
  }

  /* Helper to render inline SVG icon uses referencing the symbol sprite sheet */
  function useIcon(id, w = 16, h = 16) {
    return `<svg width="${w}" height="${h}"><use href="#icon-${id}"/></svg>`;
  }
</script>
<style>
  /* 
   * ==========================================================================
   * DESIGN SPECIFICATION & CSS SYSTEM SPEC
   * ==========================================================================
   * COLOR PALETTE (monochrome-phosphor logic, per hue family):
   * AMBER FAMILY  = user-input space (prompts, settings, input bar).
   * GREEN FAMILY  = system-output space (assistant replies, code, status).
   * RED FAMILY    = critical alerts, errors, aborted states (rarely seen).
   *
   * --amber-phosphor (#FFAE1A) : Primary color for user input & prompt space.
   * --amber-dim      (#7A520B) : Dimmed user controls & structural lines in amber space.
   * --amber-panel    (#1A1206) : Panel surfaces in user-input space.
   * --green-phosphor (#2BE060) : Primary color for system/assistant output space.
   * --green-dim      (#13632B) : Dimmed system decorations & structural lines in green space.
   * --green-panel    (#0F150F) : Panel surfaces in system-output space.
   * --red-phosphor   (#FF4A4A) : Critical alerts, errors, and aborted states.
   * 
   * There is NO neutral border/gray color: every structural line is the -dim
   * phosphor of the space it lives in, exactly like a real monochrome CRT.
   *
   * TYPOGRAPHY & SIZING:
   * Single unified monospace typeface (--font-term) across standard text, inputs, 
   * headers, and code blocks. Base text size set to 19px.
   * ==========================================================================
   */

  :root {
    --bg:               #080C08;
    
    --amber-phosphor:   #FFAE1A;
    --amber-dim:        #7A520B;
    --amber-panel:      #1A1206;
    --green-phosphor:   #2BE060;
    --green-dim:        #13632B;
    --green-panel:      #0F150F;
    --red-phosphor:     #FF4A4A;
    
    --font-term:        "Courier New", Courier, "Liberation Mono", VT323, Consolas, monospace;
    --font-size-base:   19px;
    /* Textarea auto-grow clamp bounds: the single source of truth for the
     * input box geometry. autoGrow() reads these back via getComputedStyle,
     * so the JS clamp can never drift out of sync with the CSS. */
    --input-min-h:      86px;
    --input-max-h:      240px;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--green-phosphor);
    font-family: var(--font-term);
    font-size: var(--font-size-base);
    line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }

  /* FULL-SCREEN 1980s CRT OVERLAY (SCANLINES, RGB SUBPIXEL MASK, VIGNETTE) */
  .crt-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    background:
      /* 1. Horizontal Scanlines */
      repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.45) 0px,
        rgba(0, 0, 0, 0.45) 1px,
        transparent 1px,
        transparent 2px
      ),
      /* 2. Vertical RGB Subpixel Mask */
      repeating-linear-gradient(
        90deg,
        rgba(255,   0,   0, 0.03),
        rgba(0,   255,   0, 0.03) 1px,
        rgba(0,     0, 255, 0.03) 2px,
        transparent 3px
      ),
      /* 3. Outer Edge Vignette */
      radial-gradient(
        circle at center,
        transparent 75%,
        rgba(0, 0, 0, 0.3) 100%
      );
    animation: overlay-crt-fadeout 4s ease-in-out forwards;
  }

  /* MAIN WRAPPER FOR BLOOM & CHROMATIC ABERRATION
   * position:relative turns this into the containing block for the
   * absolutely-positioned model-selector dropdown (which must hang BELOW
   * the status bar and would be clipped by the status bar's own
   * overflow:hidden if it lived inside it). */
  .crt-screen-content {
    position: relative;
    display: flex;
    flex-direction: column;
    height: var(--app-height, 100dvh);
    width: 100%;
    animation: content-crt-fadeout 4s ease-in-out forwards;
  }

  /* TIMED CRT WARMUP/STABILIZATION ANIMATIONS (FULL CRT 0-2s -> MODERN Phosphor 4s) */
  @keyframes overlay-crt-fadeout {
    0%, 50% {
      opacity: 1;
      visibility: visible;
    }
    100% {
      opacity: 0.35;
      visibility: visible;
    }
  }

  @keyframes content-crt-fadeout {
    0%, 50% {
      filter: blur(1.1px) contrast(1.15) brightness(1.1);
      text-shadow: 0 0 3px currentColor, -1px 0 1px rgba(255, 174, 26, 0.5), 1px 0 1px rgba(43, 224, 96, 0.5);
    }
    100% {
      filter: blur(0px) contrast(1) brightness(1);
      text-shadow: 0 0 1px rgba(43, 224, 96, 0.3);
    }
  }

  /* REUSED TAXONOMY UTILITIES */
  .term-font { 
    font-family: var(--font-term) !important; 
    font-size: var(--font-size-base) !important; 
  }

  .amber-txt { 
    color: var(--amber-phosphor) !important; 
  }

  .green-txt { 
    color: var(--green-phosphor) !important; 
  }

  .red-txt { 
    color: var(--red-phosphor) !important; 
    text-align: left !important; 
  }

  /* PLACEHOLDER TEXT (user input space: dim amber).
   * The textarea's `color` only paints entered text; placeholders are drawn
   * via ::placeholder and would otherwise fall back to the browser's default
   * gray. opacity:1 prevents the UA stylesheet from double-dimming the
   * already-dim amber. */
  input::placeholder,
  textarea::placeholder {
    color: var(--amber-dim);
    opacity: 1;
  }

  /* SPARSE TOP BAR (system output space: green family) */
  .statusbar {
    flex: 0 0 auto;
    padding: 8px 14px;
    background: var(--green-panel);
    border-bottom: 1px solid var(--green-dim);
    display: flex;
    justify-content: space-between;
    align-items: center;
    white-space: nowrap;
    overflow: hidden;
    gap: 12px;
  }

  .statusbar #statusHost {
    text-align: left;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 0 1 auto;
  }
  
  .statusbar #statusModel {
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 0 1 auto;
    /* The model name doubles as the model-history drop-down toggle. */
    cursor: pointer;
    user-select: none;
  }

  /* MODEL SELECTOR DROP-DOWN (system output space: green family)
   * Anchored to the top-right of the app column, directly under the status
   * bar. The vertical offset is set by JS from the status bar's measured
   * height (top is overwritten at open time), so it tracks any font/padding
   * change without hardcoding pixels. */
  .model-dropdown {
    position: absolute;
    top: 0; /* overwritten by JS at open time */
    right: 8px;
    z-index: 4500;
    min-width: 240px;
    max-width: calc(100vw - 16px);
    max-height: 50vh;
    overflow-y: auto;
    background: var(--green-panel);
    border: 1px solid var(--green-dim);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
  }

  .model-dropdown .history-item {
    color: var(--green-phosphor);
    border-bottom: 1px solid var(--green-dim);
    font-size: 0.85em;
    word-break: break-all;
  }

  .model-dropdown .history-item.current {
    font-weight: bold;
  }

  .model-dropdown .history-item:hover {
    background: var(--green-phosphor);
    color: var(--bg);
  }

  /* MAIN CONVERSATION CONTAINER */
  .conversation-wrap {
    flex: 1 1 auto;
    overflow-y: auto;
    /* Kill lateral scrolling. Per the CSS overflow spec, `overflow-y:auto`
     * with overflow-x left at its initial `visible` COMPUTES to `auto` on
     * the x axis too, so the conversation was secretly a horizontal scroll
     * container: any child that ever rendered a fraction wider than the
     * column (a wide markdown table, an unbreakable token, a long URL)
     * made the whole pane pannable sideways into the black void. Clipping
     * is the correct semantics here -- code blocks keep their own internal
     * overflow-x:auto, so nothing legitimate ever needs the pane itself
     * to scroll horizontally. */
    overflow-x: hidden;
    padding: 16px 14px 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .scroll-spacer {
    flex: 0 0 auto;
    pointer-events: none;
  }

  /* REASONING TOKEN STREAM (system output space: dim green family).
   * overflow:hidden (NOT auto) so it never shows a scrollbar and never
   * participates in the user's scroll gestures -- the tail-follow is done
   * programmatically via scrollTop, which works even on overflow:hidden.
   * textContent (not innerHTML) is used for the reasoning, so no markdown
   * parsing, no sanitizer round-trip, and no reflow cost beyond the
   * appended text itself. */
  .thinking-scroll {
    overflow-y: hidden;
    white-space: pre-wrap;
    word-wrap: break-word;
    color: var(--green-dim);
    font-size: 0.85em;
    line-height: 1.45;
    text-align: left;
    margin: 4px 0 8px;
  }

  /* EMPTY SPLASH STATE
   * max-width:100% plus the responsive svg sizing below guarantee the splash
   * never overflows its column. On narrow phones the old fixed 360px robot
   * was WIDER than the available content box; an overflowing flex item with
   * auto margins gets those margins clamped to zero and falls back to
   * start-alignment, which pushed the whole splash (robot included) a few
   * pixels to the right of true center. */
  .empty-splash {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: auto;
    max-width: 100%;
    text-align: center;
    user-select: none;
    opacity: 0.85;
    padding: 20px;
  }

  .empty-splash svg {
    width: min(360px, 100%); /* shrink instead of overflowing on mobile */
    max-width: 100%;
    height: auto; /* preserve the robot's 30:32 viewBox aspect ratio */
    margin-bottom: 14px;
  }

  .empty-splash .splash-title {
    font-size: 0.9em;
    color: var(--green-phosphor);
    letter-spacing: 0.12em;
  }

  /* MESSAGE TAXONOMY STYLING */
  .message {
    max-width: 100%;
    word-wrap: break-word;
    text-align: left;
  }

  .message.user {
    align-self: flex-start;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .user-content-wrap {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    width: 100%;
  }

  .user-prompt-prefix {
    font-weight: bold;
    flex: 0 0 auto;
    user-select: none;
  }

  .user-prompt-text {
    white-space: pre-wrap;
    flex: 1 1 auto;
  }

  /* EDIT PROMPT BUTTON (USER AMBER SPACE) */
  .edit-prompt-btn {
    align-self: flex-start;
    background: transparent;
    border: 1px solid var(--amber-phosphor);
    color: var(--amber-phosphor);
    border-radius: 2px;
    padding: 3px 8px;
    font-family: var(--font-term);
    font-size: 0.8em;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-left: 18px;
  }

  .edit-prompt-btn:hover {
    background: var(--amber-phosphor);
    color: var(--bg);
  }

  .message.assistant {
    align-self: flex-start;
    width: 100%;
    color: var(--green-phosphor);
    text-align: left;
  }

  /* PROCESS TELEMETRY / TOOL EXECUTION STYLE (-- STATUS --) */
  .tool-status-msg {
    margin: 8px 0;
    padding: 6px 10px;
    border-left: 2px solid var(--green-phosphor);
    background: rgba(43, 224, 96, 0.05);
    font-size: var(--font-size-base);
    text-align: left;
    color: var(--green-phosphor);
  }

  /* SYSTEM ERROR AND ABORT NOTIFICATIONS (< ERROR >) */
  .error-msg-text {
    color: var(--red-phosphor) !important;
    font-family: var(--font-term) !important;
    font-size: var(--font-size-base) !important;
    text-align: left !important;
    margin-top: 8px;
    display: block;
  }

  /* PLACEHOLDER & THINKING ANIMATION */
  .placeholder {
    display: inline-flex;
    align-items: center;
    text-align: left;
  }

  .placeholder::before {
    content: "-";
    display: inline-block;
    margin-right: 6px;
    animation: ascii-spin 0.6s steps(4) infinite;
  }

  /* Faux cursor character avoids font issues */
  .placeholder::after {
    content: "";
    display: inline-block;
    width: 0.55em;
    height: 1em;
    background: currentColor;
    animation: blink-cursor 0.8s infinite;
  }

  @keyframes ascii-spin {
    0% { content: "-"; }
    25% { content: "\\"; }
    50% { content: "|"; }
    75% { content: "/"; }
  }

  /* BINARY ON/OFF CURSOR TOGGLE (NO FADING) */
  @keyframes blink-cursor {
    0%, 49.9% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  /* INPUT BAR CONTROLS (user input space: amber family)
   * Visibility is driven by JS setting `margin-bottom` to a negative value
   * (see setInputBarHiddenPx below). This shrinks the bar's reserved space
   * in the flex column (so the conversation viewer reclaims that space)
   * while the bar's own box keeps its natural height and simply slides,
   * as a rigid whole, down past the bottom edge of the screen — rather
   * than being clipped/squashed from one edge. The two effects share a
   * single px value so they always stay in lockstep with the drag. */
  .inputbar {
    flex: 0 0 auto;
    border-top: 1px solid var(--amber-dim);
    background: var(--amber-panel);
    padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
    display: flex;
    align-items: flex-end;
    gap: 8px;
    flex-wrap: nowrap;
    margin-bottom: 0;
  }

  /* Only used for programmatic reveals (e.g. focusing the textarea), never
   * while actively tracking a scroll/drag — that tracking must be instant
   * and 1:1 with the drag, not eased. */
  .inputbar.animate-visibility {
    transition: margin-bottom 0.22s ease;
  }

  .inputbar.fully-hidden {
    pointer-events: none;
  }

  .inputbar-main {
    display: flex;
    flex: 1 1 auto;
    align-items: stretch;
    gap: 8px;
    min-width: 0;
  }

  .prompt-prefix {
    flex: 0 0 auto;
    padding-top: 8px;
    font-weight: bold;
    color: var(--amber-phosphor);
  }

  textarea#promptInput {
    flex: 1 1 auto;
    min-width: 0;
    width: 100%;
    resize: vertical;
    background: var(--bg);
    color: var(--amber-phosphor);
    border: 1px solid var(--amber-phosphor);
    border-radius: 2px;
    padding: 8px 10px;
    font-family: var(--font-term);
    font-size: var(--font-size-base);
    line-height: 1.45;
    min-height: var(--input-min-h);
    height: var(--input-min-h);
    max-height: var(--input-max-h);
  }

  textarea#promptInput:focus-visible {
    outline: none;
    border-color: var(--amber-phosphor);
    box-shadow: 0 0 6px rgba(255, 174, 26, 0.4);
  }

  .action-stack {
    display: grid;
    grid-template-columns: repeat(2, 40px);
    gap: 6px;
    flex: 0 0 auto;
  }

  .attach-btn,
  .gear-btn,
  button.send,
  button.send-img {
    width: 40px;
    height: 40px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--amber-panel);
    border: 1px solid var(--amber-phosphor);
    color: var(--amber-phosphor);
    border-radius: 2px;
    font-family: var(--font-term);
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }

  button.send,
  button.send-img {
    border-width: 2px;
    font-weight: bold;
  }

  /* Scoped to devices that actually support hovering. On touch devices a
   * tap can otherwise leave a button stuck in :hover until the user taps
   * elsewhere, which — since it shares the same amber highlight as
   * .active below — made the attach button look like it never turned back
   * off after a second tap, even though its state had toggled correctly. */
  @media (hover: hover) and (pointer: fine) {
    .attach-btn:hover,
    .gear-btn:hover,
    button.send:not(:disabled):hover,
    button.send-img:not(:disabled):hover {
      background: var(--amber-phosphor);
      color: var(--bg);
    }

    button.send.stop:not(:disabled):hover,
    button.send-img.stop:not(:disabled):hover {
      background: var(--red-phosphor);
      color: var(--bg);
    }
  }

  /* STICKY-HOVER NEUTRALIZER (TOUCH DEVICES). Some mobile browsers —
   * notably Firefox on Android — emulate :hover after a tap and leave it
   * applied until the user taps somewhere else, EVEN THOUGH the
   * (hover:hover) block above correctly never matched. So on devices
   * that report no hover capability we explicitly pin :hover to the same
   * visuals as the resting state. This way, tapping the attach button
   * while it is active (clearing the pending attachments and removing
   * .active) can never leave the button visually highlighted through a
   * stale emulated hover state. */
  @media (hover: none) {
    .attach-btn:hover,
    .gear-btn:hover,
    button.send:not(:disabled):hover,
    button.send-img:not(:disabled):hover {
      background: var(--amber-panel);
      color: var(--amber-phosphor);
    }

    button.send.stop:not(:disabled):hover,
    button.send-img.stop:not(:disabled):hover {
      background: var(--amber-panel);
      color: var(--red-phosphor);
    }

    /* While files ARE still pending, hover must keep showing the active
     * highlight, not the neutralized resting look. */
    .attach-btn.active:hover {
      background: var(--amber-phosphor);
      color: var(--bg);
    }
  }

  /* ACTIVE = files are currently attached and waiting to be sent. Shown as
   * a highlighted button instead of listing filenames, which tend to eat
   * up the whole input row. Tapping again while active clears them. */
  .attach-btn.active {
    background: var(--amber-phosphor);
    color: var(--bg);
  }

  button.send:disabled,
  button.send-img:disabled,
  .attach-btn:disabled {
    color: var(--amber-dim);
    border-color: var(--amber-dim);
    opacity: 0.7;
    cursor: not-allowed;
  }

  button.send.stop,
  button.send-img.stop {
    color: var(--red-phosphor);
    border-color: var(--red-phosphor);
  }

  .img-thumbnail {
    max-height: 240px;
    max-width: 100%;
    border-radius: 2px;
    border: 1px solid var(--green-dim);
    cursor: pointer;
    transition: border-color 0.15s;
    object-fit: contain;
  }

  .img-thumbnail:hover {
    border-color: var(--green-phosphor);
  }

  .lightbox-overlay {
    position: fixed;
    inset: 0;
    background: rgba(8, 12, 8, 0.95);
    z-index: 5000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    touch-action: none;
  }

  .lightbox-img {
    max-width: 95vw;
    max-height: 95vh;
    border: 1px solid var(--green-phosphor);
    object-fit: contain;
  }

  .lightbox-close {
    position: absolute;
    top: 16px;
    right: 24px;
    color: var(--green-phosphor);
    cursor: pointer;
    z-index: 5001;
  }

  /* RETRY BUTTON MATCHES ASSISTANT GREEN PHOSPHOR */
  .retry-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin: 8px 0 0;
    padding: 4px 10px;
    background: transparent;
    border: 1px solid var(--green-phosphor);
    color: var(--green-phosphor);
    border-radius: 2px;
    font-size: 0.8em;
    font-family: var(--font-term);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .retry-btn:hover {
    background: var(--green-phosphor);
    color: var(--bg);
  }

  /* READ-ALOUD (TTS) BUTTON. Sits inline next to the retry button (added
   * after it, hence the small left margin) in the assistant's green
   * system-output space. While audio is playing it turns into a red stop
   * control (matching the send button's stop state): red = "active
   * process you may halt". Tapping it does NOT discard the audio data --
   * it merely pauses, and the cached blob survives so a later tap resumes
   * from the paused position without re-paying for synthesis. While the
   * LLM text-prep call and TTS synthesis are in flight, the button blinks
   * in place (busy state) and ignores taps. */
  .speak-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin: 8px 0 0 6px;
    padding: 4px 10px;
    background: transparent;
    border: 1px solid var(--green-phosphor);
    color: var(--green-phosphor);
    border-radius: 2px;
    font-size: 0.8em;
    font-family: var(--font-term);
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }

  .speak-btn:hover {
    background: var(--green-phosphor);
    color: var(--bg);
  }

  .speak-btn.playing {
    color: var(--red-phosphor);
    border-color: var(--red-phosphor);
  }

  .speak-btn.playing:hover {
    background: var(--red-phosphor);
    color: var(--bg);
  }

  .speak-btn.busy {
    animation: tts-busy-blink 0.8s infinite;
  }

  /* Binary on/off blink for the busy state, matching the cursor blink
   * philosophy (no fading transitions on a CRT). */
  @keyframes tts-busy-blink {
    0%, 49.9% { opacity: 1; }
    50%, 100% { opacity: 0.35; }
  }

  /* FULL-SCREEN CONFIG SCREEN OVERLAY (user input space: amber family) */
  .settings-screen {
    position: fixed;
    inset: 0;
    z-index: 4000;
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }

  /* Width is capped so the form is a reasonable CONSOLE WINDOW on wide
   * landscape screens, not a full-viewport slab: the old width:100% let
   * every input stretch edge-to-edge across the entire desktop monitor.
   * Horizontal centering comes free from the overlay (a column flex
   * container + margin:0 auto), no JS or positioning tricks. On narrow
   * screens max-width never bites and the form fills the viewport as
   * before. The amber-dim side edges are the window frame: per the
   * monochrome-CRT rule, every structural line uses the dim phosphor of
   * the space it lives in (amber = user input space). */
  .settings-form {
    width: 100%;
    max-width: 640px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border-left: 1px solid var(--amber-dim);
    border-right: 1px solid var(--amber-dim);
    margin: 0 auto;
    box-shadow: 0 0 24px rgba(0, 0, 0, 0.6);
  }

  .settings-header {
    flex: 0 0 auto;
    padding: 10px 14px;
    background: var(--amber-panel);
    border-bottom: 1px solid var(--amber-phosphor);
    color: var(--amber-phosphor);
    font-size: var(--font-size-base);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .settings-body {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .settings-body .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .settings-body label {
    font-size: 0.75em;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--amber-phosphor);
  }

  .settings-body input,
  .settings-body select,
  .settings-body textarea {
    width: 100%;
    background: var(--bg);
    color: var(--amber-phosphor);
    border: 1px solid var(--amber-dim);
    border-radius: 2px;
    padding: 8px 10px;
    font-family: var(--font-term);
    font-size: var(--font-size-base);
  }

  .settings-body input:focus-visible,
  .settings-body select:focus-visible,
  .settings-body textarea:focus-visible {
    outline: none;
    border-color: var(--amber-phosphor);
    box-shadow: 0 0 6px rgba(255, 174, 26, 0.4);
  }

  .field-history-wrap {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
  }

  .field-history-wrap input[type="text"] {
    border-top-right-radius: 0;
    border-bottom-right-radius: 0;
  }

  .history-toggle-btn {
    flex: 0 0 auto;
    height: 41px;
    padding: 0 10px;
    background: var(--bg);
    border: 1px solid var(--amber-dim);
    border-left: none;
    color: var(--amber-phosphor);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .history-toggle-btn:hover {
    background: var(--amber-dim);
    border-color: var(--amber-phosphor);
  }

  .history-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    z-index: 100;
    background: var(--amber-panel);
    border: 1px solid var(--amber-phosphor);
    max-height: 180px;
    overflow-y: auto;
    margin-top: 2px;
  }

  .history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    font-size: 0.85em;
    cursor: pointer;
    border-bottom: 1px solid var(--amber-dim);
  }

  .history-item:hover {
    background: var(--amber-phosphor);
    color: var(--bg);
  }

  .history-item-del {
    background: transparent;
    border: none;
    color: var(--amber-phosphor);
    cursor: pointer;
    padding: 2px 6px;
  }

  .history-item:hover .history-item-del {
    color: var(--red-phosphor);
  }

  .settings-footer {
    flex: 0 0 auto;
    padding: 12px 14px;
    background: var(--amber-panel);
    border-top: 1px solid var(--amber-dim);
    display: flex;
    gap: 10px;
  }

  /* SAVE and CANCEL each take exactly half of the available footer space:
   * flex-basis 0 with equal positive growth means the free space (minus
   * the gap) is split 50/50 regardless of each button's label length. */
  .settings-footer button.primary {
    flex: 1 1 0;
    background: var(--amber-phosphor);
    color: var(--bg);
    border: 1px solid var(--amber-phosphor);
    padding: 10px 14px;
    font-family: var(--font-term);
    font-size: 0.85em;
    text-transform: uppercase;
    cursor: pointer;
    font-weight: bold;
  }

  .settings-footer button.primary:hover {
    background: transparent;
    color: var(--amber-phosphor);
  }

  .settings-footer button.secondary {
    flex: 1 1 0;
    background: transparent;
    color: var(--amber-phosphor);
    border: 1px solid var(--amber-dim);
    padding: 10px 14px;
    font-family: var(--font-term);
    font-size: 0.85em;
    text-transform: uppercase;
    cursor: pointer;
  }

  .settings-footer button.secondary:hover {
    border-color: var(--amber-phosphor);
  }

  /* MARKDOWN & CODE BLOCKS - UNIFIED TYPEFACE & SIZE (system output: green) */
  .markdown-body {
    font-family: var(--font-term) !important;
    font-size: var(--font-size-base) !important;
    line-height: 1.45;
    color: var(--green-phosphor);
    text-align: left;
  }
  
  /* HYPERLINKS
   * Monochrome-phosphor terminals have no distinct "link blue": every
   * link in assistant output renders as the dim green structural color
   * of the system-output space and brightens to full phosphor on hover,
   * consistent with all other interactive elements. */
  .markdown-body a {
    text-decoration: underline;
    color: var(--green-dim);
    text-decoration-color: var(--green-dim);
  }

  .markdown-body a:hover {
    text-decoration: underline;
    color: var(--green-phosphor);
    text-decoration-color: var(--green-phosphor);
  }


  .markdown-body pre,
  .markdown-body code {
    font-family: var(--font-term) !important;
    font-size: var(--font-size-base) !important;
  }

  .markdown-body pre {
    background: var(--green-panel);
    border: 1px solid var(--green-dim);
    border-radius: 2px;
    padding: 12px;
    overflow-x: auto;
    margin: 0;
    text-align: left;
  }

  .code-block-wrapper {
    margin: 10px 0;
    border: 1px solid var(--green-dim);
    background: var(--green-panel);
    position: relative;
  }

  .code-block-wrapper.collapsed pre {
    max-height: 14.5em;
    overflow-y: hidden;
  }

  .code-expand-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: var(--bg);
    border-top: 1px solid var(--green-dim);
    cursor: pointer;
    font-size: 0.75em;
    color: var(--green-phosphor);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* CODE BLOCK ACTION BUTTONS (COPY / DOWNLOAD)
   * Freestanding icon buttons rendered OUTSIDE the bordered code-block
   * wrapper, directly below it, matching the placement and styling
   * philosophy of the edit-prompt and retry icons. Identical UX on touch
   * and desktop. Borders use the dim green structural color, matching the
   * code block frame they sit under. */
  .code-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 6px;
  }

  .code-actions button {
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: 1px solid var(--green-dim);
    color: var(--green-phosphor);
    border-radius: 2px;
    padding: 4px 10px;
    font-family: var(--font-term);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .code-actions button:hover {
    background: var(--green-phosphor);
    color: var(--bg);
  }
  
  /* DOWNLOAD BUTTON BUSY STATE (while the LLM filename is being generated).
   * Mirrors the speak-btn busy blink: the icon stays in place and blinks
   * in place (binary on/off, no fade -- matching the CRT cursor blink
   * philosophy), taps are ignored, and no text swaps in and out. */
  .code-actions button.busy {
    pointer-events: none;
    animation: code-busy-blink 0.8s infinite;
  }

  @keyframes code-busy-blink {
    0%, 49.9% { opacity: 1; }
    50%, 100% { opacity: 0.35; }
  }


  .markdown-body table {
    border-collapse: collapse;
    margin: 8px 0;
    width: 100%;
    border: 1px solid var(--green-dim);
  }

  .markdown-body th,
  .markdown-body td {
    border: 1px solid var(--green-dim);
    padding: 6px 10px;
    text-align: left;
  }

  .markdown-body thead th {
    background: var(--green-panel);
    color: var(--green-phosphor);
  }

  /* PERSISTENT SETTINGS-FORM ERROR (replaces the old ephemeral top popup) */
  .settings-error {
    flex: 0 0 auto;
    padding: 8px 14px 0;
    background: var(--amber-panel);
  }
</style>

  <!-- CRT OVERLAY -->
  <div class="crt-overlay"></div>

  <!-- MAIN CONSOLE SCREEN -->
  <div class="crt-screen-content">
    <div class="statusbar term-font green-txt" id="statusbar">
      <span id="statusHost"></span>
      <span id="statusModel" title="Tap to switch model"></span>
    </div>

    <!-- MODEL HISTORY DROPDOWN (opened by tapping the model name in the
         status bar; lives outside the status bar so it is not clipped by
         the status bar's overflow:hidden, and is positioned by JS). -->
    <div class="model-dropdown term-font" id="modelDropdown" style="display:none;" role="menu"></div>

    <div class="conversation-wrap" id="conversationWrap"></div>

    <!-- STATIC DECLARATIVE SETTINGS SCREEN (Avoids thrashing DOM innerHTML recreation on every modal toggle).
         NOTE ON PLACEHOLDERS: the form is always pre-filled from DEFAULT_CONFIG
         (first run) or the stored config (returning users) by loadSettingsIntoForm
         before this screen can ever become visible, so placeholders on pre-filled
         fields would never render. Placeholders are therefore kept ONLY on the two
         secret fields, which are deliberately left empty and serve as format hints.
         DEFAULT_CONFIG is the single source of truth for every default value. -->
    <div class="settings-screen" id="settingsScreen" style="display:none;">
      <div class="settings-form term-font">

  <!-- LIGHTBOX CONTAINER FOR FULLSCREEN IMAGE ZOOM -->

    <span class="lightbox-close" id="lightboxClose"><svg width="28" height="28"><use href="#icon-close"/></svg></span>
    <img id="lightboxImg" class="lightbox-img" src="" alt="Fullscreen View" />

<script>
  /* DOM ELEMENT REFERENCES. Naming convention: each module-level reference
   * mirrors the id of the element it holds; any parameter or local that
   * holds a DOM node ends in 'El'; the assistant's response element is
   * always called contentEl, never 'container'. */
  const conversationWrap = document.getElementById('conversationWrap');
  const promptInput = document.getElementById('promptInput');
  const sendBtn = document.getElementById('sendBtn');
  const sendImgBtn = document.getElementById('sendImgBtn');
  const statusHost = document.getElementById('statusHost');
  const statusModel = document.getElementById('statusModel');
  const statusbar = document.getElementById('statusbar');
  const modelDropdown = document.getElementById('modelDropdown');
  const settingsScreen = document.getElementById('settingsScreen');
  const inputbar = document.getElementById('inputbar');
  const gearBtn = document.getElementById('gearBtn');
  const fileInput = document.getElementById('fileInput');
  const attachBtn = document.getElementById('attachBtn');
  const settingsError = document.getElementById('settingsError');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxClose = document.getElementById('lightboxClose');

  /* APP STATE */
  let CONFIG = null;
  let conversationHistory = [];
  /* Monotonic per-turn identifier. Every user message DOM node gets one
   * (data-turn-id) and every conversationHistory entry created by that
   * turn carries the same value, so edit/retry can roll history back BY
   * TURN IDENTITY instead of by index arithmetic. The old code sliced
   * history at uIdx*2, which assumed user and assistant entries strictly
   * alternate -- an assumption broken by an aborted turn that streams no
   * text (its user entry stays in history with no assistant counterpart),
   * silently corrupting every slice taken after such a turn. */
  let nextTurnId = 1;
  /* Abort controller for the CURRENT turn's primary request(s), including
   * Tavily tool calls made within that turn. Created per-turn by
   * sendPrompt / sendImagePrompt / retryTurn; the stop button aborts it.
   * OWNERSHIP: only those three creators may null it (in their finally,
   * after isProcessing clears). The execute* functions that merely
   * receive the signal must not touch it: nulling it there opened a brief
   * window during teardown where a stop-button tap aborted nothing.
   * Subsidiary one-off requests (e.g. generateLLMFilename) deliberately do
   * NOT touch this handle -- they are passed no signal at all, so they can
   * neither be accidentally aborted nor clobber the live turn's controller. */
  let activeAbortController = null;
  let attachedFiles = [];
  /* Attachment CONTENT PARTS carried over from an edited (or retried) turn.
   * Unlike attachedFiles (raw File objects awaiting the picker->send hop),
   * these are already-built multimodal parts (image data-URLs, wrapped
   * file-text dumps) extracted from a previous turn's payload. They sit in
   * the input bar exactly like freshly picked attachments -- the attach
   * button lights up for them and a tap clears them -- and are re-embedded
   * into the payload on the next send, so an edited turn keeps its
   * attachments instead of silently dropping them. */
  let pendingPayloadParts = [];
  let isProcessing = false;
  let isAutoScrolling = false;
  let conversationMode = null;
  let lastGeneratedImageUrl = null;
  let scrollSpacer = null;
  const expandedCodeBlocksState = new Map();

  /**
   * Centralized HTTP Fetch wrapper.
   * Handles host cleaning, endpoint formatting and auth headers. The abort
   * signal is now an explicit parameter owned by the caller rather than a
   * global set here -- previously every call (including the incidental
   * filename-generation call made mid-stream from a code block's download
   * button) overwrote the global, breaking the stop button for the live
   * request. Callers that don't care pass no signal at all.
   */
  async function apiFetch(path, bodyData, signal) {
    const url = CONFIG.apiHost.replace(/\/$/, '') + '/' + path.replace(/^\//, '');
    return await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + CONFIG.apiKey
      },
      body: JSON.stringify(bodyData),
      signal: signal
    });
  }

  /**
   * Shared HTTP-failure diagnostic for user-facing error messages. Replaces
   * the old anonymous `res.statusText || '... failed'` pattern, under which
   * an HTTP 400 reached the screen as a bare "Bad Request" with no hint of
   * WHICH call failed, let alone why. Surfaces (1) the numeric status,
   * (2) the status text, and (3) the server's own error text -- parsed out
   * of a JSON error envelope when present, raw body otherwise -- bounded
   * so a verbose HTML error page cannot flood the console screen.
   */
  async function httpErrorDetail(res) {
    let detail = '';
    try {
      const raw = await res.text();
      try {
        const parsed = JSON.parse(raw);
        detail = parsed?.error?.message || parsed?.detail || parsed?.message || raw;
      } catch (e) {
        detail = raw; /* plain-text (or non-JSON) error body */
      }
    } catch (e) {
      /* body unreadable: the status line below is still reported */
    }
    detail = String(detail || '').trim();
    if (detail.length > 300) detail = detail.slice(0, 300) + ' [...]';
    return `HTTP ${res.status}${res.statusText ? ' ' + res.statusText : ''}` +
           (detail ? `: ${detail}` : ' (no response body)');
  }

  /**
   * Renders or removes the empty ASCII splash state based on message count.
   */
  function checkEmptyState() {
    let splashEl = document.getElementById('emptySplash');
    if (conversationHistory.length === 0) {
      if (!splashEl) {
        splashEl = document.createElement('div');
        splashEl.id = 'emptySplash';
        splashEl.className = 'empty-splash term-font';
        splashEl.innerHTML = `${ROBOT_SVG}<div class="splash-title">READY FOR INPUT</div>`;
        conversationWrap.appendChild(splashEl);
      }
    } else if (splashEl) {
      splashEl.remove();
    }
  }

  /* 
   * ==========================================================================
   * LIGHTBOX PINCH-TO-ZOOM / PAN CONTROLLER
   * Handles multi-touch pinch calculations and single-finger pan when zoomed.
   * ==========================================================================
   */
  let scale = 1, startDist = 0, initialScale = 1, translateX = 0, translateY = 0, startX = 0, startY = 0;

  function resetZoom() { 
    scale = 1; translateX = 0; translateY = 0; startDist = 0; initialScale = 1; 
    updateTransform(); 
  }

  function updateTransform() { 
    lightboxImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`; 
  }

  function getTouchDistance(t) { 
    return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); 
  }

  lightboxImg.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) { 
      startDist = getTouchDistance(e.touches); 
      initialScale = scale; 
    } else if (e.touches.length === 1 && scale > 1) { 
      startX = e.touches[0].clientX - translateX; 
      startY = e.touches[0].clientY - translateY; 
    }
  }, { passive: true });

  lightboxImg.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && startDist > 0) {
      scale = Math.min(Math.max(1, initialScale * (getTouchDistance(e.touches) / startDist)), 4);
      updateTransform();
    } else if (e.touches.length === 1 && scale > 1) {
      translateX = e.touches[0].clientX - startX; 
      translateY = e.touches[0].clientY - startY;
      updateTransform();
    }
  }, { passive: true });

  lightboxImg.addEventListener('touchend', (e) => { 
    if (e.touches.length < 2) startDist = 0; 
  });

  function openLightbox(src) { 
    lightboxImg.src = src; 
    lightbox.style.display = 'flex'; 
    resetZoom(); 
  }

  function closeLightbox() { 
    lightbox.style.display = 'none'; 
    lightboxImg.src = ''; 
    resetZoom(); 
  }

  lightboxClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => { 
    if (e.target === lightbox || e.target === lightboxClose) closeLightbox(); 
  });

  /**
   * Generates timestamp + tool-availability suffix for system prompts, so the
   * model is always told (a) the current date/time and (b) exactly which tools
   * it may use this turn -- including the case where the Tavily-backed tools
   * are not configured/allowed at all.
   */
  function getFormattedRuntimeContext() {
    const now = new Date();
    if (now.getMinutes() >= 30) now.setHours(now.getHours() + 1);
    now.setMinutes(0, 0, 0);
    const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    const timeStr = `Approximately ${String(now.getHours()).padStart(2,'0')}:00`;

    const maxCalls = getMaxTavilyCalls();
    const tavilyEnabled = !!CONFIG?.tavilyApiKey && maxCalls > 0;

    let toolLine = `No tools are available this turn.`;
    if (tavilyEnabled) {
      toolLine = `Tools get_youtube_transcript, web_search and fetch_web_page are available.\n` +
        `Follow each tool's description for its usage rules.\n` +
        `You may perform up to ${maxCalls} tool call${maxCalls === 1 ? '' : 's'} in total this turn.`;
    }
    return `# System Baseline Configuration\n` +
           `Date: ${dateStr}\n` +
           `Time: ${timeStr}\n\n` +
           `When summarizing a video, start right away with the substance, without ` +
           `introductions or boilerplate like the channel name, the view count, or 'In this video...'.\n` +
           `Write plain prose suited to be read aloud by a TTS engine, rather than bullet points. ` +
           `Omit advertisements, sponsored content and self-promotions. ` +
           `Include timestamps as links in the form ([MM:SS](https://youtu.be/<video_ID>?&t=<timestamp_seconds>)).\n\n` +
           `# Available Tools\n` +
           `${toolLine}\n\n` +
           `# User's Instructions\n`;
  }
  
  /*
   * ==========================================================================
   * YOUTUBE TRANSCRIPT EXTRACTOR TOOL (Tavily-backed) — LINE-LEVEL FILTERING
   * YouTube does not serve CORS headers on its pages or caption endpoints, so
   * all YouTube egress goes through Tavily's server-side extractor, which
   * returns the page content (not a guaranteed verbatim caption track).
   *
   * Sponsor segments are removed at CAPTION-LINE granularity: a line is
   * dropped when coalesced SponsorBlock intervals cover more than half of
   * its estimated span (the interval from its own timestamp to the next
   * line's timestamp; the last line assumes a 5-second span). Runs of
   * consecutive dropped lines collapse into a single "[...]" marker, so the
   * model both knows that content is missing and can see the timestamps
   * jumping across the gap. No word-timing interpolation: the consumer is
   * an LLM that will summarize the whole thing regardless, and half a line
   * of stray sponsor speech at a boundary costs it nothing.
   *
   * Parsing is STRICT by design: the transcript must contain a
   * "### Transcript" heading, every non-blank line under it must match the
   * "[M:SS] caption" grammar, and timestamps must never move backwards.
   * Any violation throws, so format drift is a loud tool error rather than
   * a silently mangled transcript.
   * ==========================================================================
   */
  const YT_SEGMENT_MERGE_GAP = 0.5;  /* s; segments closer than this are merged */
  const YT_LAST_LINE_SPAN = 5;       /* s; assumed span of the final caption line */

  /* Converts "HH:MM:SS" / "MM:SS" / "S" to total seconds; null if malformed. */
  function parseTimestampToSeconds(timestampStr) {
    if (!timestampStr) return null;
    const parts = timestampStr.split(':').map(Number);
    if (parts.some(isNaN)) return null;
    if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
    if (parts.length === 2) return parts[0] * 60 + parts[1];
    if (parts.length === 1) return parts[0];
    return null;
  }

  /* Formats seconds back to the [M:SS] / [H:MM:SS] caption style. */
  function formatSecondsAsTimestamp(totalSeconds) {
    const s = Math.max(0, Math.floor(totalSeconds));
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const ss = s % 60;
    if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
    return `${m}:${String(ss).padStart(2, '0')}`;
  }

  /* Splits the extracted content at the "### Transcript" heading into a
   * preamble (title/description, left untouched) and the transcript body.
   * A missing heading is a contract violation and throws. */
  function splitContentAtTranscriptHeading(content) {
    const marker = '### Transcript';
    const idx = content.indexOf(marker);
    if (idx === -1) {
      throw new Error(`Tavily extract does not contain a "${marker}" heading -- ` +
        'unexpected format, cannot isolate the transcript.');
    }
    const preamble = content.slice(0, idx).trimEnd();
    const transcript = content.slice(idx + marker.length).replace(/^\s*\n/, '');
    return { preamble, transcript };
  }

  /* The caption-line grammar Tavily emits: a bracketed timestamp at the
   * very start of the line, a space, then the caption text. STRICT: any
   * non-blank line that does not match throws, as does a timestamp that
   * moves backwards. No fallbacks; deal with format drift if it happens. */
  const YT_CAPTION_LINE_RE = /^\[(\d{1,2}:\d{2}(?::\d{2})?)\] (.*)$/;

  function parseTranscriptEntries(transcript) {
    const lines = transcript.split('\n');
    const entries = [];
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (!line.trim()) continue;
      const m = line.match(YT_CAPTION_LINE_RE);
      if (!m) {
        throw new Error(`Transcript line ${i + 1} does not match the expected "[M:SS] caption" ` +
          `format: ${JSON.stringify(line.slice(0, 120))}`);
      }
      const time = parseTimestampToSeconds(m[1]);
      if (time === null) {
        throw new Error(`Transcript line ${i + 1} has an unparseable timestamp: ` +
          JSON.stringify(line.slice(0, 120)));
      }
      const prev = entries[entries.length - 1];
      if (prev && time < prev.time) {
        throw new Error(`Transcript line ${i + 1} timestamp moved backwards ` +
          `(${formatSecondsAsTimestamp(prev.time)} -> ${formatSecondsAsTimestamp(time)})` +
          `${JSON.stringify(line.slice(0, 120))}`);
      }
      entries.push({ time, text: m[2] });
    }
    if (entries.length === 0) {
      throw new Error('Transcript section contained no caption lines.');
    }
    return entries;
  }

  /* Fetches skip segments from SponsorBlock (serves CORS headers, so this
   * goes direct; only YouTube egress needs Tavily). The server has already
   * filtered submissions by its vote/view thresholds, so everything
   * returned is kept: segments are deduplicated by UUID and merged into
   * union intervals when they overlap or nearly touch -- the way playback
   * experiences them. Categories are part of the request (unchanged by
   * design decision) but carry no per-category weight here. Any failure
   * -- network, HTTP, malformed JSON -- degrades to "no segments", which
   * means the transcript is returned unfiltered rather than the tool
   * failing on a free side-service. Abort is rethrown so the stop button
   * tears down the whole turn. */
  async function fetchSponsorBlockSegments(videoId, signal = null) {
    const categories = JSON.stringify([
      'sponsor', 'selfpromo', 'exclusive_access', 'interaction',
      'intro', 'preview', 'outro', 'filler'
    ]);
    const url = `https://sponsor.ajay.app/api/skipSegments?videoID=${encodeURIComponent(videoId)}&categories=${encodeURIComponent(categories)}`;
    try {
      const res = await fetch(url, { method: 'GET', signal });
      if (!res.ok) return []; /* 404 = no segments; other errors degrade too */
      const data = await res.json();
      if (!Array.isArray(data)) return [];
      const valid = data
        .filter(item => item && item.segment &&
          typeof item.segment[0] === 'number' && typeof item.segment[1] === 'number' &&
          item.segment[1] >= item.segment[0] && item.segment[0] >= 0)
        .map(item => ({ start: item.segment[0], end: item.segment[1], uuid: item.UUID }));
      const byUuid = new Map();
      for (const seg of valid) if (seg.uuid && !byUuid.has(seg.uuid)) byUuid.set(seg.uuid, seg);
      const sorted = [...byUuid.values()].sort((a, b) => a.start - b.start);
      const merged = [];
      for (const seg of sorted) {
        const last = merged[merged.length - 1];
        if (last && seg.start <= last.end + YT_SEGMENT_MERGE_GAP) {
          last.end = Math.max(last.end, seg.end);
        } else {
          merged.push({ start: seg.start, end: seg.end });
        }
      }
      return merged;
    } catch (e) {
      if (e && (e.name === 'AbortError' || (signal && signal.aborted))) throw e;
      return [];
    }
  }

  /* Line-level filter: drops each caption line whose estimated span is more
   * than half covered by coalesced segments; consecutive drops collapse into
   * one "[...]" marker. */
  function filterTranscriptLines(entries, segments) {
    const kept = [];
    let inGap = false;
    for (let i = 0; i < entries.length; i++) {
      const start = entries[i].time;
      const end = (i + 1 < entries.length) ? entries[i + 1].time : start + YT_LAST_LINE_SPAN;
      const span = Math.max(end - start, 0.001);
      let covered = 0;
      for (const seg of segments) {
        covered += Math.max(0, Math.min(seg.end, end) - Math.max(seg.start, start));
      }
      if (covered > span / 2) { inGap = true; continue; }
      if (inGap) { kept.push('[...]'); inGap = false; }
      kept.push(`[${formatSecondsAsTimestamp(start)}] ${entries[i].text}`);
    }
    if (inGap) kept.push('[...]');
    return kept.join('\n');
  }

  /* Strict extractor: a bare 11-char video ID or any standard watch/embed/
   * shorts/share URL form; anything else returns null so the caller reports
   * a proper tool error. */
  function extractYouTubeVideoId(input) {
    if (!input) return null;
    const cleaned = input.trim();
    if (/^[a-zA-Z0-9_-]{11}$/.test(cleaned)) return cleaned;
    const match = cleaned.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|shorts\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
    return match ? match[1] : null;
  }

  /* Fetch the transcript of a YouTube video with SponsorBlock-flagged
   * segments removed. Tavily extract and SponsorBlock run concurrently.
   * The payload is deliberately minimal: the model consumes `content`; the
   * identity fields exist only so it can cite the source. */
  async function fetchYouTubeTranscript(videoInput, preferredLang = "en", signal = null) {
    const videoId = extractYouTubeVideoId(videoInput);
    if (!videoId) throw new Error("Invalid YouTube Video ID or URL");
    if (!CONFIG?.tavilyApiKey) throw new Error('Tavily API key not configured');
    const watchUrl = `https://www.youtube.com/watch?v=${videoId}`;

    const [rawResults, segments] = await Promise.all([
      executeTavilyRequest('extract', { urls: [watchUrl] }, 'Extraction failed', signal),
      fetchSponsorBlockSegments(videoId, signal)
    ]);

    const rawContent = rawResults
      .map(r => (typeof r === 'string' ? r : (r.raw_content || r.content || '')))
      .filter(Boolean)
      .join('\n\n');
    if (!rawContent) throw new Error("Video page was fetched but contained no extractable content.");

    const { preamble, transcript } = splitContentAtTranscriptHeading(rawContent);
    const entries = parseTranscriptEntries(transcript);
    const body = segments.length ? filterTranscriptLines(entries, segments) : null;
    const finalTranscript = body ?? entries.map(e => `[${formatSecondsAsTimestamp(e.time)}] ${e.text}`).join('\n');

    const parts = [];
    if (preamble) parts.push(preamble);
    parts.push('### Transcript\n' + finalTranscript);
    return JSON.stringify({
      video_id: videoId,
      language: preferredLang,
      source: 'tavily_extract',
      page_url: watchUrl,
      content: parts.join('\n\n')
    });
  }

  /* 
   * ==========================================================================
   * TAVILY SERVICE INTEGRATION
   * All web egress goes through Tavily's server-side APIs. The shared
   * executeTavilyRequest core handles the key guard, POST and error
   * normalization; the wrappers below only shape per-call payloads. All
   * entry points take the current turn's abort signal, so the stop button
   * cancels an in-flight search. AbortError is rethrown by the callers (not
   * swallowed into a tool-error result) so the whole turn tears down cleanly.
   * ==========================================================================
   */
  async function executeTavilyRequest(endpoint, body, failureMsg, signal) {
    if (!CONFIG?.tavilyApiKey) throw new Error('Tavily API key not configured');
    const res = await fetch('https://api.tavily.com/' + endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + CONFIG.tavilyApiKey },
      body: JSON.stringify(body),
      signal: signal
    });
    if (!res.ok) throw new Error((await res.json().catch(() => null))?.detail || res.statusText || failureMsg);
    return (await res.json()).results || [];
  }

  async function executeTavilySearch(query, signal) {
    return JSON.stringify(await executeTavilyRequest(
      'search',
      { query: query, max_results: 5, search_depth: 'basic' },
      'Search failed', signal));
  }

  async function executeTavilyExtract(urls, signal) {
    const list = Array.isArray(urls) ? urls : [urls];
    return JSON.stringify(await executeTavilyRequest('extract', { urls: list }, 'Extraction failed', signal));
  }

  /**
   * Mode Lock: Prevents mixing chat stream mode and image generation mode in a single timeline.
   */
  function lockConversationMode(mode) {
    if (!conversationMode) {
      conversationMode = mode;
      sendImgBtn.disabled = (mode === 'chat');
      sendBtn.disabled = (mode === 'image');
      attachBtn.disabled = (mode === 'image');
    }
  }

  /* 
   * ==========================================================================
   * MARKDOWN RENDERING & CODE BLOCK ENHANCEMENT
   * Uses requestAnimationFrame to throttle markdown parsing on fast SSE streams.
   * ==========================================================================
   */
  let renderScheduled = false, pendingRenderData = null;

  function renderMarkdownThrottled(contentEl, text) {
    pendingRenderData = { contentEl, text };
    if (!renderScheduled) {
      renderScheduled = true;
      requestAnimationFrame(() => {
        if (pendingRenderData) renderMarkdown(pendingRenderData.contentEl, pendingRenderData.text);
        renderScheduled = false;
      });
    }
  }

  function renderMarkdown(contentEl, text) {
    contentEl.classList.remove('placeholder');
    contentEl.innerHTML = (typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined')
      ? DOMPurify.sanitize(marked.parse(text))
      : escapeHtml(text);
    enhanceCodeBlocks(contentEl);
    /* Every render (streamed frame or telemetry line) grows the message, so
     * re-fit the spacer on every render: the deeper the real content, the
     * less phantom height remains. No-op once the turn has ended and the
     * spacer has been retired. */
    sizeScrollSpacer(contentEl.parentElement);
  }

  /**
   * Whitelist + contract sanitizer for download filenames. The raw value
   * comes from LLM output (which is itself steerable via prompt injection
   * through the code snippet's own comments), so it is treated as doubly
   * untrusted. Beyond the original charset/path destruction it now also
   * ENFORCES THE FILENAME CONTRACT, no matter what the model replies:
   * whitespace becomes hyphens (words stay separated instead of being
   * welded into one giant token), the name is capped at 7 hyphen-
   * separated words and 60 chars (prose-style narration collapses to a
   * name-shaped stem), and the extension, if present, survives the caps.
   * Worst case output is a boring "snippet.txt". Blacklists are not used
   * on principle.
   */
  function sanitizeFilename(raw) {
    const MAX_WORDS = 7;
    const MAX_CHARS = 60;
    let base = String(raw || '')
      .split(/\r?\n/)[0]                       /* first line only: narration past line 1 is discarded */
      .split(/[\\/]/).pop()                    /* kill path components outright */
      .replace(/\s+/g, '-')                    /* keep words separated: whitespace -> hyphens */
      .replace(/[^a-zA-Z0-9._-]/g, '')        /* allowlist only safe chars */
      .replace(/-{2,}/g, '-')                  /* collapse hyphen runs */
      .replace(/\.{2,}/g, '.')                 /* collapse '..' runs */
      .replace(/^[-.]+|[-.]+$/g, '');          /* no leading/trailing dots or dashes */

    /* Enforce the 1-7-word contract: prose-like output is truncated to
     * the first seven hyphen-separated words. */
    const words = base.split('-').filter(Boolean);
    base = (words.length > MAX_WORDS ? words.slice(0, MAX_WORDS) : words).join('-');
    if (!base) return 'snippet.txt';

    /* Enforce the length cap, preserving the extension across it. */
    const m = base.match(/\.[a-zA-Z0-9]{1,8}$/);
    const ext = m ? m[0] : '.txt';
    let stem = m ? base.slice(0, base.length - m[0].length) : base;
    if (stem.length > MAX_CHARS - ext.length) stem = stem.slice(0, MAX_CHARS - ext.length).replace(/[-.]+$/, '');
    return (stem || 'snippet') + ext;
  }

  /**
   * Queries the configured chat model -- with service_tier 'priority' to
   * reduce latency -- to dynamically generate a clean filename for code
   * download buttons. Deliberately abortable by nothing: this is a
   * fire-and-forget subsidiary call and is passed no signal, so it cannot
   * clobber the active turn's abort controller.
   *
   * The model receives 2 KB of snippet context (1 KB often captured only a
   * file's comment header, which the model then summarized instead of
   * naming the code) and a detailed system prompt with a one-shot example,
   * so it names the CODE rather than narrating the request. Only the first
   * line of the reply is kept -- anything the model says past the newline
   * is discarded rather than welded into the name -- and the final shape
   * is enforced by sanitizeFilename at the call site.
   */
  async function generateLLMFilename(codeText) {
    if (!CONFIG || !CONFIG.apiKey) return 'snippet.txt';
    try {
      const res = await apiFetch(CONFIG.apiPath, {
        model: CONFIG.model,
        reasoning_effort: 'low',
        service_tier: 'priority',
        temperature: 0.1,
        max_tokens: 25,
        stream: false,
        messages: [
          { role: 'system', content:
              'You generate download filenames for code snippets.\n' +
              'Rules:\n' +
              '1. Output ONLY the filename, nothing else. ' +
                 'No explanation, no preamble, no quotes, no backticks, no sentence structure.\n' +
              '2. Output 1-7 lowercase words separated by single hyphens, plus the correct ' +
                 'file extension (e.g. .py, .js, .html, .sql, .txt).\n' +
              '3. The output must describe the CONTENTS of the user submission, using its most salient nouns. ' +
                 'Never describe the request itself\n' +
              '4. If unsure, output: snippet.txt\n' +
              'Example input: a Python function implementing merge sort\n' +
              'Example output: merge-sort.py' },
          { role: 'user', content: codeText.slice(0, 2048) }
        ]
      });
      if (!res.ok) return 'snippet.txt';
      /* First line only. The old post-processing stripped ALL whitespace,
       * welding a narrated sentence into one giant word; the word/length
       * contract is now enforced by sanitizeFilename at the call site. */
      return ((await res.json())?.choices?.[0]?.message?.content || '')
        .split(/\r?\n/)[0].trim() || 'snippet.txt';
    } catch (e) { 
      return 'snippet.txt'; 
    }
  }

  /* Global click-away handler for settings history dropdowns AND the status
   * bar model dropdown. */
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.field-history-wrap') &&
        !e.target.closest('#statusModel') &&
        !e.target.closest('#modelDropdown')) {
      document.querySelectorAll('.history-dropdown, #modelDropdown').forEach(el => el.style.display = 'none');
    }
  });

  /* Wraps a bare <pre> in the collapsible code-block wrapper (idempotent). */
  function ensureCodeBlockWrapper(pre) {
    let wrapper = pre.parentElement;
    if (!wrapper || !wrapper.classList.contains('code-block-wrapper')) {
      wrapper = document.createElement('div');
      wrapper.className = 'code-block-wrapper';
      pre.parentNode.insertBefore(wrapper, pre);
      wrapper.appendChild(pre);
    }
    return wrapper;
  }

  /* COLLAPSE / EXPAND BAR FOR LONG BLOCKS. Blocks over 10 lines start
   * collapsed; expansion state is remembered across re-renders, keyed by
   * the first 120 chars of the snippet. */
  function applyCollapseBehavior(wrapper, readCode) {
    const codeTextNow = readCode();
    if (codeTextNow.split('\n').length <= 10) {
      wrapper.classList.remove('collapsed');
      wrapper.querySelector('.code-expand-bar')?.remove();
      return;
    }

    const snippetKey = codeTextNow.slice(0, 120);
    const isExpanded = expandedCodeBlocksState.get(snippetKey) === true;
    wrapper.classList.toggle('collapsed', !isExpanded);

    let expandBar = wrapper.querySelector('.code-expand-bar') || document.createElement('div');
    expandBar.className = 'code-expand-bar';
    expandBar.innerHTML = isExpanded ? `${useIcon('chevronUp', 12, 12)} COLLAPSE` : `${useIcon('chevronDown', 12, 12)} EXPAND`;
    if (!expandBar.parentElement) wrapper.appendChild(expandBar);

    expandBar.onclick = (e) => {
      e.stopPropagation();
      const collapsed = wrapper.classList.toggle('collapsed');
      expandedCodeBlocksState.set(snippetKey, !collapsed);
      expandBar.innerHTML = !collapsed ? `${useIcon('chevronUp', 12, 12)} COLLAPSE` : `${useIcon('chevronDown', 12, 12)} EXPAND`;
    };
  }

  /* COPY / DOWNLOAD ACTION BUTTONS. Rendered as a freestanding row
   * OUTSIDE the bordered code-block wrapper, directly below it, matching
   * the placement and styling philosophy of the edit-prompt and retry
   * icons. Idempotent: enhanceCodeBlocks re-runs on every render frame
   * (and renderMarkdown rebuilds the container's DOM each time), so the
   * nextElementSibling check guards against duplicating the row within a
   * single frame. */
  function ensureCodeActions(wrapper, readCode) {
    let actions = wrapper.nextElementSibling;
    if (actions && actions.classList.contains('code-actions')) return;

    actions = document.createElement('div');
    actions.className = 'code-actions';
    wrapper.parentNode.insertBefore(actions, wrapper.nextSibling);

    const copyBtn = document.createElement('button');
    copyBtn.title = 'Copy code';
    copyBtn.setAttribute('aria-label', 'Copy code');
    copyBtn.innerHTML = useIcon('copy', 14, 14);
    copyBtn.onclick = async (e) => {
      e.stopPropagation();
      try { await navigator.clipboard.writeText(readCode()); } catch (err) {}
    };

    const dlBtn = document.createElement('button');
    dlBtn.title = 'Download code';
    dlBtn.setAttribute('aria-label', 'Download code');
    dlBtn.innerHTML = useIcon('download', 14, 14);
    dlBtn.onclick = async (e) => {
      e.stopPropagation();
      /* Re-entry guard: while busy the button ignores taps via CSS, but
       * this guard also protects against the async race of a second
       * click landing before the class lands. */
      if (dlBtn.classList.contains('busy')) return;
      /* Busy blink replaces the old '-- Downloading --' text swap: the
       * icon stays in place and blinks while the LLM names the file. */
      dlBtn.classList.add('busy');
      try {
        const code = readCode();
        const filename = sanitizeFilename(await generateLLMFilename(code));
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([code], { type: 'text/plain' }));
        a.download = filename;
        a.click();
        URL.revokeObjectURL(a.href);
      } finally {
        dlBtn.classList.remove('busy');
      }
    };
    actions.append(copyBtn, dlBtn);
  }

  function enhanceCodeBlocks(containerEl) {
    containerEl.querySelectorAll('pre').forEach((pre) => {
      const wrapper = ensureCodeBlockWrapper(pre);
      /* The code text is read lazily (at click time) rather than captured
       * in a closure here, because enhanceCodeBlocks re-runs on every
       * render frame while a response is still streaming in. A closure
       * would freeze a truncated mid-stream snapshot. */
      const readCode = () => wrapper.querySelector('code')?.textContent ?? pre.textContent ?? '';
      applyCollapseBehavior(wrapper, readCode);
      ensureCodeActions(wrapper, readCode);
    });
  }

  function setError(contentEl, message) {
    contentEl.classList.remove('placeholder');
    dismissThinking(contentEl);
    contentEl.innerHTML += `<div class="error-msg-text">&lt; ERROR: ${escapeHtml(message)} &gt;</div>`;
  }
  
  function finalizeStoppedResponse(contentEl, text) {
    pendingRenderData = null;
    contentEl.classList.remove('placeholder');
    dismissThinking(contentEl);
    /* Abort finishes the turn: same spacer retirement as
     * completeAssistantTurn, so a stopped reply also becomes the scroll
     * floor. */
    removeScrollSpacer();
    if (text) renderMarkdown(contentEl, text); else contentEl.textContent = '';
    contentEl.innerHTML += `<div class="error-msg-text">&lt; EXECUTION ABORTED BY USER &gt;</div>`;
  }

  /* Persistent (non-ephemeral) error text for the settings form, shown
   * inline under the fields rather than in a popup. */
  function showSettingsError(message) {
    settingsError.textContent = '< ERROR: ' + message + ' >';
    settingsError.style.display = 'block';
  }

  function clearSettingsError() {
    settingsError.style.display = 'none';
    settingsError.textContent = '';
  }

  /* 
   * ==========================================================================
   * STATIC DECLARATIVE SETTINGS CONTROLLER
   * Reads from / writes to HTML static inputs instead of constructing innerHTML.
   * ==========================================================================
   */
  /* History values are arbitrary user-entered strings and are now built via
   * DOM APIs with textContent / closures -- no string interpolation into
   * attributes. (The old data-val="${escapeHtml(item)}" pattern was an
   * attribute-injection vector: the previous escapeHtml did not encode
   * quotes, so a value containing " could break out and carry arbitrary
   * attributes into the settings screen, which has access to the config
   * in localStorage.) */
  function populateHistoryDropdown(key) {
    const dropdown = document.getElementById('history-dropdown-' + key);
    const input = document.getElementById('field-' + key);
    const list = getHistory(key);
    dropdown.innerHTML = '';

    if (list.length === 0) {
      const emptyEl = document.createElement('div');
      emptyEl.className = 'history-item amber-txt';
      emptyEl.style.cursor = 'default';
      emptyEl.style.opacity = '0.6';
      emptyEl.textContent = '< NO SAVED HISTORY >';
      dropdown.appendChild(emptyEl);
      return;
    }

    list.forEach(item => {
      const itemEl = document.createElement('div');
      itemEl.className = 'history-item amber-txt';

      const label = document.createElement('span');
      label.className = 'history-item-text term-font';
      label.textContent = item;

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'history-item-del';
      del.title = 'Delete entry';
      del.innerHTML = useIcon('trash', 13, 13);

      itemEl.append(label, del);
      itemEl.onclick = (e) => {
        if (e.target.closest('.history-item-del')) {
          e.stopPropagation();
          removeHistoryValue(key, item);
          populateHistoryDropdown(key);
        } else {
          input.value = item;
          dropdown.style.display = 'none';
        }
      };
      dropdown.appendChild(itemEl);
    });
  }

  function loadSettingsIntoForm() {
    const cfg = CONFIG || DEFAULT_CONFIG;
    Object.keys(DEFAULT_CONFIG).forEach(key => {
      const field = document.getElementById('field-' + key);
      if (field) field.value = cfg[key] !== undefined ? cfg[key] : '';
    });
    document.getElementById('cancelSettingsBtn').style.display = CONFIG ? 'inline-block' : 'none';
  }

  function saveSettingsFromForm() {
    ['apiHost', 'apiPath', 'model', 'visionModel', 'imageModel'].forEach(k => {
      const val = document.getElementById('field-' + k)?.value;
      if (val) addHistoryValue(k, val);
    });

    const newConfig = {
      apiKey:          document.getElementById('field-apiKey').value.trim(),
      apiHost:         document.getElementById('field-apiHost').value.trim(),
      apiPath:         document.getElementById('field-apiPath').value.trim(),
      tavilyApiKey:    document.getElementById('field-tavilyApiKey').value.trim(),
      maxTavilyCalls:  parseMaxTavilyCalls(document.getElementById('field-maxTavilyCalls').value),
      serviceTier:     document.getElementById('field-serviceTier').value,
      model:           document.getElementById('field-model').value.trim(),
      visionModel:     document.getElementById('field-visionModel').value.trim(),
      imageModel:      document.getElementById('field-imageModel').value.trim() || DEFAULT_CONFIG.imageModel,
      reasoningEffort: document.getElementById('field-reasoningEffort').value,
      imageResolution: document.getElementById('field-imageResolution').value,
      imageQuality:    document.getElementById('field-imageQuality').value,
      imageStyle:      document.getElementById('field-imageStyle').value,
      ttsVoice:        document.getElementById('field-ttsVoice').value,
      ttsInstruct:     document.getElementById('field-ttsInstruct').value.trim(),
      systemPrompt:    document.getElementById('field-systemPrompt').value.trim(),
      extraParams:     {}
    };

    if (!newConfig.apiKey || !newConfig.apiHost || !newConfig.apiPath || !newConfig.model) {
      showSettingsError('Please fill in all required fields.');
      return;
    }

    clearSettingsError();
    CONFIG = newConfig;
    saveConfig(CONFIG);
    settingsScreen.style.display = 'none';
    updateStatusBar();
    promptInput.focus();
  }

  document.querySelectorAll('.history-toggle-btn').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const key = btn.getAttribute('data-key');
      const dropdown = document.getElementById('history-dropdown-' + key);
      const isOpen = dropdown.style.display === 'block';
      document.querySelectorAll('.history-dropdown').forEach(el => el.style.display = 'none');
      if (!isOpen) { populateHistoryDropdown(key); dropdown.style.display = 'block'; }
    };
  });

  document.getElementById('saveSettingsBtn').onclick = saveSettingsFromForm;
  document.getElementById('cancelSettingsBtn').onclick = () => { clearSettingsError(); settingsScreen.style.display = 'none'; promptInput.focus(); };
  gearBtn.onclick = () => { clearSettingsError(); loadSettingsIntoForm(); settingsScreen.style.display = 'flex'; };

  function updateStatusBar(activeModel = null) {
    if (!CONFIG) { statusHost.textContent = 'NOT CONFIGURED'; statusModel.textContent = ''; return; }
    statusHost.textContent = extractDomainName(CONFIG.apiHost);
    /* The model name doubles as the model-history dropdown toggle; the
     * trailing chevron is the tap affordance. (Built via innerHTML with
