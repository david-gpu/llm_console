     * escapeHtml on the dynamic part; the SVG comes from our own sprite.) */
    statusModel.innerHTML = escapeHtml((activeModel || CONFIG.model).split('/').pop()) +
      ' ' + useIcon('chevronDown', 12, 12);
  }

  /*
   * ==========================================================================
   * STATUS BAR MODEL-HISTORY DROPDOWN
   * Tapping the model name on the top-right opens a drop-down listing every
   * model that had previously been selected (the same 'model' history store
   * the settings screen maintains). Selecting an entry switches the active
   * chat model immediately (persisted to localStorage), so the next turn --
   * without opening the config screen -- runs against the chosen model.
   * ==========================================================================
   */
  function populateModelDropdown() {
    modelDropdown.innerHTML = '';

    /* History is the source of truth; the currently configured model is
     * force-included (at the front) so the active choice is always visible
     * even if it was never explicitly saved into the history store. */
    const list = [];
    if (CONFIG?.model) list.push(CONFIG.model);
    getHistory('model').forEach(m => { if (!list.includes(m)) list.push(m); });

    if (list.length === 0) {
      const emptyEl = document.createElement('div');
      emptyEl.className = 'history-item term-font';
      emptyEl.style.cursor = 'default';
      emptyEl.style.opacity = '0.6';
      emptyEl.textContent = '< NO MODEL HISTORY >';
      modelDropdown.appendChild(emptyEl);
      return;
    }

    list.forEach(m => {
      const itemEl = document.createElement('div');
      itemEl.className = 'history-item term-font';
      const isCurrent = CONFIG && m === CONFIG.model;
      if (isCurrent) itemEl.classList.add('current');
      /* Prompt taxonomy: the active selection is prefixed with '>'. */
      itemEl.textContent = (isCurrent ? '> ' : '  ') + m;
      itemEl.title = m;
      itemEl.onclick = (e) => {
        e.stopPropagation();
        if (CONFIG && m !== CONFIG.model) {
          CONFIG.model = m;
          saveConfig(CONFIG);
          updateStatusBar();
        }
        modelDropdown.style.display = 'none';
      };
      modelDropdown.appendChild(itemEl);
    });
  }

  function toggleModelDropdown() {
    if (!CONFIG) return;
    if (modelDropdown.style.display === 'block') {
      modelDropdown.style.display = 'none';
      return;
    }
    populateModelDropdown();
    /* Anchor directly under the status bar (measured, not hardcoded). */
    modelDropdown.style.top = statusbar.offsetHeight + 'px';
    modelDropdown.style.display = 'block';
  }

  statusModel.onclick = (e) => { e.stopPropagation(); toggleModelDropdown(); };

  /* FILE ATTACHMENTS
   * No filenames are rendered in the input row (they tend to fill the
   * whole space) — instead the attach button itself is highlighted
   * ("active") whenever there are pending attachments, whether those are
   * freshly picked files (attachedFiles) or attachment parts carried over
   * from an edited/retried turn (pendingPayloadParts). Tapping it while
   * active clears them; tapping it while inactive opens the file picker. */
  attachBtn.onclick = () => {
    if (conversationMode === 'image') return;
    if (attachedFiles.length > 0 || pendingPayloadParts.length > 0) {
      attachedFiles = [];
      pendingPayloadParts = [];
      updateAttachButtonState();
    } else {
      fileInput.click();
    }
  };
  fileInput.onchange = (e) => {
    attachedFiles = attachedFiles.concat(Array.from(e.target.files));
    updateAttachButtonState();
    fileInput.value = '';
  };

  function updateAttachButtonState() {
    const count = attachedFiles.length + pendingPayloadParts.length;
    attachBtn.classList.toggle('active', count > 0);
    attachBtn.title = count > 0
      ? `${count} attachment(s) pending — tap to clear`
      : 'Attach file';
  }

  /* Extracts the attachment CONTENT PARTS (image_url parts and wrapped
   * file-text dumps) from a turn's multimodal payload, excluding the
   * prompt text part. Used to carry attachments across EDIT and RETRY so
   * they don't fall through the cracks when a turn is re-submitted. */
  function extractAttachmentParts(payload) {
    if (!Array.isArray(payload)) return [];
    return payload.filter(p => p && (p.type === 'image_url' ||
      (p.type === 'text' && p.text && p.text.startsWith('\n=== FILE:'))));
  }

  /* Recovers the ORIGINAL PROMPT TEXT from a turn payload -- the text the
   * user actually typed, as opposed to the display label shown in the
   * message bubble. For a string payload it IS the prompt; for a parts
   * array the prompt is the (single) non-file text part: buildMultimodal
   * puts the prompt text part first (if the user typed anything), carried
   * parts and file dumps all carry the '\n=== FILE:' marker or the
   * image_url type, so they are excluded here. Returns '' for an
   * attachment-only turn. Used by retryTurn so that a subsequent EDIT of
   * the retried turn puts the real prompt into the input box, not the
   * synthetic '-- files attached --' display label. */
  function promptTextFromPayload(payload) {
    if (typeof payload === 'string') return payload;
    if (!Array.isArray(payload)) return '';
    const part = payload.find(p => p && p.type === 'text' && !p.text.startsWith('\n=== FILE:'));
    return part ? part.text : '';
  }

  async function buildMultimodalContent(promptText, files, carriedParts = []) {
    const parts = promptText ? [{ type: 'text', text: promptText }] : [];
    /* Carried parts (from an edited/retried turn) are prepended after the
     * (possibly re-edited) prompt text, before any newly picked files. */
    parts.push(...carriedParts);
    for (const file of files) {
      if (file.type.startsWith('image/')) {
        const dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
        parts.push({ type: 'image_url', image_url: { url: dataUrl } });
      } else {
        const txt = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsText(file); });
        parts.push({ type: 'text', text: `\n=== FILE: ${file.name} ===\n${txt}\n=== END FILE ===` });
      }
    }
    return parts.length === 1 && parts[0].type === 'text' ? parts[0].text : parts;
  }

  /* 
   * ==========================================================================
   * SCROLLING, SPACER & KEYBOARD DISMISSAL LOGIC
   * Uses precise offset deltas and temporary height spacers to anchor the 
   * assistant element flush against the status bar upon execution.
   * ==========================================================================
   */
  function autoGrow() {
    /* The clamp bounds live in CSS (--input-min-h / --input-max-h), the
     * single source of truth for the input box geometry; read them back
     * from the computed style so the JS clamp can never drift from CSS. */
    const style = getComputedStyle(promptInput);
    const minH = parseFloat(style.minHeight);
    const maxH = parseFloat(style.maxHeight);
    promptInput.style.height = 'auto';
    promptInput.style.height = Math.max(minH, Math.min(promptInput.scrollHeight, maxH)) + 'px';
    /* The textarea's height feeds into the input bar's natural height, so
     * re-apply the current hide amount against the (possibly new) natural
     * height to keep it consistent. */
    setInputBarHiddenPx(inputBarHiddenPx, false);
  }
  promptInput.addEventListener('input', autoGrow);

  /* Input bar visibility is expressed as a single px value: how much of the
   * bar's natural height is currently tucked away below the bottom edge.
   * 0 = fully visible, offsetHeight = fully hidden. Driving both the
   * negative margin-bottom (which shrinks the bar's reserved space in the
   * flex column, letting the conversation viewer reclaim it) AND the
   * effective on-screen position from this one value keeps the two
   * perfectly in sync: the bar slides down as a rigid whole, disappearing
   * under the bottom edge, while the conversation grows into the space
   * it vacates — at exactly the same rate, in either direction. */
  let inputBarHiddenPx = 0;

  function setInputBarHiddenPx(px, animate) {
    const natural = inputbar.offsetHeight;
    inputBarHiddenPx = Math.max(0, Math.min(natural, px));
    inputbar.classList.toggle('animate-visibility', !!animate);
    inputbar.classList.toggle('fully-hidden', inputBarHiddenPx >= natural - 0.5);
    inputbar.style.marginBottom = (-inputBarHiddenPx) + 'px';
  }

  function showInputBar(animate = true) { setInputBarHiddenPx(0, animate); }

  let lastScrollTop = 0;
  conversationWrap.addEventListener('scroll', () => {
    const st = conversationWrap.scrollTop;
    const diff = st - lastScrollTop;
    /* Always refresh the reference point, even when we bail out below.
     * The old code skipped this while a turn was streaming, so by the time
     * the turn ended, lastScrollTop still held the pre-send scroll offset.
     * The first small gesture after the turn was then measured against
     * that stale value, producing a "diff" of hundreds of pixels and
     * slamming the input bar fully off-screen in a single frame. */
    lastScrollTop = Math.max(0, st);
  
    if (isAutoScrolling || isProcessing) return;
  
    const maxScroll = conversationWrap.scrollHeight - conversationWrap.clientHeight;
    if (!diff) return;
  
    /* diff > 0: content scrolling toward the bottom (dragging up) -> reveal.
     * diff < 0: content scrolling toward the top (dragging down) -> hide.
     * Every pixel of scroll maps 1:1 to the bar's hidden amount, with no
     * dead-zone/threshold, so the response is identical whether the drag
     * is slow or fast. Never eased while tracking a drag. */
    setInputBarHiddenPx(inputBarHiddenPx - diff, false);
  
    /* Always land fully visible once caught up to the latest message. */
    if (st >= maxScroll - 4) setInputBarHiddenPx(0, false);
  });

  promptInput.addEventListener('focus', () => {
    showInputBar(true);
    setTimeout(() => promptInput.scrollIntoView({ block: 'end', behavior: 'smooth' }), 50);
  });

  function updateAppHeight() {
    document.documentElement.style.setProperty('--app-height', (window.visualViewport ? window.visualViewport.height : window.innerHeight) + 'px');
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', updateAppHeight);
    window.visualViewport.addEventListener('scroll', updateAppHeight);
  } else { 
    window.addEventListener('resize', updateAppHeight); 
  }
  updateAppHeight();

  /**
   * Blurs the active input and waits for the soft-keyboard dismissal to
   * settle: on touch devices the visualViewport resizes asynchronously once
   * the keyboard closes, and the geometry-dependent work that follows
   * (spacer sizing, message anchoring) must run against the settled
   * viewport, not the keyboard-covered one. The wait is event-driven (the
   * first resize wins) with a timeout fallback for the case where no
   * keyboard was open, so no resize ever fires. Devices without a soft
   * keyboard (fine pointer = desktop) skip the wait entirely: there is
   * nothing to settle, and a blind sleep would only add latency to
   * every send.
   */
  async function dismissKeyboard() {
    if (document.activeElement) document.activeElement.blur();
    if (window.visualViewport && window.matchMedia('(pointer: coarse)').matches) {
      await new Promise(resolve => {
        let settled = false;
        const finish = () => { if (!settled) { settled = true; resolve(); } };
        window.visualViewport.addEventListener('resize', finish, { once: true });
        setTimeout(finish, 300); /* fallback: keyboard was never open */
      });
    }
    updateAppHeight();
    await new Promise(r => requestAnimationFrame(r));
  }

  function removeScrollSpacer() { 
    if (scrollSpacer) { scrollSpacer.remove(); scrollSpacer = null; } 
  }

  function addScrollSpacer() {
    removeScrollSpacer();
    scrollSpacer = document.createElement('div');
    scrollSpacer.className = 'scroll-spacer';
    /* Created at height 0, not the old fixed viewport height: the exact
     * required height is computed by sizeScrollSpacer() at alignment time
     * (see alignAssistantToTop), so the spacer can never reserve a full
     * screen of scrollable emptiness up front. */
    scrollSpacer.style.height = '0px';
    conversationWrap.appendChild(scrollSpacer);
  }

  /**
   * Sizes the bottom spacer to the EXACT extra height needed to keep the
   * top of msgEl pinnable at the top of the viewport -- never a full blank
   * screen more. The old fixed clientHeight-tall spacer meant maxScroll
   * always sat at least one viewport beyond the end of the real content,
   * i.e. the user could always scroll into the void, during AND after a
   * turn. With exact sizing:
   *   - while the live message is shorter than the viewport, the deepest
   *     scroll position lands precisely on the pinned message (its top at
   *     the viewport top);
   *   - once the message outgrows the viewport, the required extra height
   *     collapses to 0 and scrolling is bounded by the natural content;
   *   - because the browser clamps scrollTop whenever scrollHeight
   *     shrinks, every re-size also ejects any overscroll the user had
   *     already accumulated into the void.
   */
  function sizeScrollSpacer(msgEl) {
    if (!scrollSpacer || !msgEl || !msgEl.parentElement) return;
    const spacerH = scrollSpacer.offsetHeight;
    /* Content height WITHOUT the spacer (the spacer is the last child). */
    const naturalH = conversationWrap.scrollHeight - spacerH;
    /* msgEl's top, measured in the wrap's scroll coordinates. */
    const msgTop = msgEl.getBoundingClientRect().top
                 - conversationWrap.getBoundingClientRect().top
                 + conversationWrap.scrollTop;
    scrollSpacer.style.height =
      Math.max(0, conversationWrap.clientHeight - (naturalH - msgTop)) + 'px';
  }

  /**
   * Aligns the top coordinate of the target assistant message element flush
   * with the container top.
   */
  function alignAssistantToTop(msgEl) {
    if (!msgEl || !msgEl.parentElement) return;
    /* Size BEFORE scrolling: the pinned position must be reachable, i.e.
     * the spacer must be tall enough for scrollTop = msgTop to be legal. */
    sizeScrollSpacer(msgEl);
    conversationWrap.scrollTop += (msgEl.getBoundingClientRect().top - conversationWrap.getBoundingClientRect().top);
  }

  function scrollAssistantToTop(msgEl) {
    if (!msgEl) return;
    isAutoScrolling = true;
    requestAnimationFrame(() => {
      alignAssistantToTop(msgEl);
      requestAnimationFrame(() => { 
        alignAssistantToTop(msgEl); 
        setTimeout(() => { isAutoScrolling = false; }, 100); 
      });
    });
  }

  /* createUserMessage renders the user's turn bubble. displayText and
   * editText are DIFFERENT THINGS and must not be conflated:
   *   - displayText is what the bubble SHOWS (e.g. the synthetic
   *     '-- files attached --' label for an attachment-only turn, which
   *     the user never typed and must never be able to accidentally send).
   *   - editText is the REAL prompt the user typed (possibly ''), which
   *     is what lands in the input box when the turn is later edited.
   * The old signature took a single text used for both jobs, so editing an
   * attachment-only turn put '-- files attached --' into the textarea,
   * ready to be sent as a literal prompt. Also assigns the turn's
   * turnId to the DOM node (see rollbackConversationToUserMessage) and
   * returns it so the caller can tag the matching history entries. */
  function createUserMessage(displayText, editText, carriedParts = []) {
    document.getElementById('emptySplash')?.remove();
    removeScrollSpacer();

    const turnId = nextTurnId++;
    const msgEl = document.createElement('div');
    msgEl.className = 'message user term-font';
    msgEl.dataset.turnId = String(turnId);
    msgEl.innerHTML = `<div class="user-content-wrap"><span class="user-prompt-prefix amber-txt">&gt;</span><span class="user-prompt-text amber-txt">${escapeHtml(displayText)}</span></div><button class="edit-prompt-btn" title="Edit prompt">${useIcon('edit', 14, 14)}</button>`;
    msgEl.querySelector('.edit-prompt-btn').onclick = () => editLastPrompt(editText, msgEl, carriedParts);
    conversationWrap.appendChild(msgEl);
    return turnId;
  }

  /* Every conversationHistory entry MUST carry its owning turn's id
   * (edit/retry rollback filters BY TURN ID). All pushes are routed
   * through this guard so a missing turnId fails loudly at creation --
   * a live bug at the call site -- rather than as a silent history
   * corruption mystery three turns later. */
  function pushHistoryEntry(entry) {
    if (typeof entry.turnId !== 'number') {
      throw new Error('history entry missing turnId: ' + JSON.stringify(entry.role));
    }
    conversationHistory.push(entry);
  }

  /* Shared by editLastPrompt and retryTurn: rolls the conversation (DOM
   * and history) back to just BEFORE the given user message. DOM teardown
   * is trivial (remove the node and everything after it); history teardown
   * filters BY TURN ID: every history entry created by the target turn
   * or any later turn carries a turnId >= the target's, regardless of
   * how many entries a turn produced (0, 1, or 2). The old slice-based
   * math assumed strict user/assistant alternation and corrupted history
   * after aborted textless turns; identity-based filtering is immune to
   * that. Also restores lastGeneratedImageUrl from the nearest surviving
   * image entry, so image chaining survives an edit/retry. */
  function rollbackConversationToUserMessage(userEl) {
    let nodeEl = userEl;
    while (nodeEl) { const r = nodeEl; nodeEl = nodeEl.nextElementSibling; r.remove(); }
    const targetTurnId = Number(userEl.dataset.turnId);
    if (!Number.isNaN(targetTurnId)) {
      /* All entries carry a turnId (enforced by pushHistoryEntry); the
       * `?? 0` is pure defense-in-depth and should never fire -- an
       * untagged entry would be pinned to turn 0 and survive every
       * rollback, i.e. silent corruption in the KEEP direction. */
      conversationHistory = conversationHistory.filter(e => (e.turnId ?? 0) < targetTurnId);
    }
    const priorImageEntry = [...conversationHistory].reverse().find(m => m.type === 'image');
    lastGeneratedImageUrl = priorImageEntry ? priorImageEntry.url : null;
  }

  /* Bounded wait until the current turn's teardown has fully finished
   * (isProcessing back to false). Used by editLastPrompt after it aborts
   * a live stream: the turn's own AbortError path still has work to do
   * (finalizeStoppedResponse, partial-history push, resetInput) and we
   * must not race it. */
  async function waitForTurnEnd(maxWaitMs = 4000) {
    const start = Date.now();
    while (isProcessing && (Date.now() - start) < maxWaitMs) {
      await new Promise(r => setTimeout(r, 30));
    }
    return !isProcessing;
  }

  /* carriedParts = the attachment content parts extracted from the turn's
   * payload (see extractAttachmentParts). They are passed along to the edit
   * handler so that editing the prompt later does NOT discard the
   * attachments the turn carried. `text` is the REAL prompt the user typed
   * (possibly '' for an attachment-only turn), not the display label. */
  async function editLastPrompt(text, userEl, carriedParts = []) {
    /* EDIT DURING A LIVE TURN = "stop and edit". The old behavior bailed
     * out entirely while isProcessing was true which, combined with the
     * input bar being unreachable mid-stream, left the user with no way
     * to interrupt a long thinking phase. Now we abort the stream first,
     * then WAIT for the turn's own teardown to complete before touching
     * the DOM or conversationHistory. The wait is bounded: if teardown
     * somehow never finishes, we refuse the edit rather than corrupt
     * state by racing it. */
    if (isProcessing) {
      if (activeAbortController) activeAbortController.abort();
      const settled = await waitForTurnEnd();
      if (!settled) return;
    }
  
    rollbackConversationToUserMessage(userEl);
  
    /* The edited turn's attachments are carried over into the input bar as
     * ready-made payload parts (assignment, not concat: editing a different
     * turn replaces, not accumulates). They will be re-embedded into the
     * new payload on the next send, so the attachment survives the edit
     * instead of falling through the cracks. The attach button lights up
     * to reflect them, and a tap on it clears them (deliberate discard). */
    pendingPayloadParts = carriedParts.slice();
    updateAttachButtonState();
  
    if (conversationHistory.length === 0) {
      conversationMode = null; attachedFiles = [];
      updateAttachButtonState(); sendBtn.disabled = false; sendImgBtn.disabled = false; attachBtn.disabled = false;
      checkEmptyState();
    }
  
    promptInput.value = text; autoGrow(); promptInput.focus();
  }

  /* Creates the assistant message element and MOUNTS it: appends it to the
   * conversation, (re)adds the bottom scroll spacer, and anchors the new
   * message flush against the top of the viewport. Returns the response
   * element (the markdown container the answer streams into); the raw
   * reasoning tail is its sibling '.thinking-scroll' div, hidden until the
   * first reasoning delta arrives. */
  function mountAssistantMessage() {
    const msgEl = document.createElement('div');
    msgEl.className = 'message assistant term-font';
    /* The response div keeps the placeholder "Thinking..." animation pinned
     * at the top; raw reasoning tokens stream into the sibling below it. The
     * sibling is hidden until the first reasoning delta arrives (models with
     * reasoningEffort "none", or non-reasoning models, never show it). */
    msgEl.innerHTML =
      `<div class="response markdown-body placeholder green-txt term-font">Thinking...</div>` +
      `<div class="thinking-scroll" style="display:none;"></div>`;
    conversationWrap.appendChild(msgEl);
    addScrollSpacer();
    scrollAssistantToTop(msgEl);
    return msgEl.querySelector('.response');
  }

  function setLoading(btnToStop) {
    /* A live turn is the one moment the user genuinely NEEDS the input bar
     * on screen: the stop button lives there. Pin it fully visible for the
     * whole turn. The scroll listener already ignores gestures while
     * isProcessing is true, so without this the bar would stay stuck at
     * whatever hidden offset it was at when the turn began, leaving the
     * stop control unreachable until the stream finished on its own. */
    showInputBar(true);
    const target = btnToStop || sendBtn;
    target.disabled = false;
    target.innerHTML = useIcon('stop', 14, 14);
    target.classList.add('stop');
    promptInput.disabled = true;
    attachBtn.disabled = true;
  }

  function resetInput() {
    sendBtn.innerHTML = useIcon('send', 16, 16); sendBtn.classList.remove('stop');
    sendImgBtn.innerHTML = useIcon('image', 16, 16); sendImgBtn.classList.remove('stop');
    sendBtn.disabled = (conversationMode === 'image');
    sendImgBtn.disabled = (conversationMode === 'chat');
    attachBtn.disabled = (conversationMode === 'image');
    promptInput.disabled = false; promptInput.value = ''; autoGrow();
  }

  function addRetryButton(contentEl, onRetry) {
    contentEl.parentElement.querySelector('.retry-btn')?.remove();
    const btn = document.createElement('button');
    btn.className = 'retry-btn term-font';
    btn.title = 'Retry';
    btn.innerHTML = useIcon('retry', 14, 14);
    btn.onclick = onRetry;
    contentEl.parentElement.appendChild(btn);
  }

  /* ==========================================================================
   * READ-ALOUD (TTS) SUBSYSTEM — Qwen/Qwen3-TTS via DeepInfra
   * ==========================================================================
   * Two-stage pipeline:
   *   Stage 1 (LLM text prep): streams a rewrite of the raw markdown reply as
   *   plain speakable prose. Paragraphs (two consecutive newlines) are fed to
   *   stage 2 the moment they complete, so the first synthesis request ships
   *   after the FIRST PARAGRAPH, not after the whole prep pass.
   *   Stage 2 (synthesis): one POST per paragraph to v1/audio/speech,
   *   requested as raw PCM (16-bit signed LE, mono, 24 kHz). Each response
   *   body is consumed to COMPLETION (arrayBuffer), so every body is
   *   sample-aligned by construction -- no chunk-stitching, no parity
   *   carry-over, no streaming player state. Each decoded segment is
   *   scheduled back-to-back on one AudioContext timeline; pause/resume is
   *   ctx.suspend()/resume(), which freezes the timeline and preserves the
   *   position with zero bookkeeping.
   *
   * FAILURE POLICY: each synthesis call gets ONE retry; a second consecutive
   * failure stops requesting further segments but lets already-scheduled
   * audio drain to its natural end, after which the error is reported on
   * the message.
   *
   * CACHING: the concatenated PCM of a fully successful session is cached
   * per-message (WeakMap keyed by the response container, so it dies with
   * the node on edit/retry). A re-tap replays it through the same scheduler
   * with zero API traffic. Only complete sessions are cached.
   *
   * STATE MACHINE (the single source of truth for the speak button):
   *   idle --preparing--> preparing --first audio--> playing --drain--> idle
   *   preparing --tap--> idle (cancel)      playing --tap--> paused
   *   paused --tap--> playing               any --switch target--> idle
   *   preparing/playing --real error--> (drain) --> idle + error text
   * ==========================================================================
   */
  const TTS_MODEL_ID = 'Qwen/Qwen3-TTS';
  const TTS_PCM_RATE = 24000;            /* PCM: 16-bit signed LE, mono */
  const TTS_SYNTH_SEGMENT_CHARS = 1500;  /* /v1/audio/speech input ceiling */
  const TTS_PREP_SEGMENT_CHARS  = 24000; /* bounds each stage-1 call's output */

  /* Per-message audio cache: contentEl -> { pcm: ArrayBuffer } */
  const ttsAudioCache = new WeakMap();

  /* The single active session. All fields are only mutated by the
   * transition functions below; the `state` field is what tap dispatch
   * reads -- never a combination of button classes and cache contents. */
  let TTS = { state: 'idle', contentEl: null, controller: null, ctx: null, scheduler: null, pcm: [], error: null };

  function speakBtnOf(contentEl) {
    return contentEl?.parentElement?.querySelector('.speak-btn') || null;
  }

  function setSpeakIcon(contentEl, mode) {
    const btn = speakBtnOf(contentEl);
    if (!btn) return;
    btn.classList.toggle('busy', mode === 'busy');
    btn.classList.toggle('playing', mode === 'playing');
    btn.innerHTML = (mode === 'playing') ? useIcon('stop', 14, 14) : useIcon('speech', 14, 14);
    btn.title = (mode === 'busy') ? 'Preparing — tap to cancel'
              : (mode === 'playing') ? 'Pause speech'
              : 'Read aloud';
  }

  /* Raw PCM (Int16 LE) -> AudioBuffer at the context's rate. */
  function pcmToAudioBuffer(ctx, pcm) {
    const n = pcm.byteLength >> 1;
    const dv = new DataView(pcm);
    const f32 = new Float32Array(n);
    for (let i = 0; i < n; i++) f32[i] = dv.getInt16(i * 2, true) / 32768;
    const buf = ctx.createBuffer(1, n, ctx.sampleRate);
    buf.copyToChannel(f32, 0);
    return buf;
  }

  /* Gapless segment scheduler on one AudioContext. schedule() queues one
   * completed PCM body; close() declares that no more segments will arrive
   * and arms drain detection (onDrain fires when the last source ends, or
   * immediately if none is live); stop() tears everything down without
   * firing onDrain. */
  function createPcmScheduler(ctx, onDrain) {
    let nextTime = 0, live = 0, closed = false, halted = false;
    return {
      schedule(pcm) {
        if (halted) return;
        const src = ctx.createBufferSource();
        src.buffer = pcmToAudioBuffer(ctx, pcm);
        const at = Math.max(nextTime, ctx.currentTime);
        src.start(at);
        nextTime = at + src.buffer.duration;
        src.connect(ctx.destination);
        live++;
        src.onended = () => { live--; if (live === 0 && closed && !halted) onDrain(); };
      },
      close() { closed = true; if (live === 0 && !halted) onDrain(); },
      stop() { halted = true; try { ctx.close(); } catch {} }
    };
  }

  /* Prose sink: stage-1 deltas in, TTS-ready segments out. ONE segment is
   * one paragraph (two consecutive newlines); a paragraph longer than
   * maxLen is cut at sentence (then word) boundaries -- the safety valve
   * for a model that emits one giant paragraph, without which first-sound
   * latency would regress to barrier behaviour. end() flushes the tail.
   * The batch chunker below is this same policy with a whole text pushed
   * at once, so stage-1 input chunking and stage-2 feeding share ONE
   * implementation of the boundary rules. */
  function createProseSink(maxLen, onSegment) {
    let buf = '';
    const cutFrom = (window) => {
      for (let i = window.length - 1; i >= 0; i--) {
        if ('.!?\n。！？'.includes(window[i])) return i + 1;
      }
      const w = Math.max(window.lastIndexOf(' '), window.lastIndexOf(','), window.lastIndexOf(';')) + 1;
      return w > 0 ? w : window.length;
    };
    const drainOverhead = () => {
      while (buf.length > maxLen) {
        const cut = cutFrom(buf.slice(0, maxLen));
        const s = buf.slice(0, cut).trim();
        buf = buf.slice(cut);
        if (s) onSegment(s);
      }
    };
    return {
      push(delta) {
        buf += String(delta).replace(/\r\n/g, '\n');
        drainOverhead();
        for (;;) {
          const i = buf.indexOf('\n\n');
          if (i === -1) break;
          const para = buf.slice(0, i).trim();
          buf = buf.slice(i + 2);
          if (para) onSegment(para);
        }
      },
      end() {
        drainOverhead();
        const t = buf.trim();
        buf = '';
        if (t) onSegment(t);
      }
    };
  }

  /* Batch entry point (stage-1 input chunking): the same sink, fed whole. */
  function segmentTextForTts(text, maxLen) {
    const out = [];
    const sink = createProseSink(maxLen, s => out.push(s));
    sink.push(text);
    sink.end();
    return out;
  }

  /* Stage 1, STREAMING: rewrites raw markdown as speakable prose and calls
   * onProseDelta per token. Input is chunked by segmentTextForTts so each
   * response's OUTPUT fits its token budget; the model is told never to
   * shorten anything. Failures carry the stage label, model name, chunk
   * index and HTTP detail. */
  async function streamTtsPrepText(rawMarkdown, signal, onProseDelta) {
    const chunks = segmentTextForTts(rawMarkdown, TTS_PREP_SEGMENT_CHARS);
    for (let i = 0; i < chunks.length; i++) {
      const stage = 'TTS STAGE 1 (markdown-to-prose, model ' + CONFIG.model + ')' +
        (chunks.length > 1 ? ', chunk ' + (i + 1) + '/' + chunks.length + ' (' + chunks[i].length + ' chars in)' : '');
      let res;
      try {
        res = await apiFetch(CONFIG.apiPath, {
          model: CONFIG.model,
          reasoning_effort: 'low',
          service_tier: 'priority',
          stream: true,
          temperature: 0.1,
          max_tokens: 16384,
          messages: [
            { role: 'system', content:
                'Transform the given Markdown input ' +
                'into plain prose that is perfectly suited to be read aloud by a TTS engine.\n' +
                'Guidelines:\n' +
                '1. Do not output any Markdown syntax, emojis, or unreadable symbols like bullet points.\n' +
                '2. When you encounter a link, simply output the link text, ignoring URLs.\n' +
                '3. Replace code blocks with a brief description of the contents.\n' +
                '4. Transform tables into readable prose. Highlight the differences between cells.\n' +
                '5. Preserve the original language and all substantive information.\n' +
                '6. Output ONLY the text to be read aloud, without preambles or anything else.\n' +
                '7. Separate paragraphs with a blank line.\n' +
                '8. Do NOT truncate, shorten, summarize or skip ANY part of the input, ' +
                'no matter how long it is. The output must cover the entire input.' },
            { role: 'user', content: chunks[i] }
          ]
        }, signal);
      } catch (e) {
        if (e.name === 'AbortError') throw e;
        throw new Error(stage + ' failed to reach the server: ' + (e.message || e));
      }
      if (!res.ok) throw new Error(stage + ' failed: ' + await httpErrorDetail(res));
      if (!res.body) throw new Error(stage + ' failed: the transport did not expose a streaming response body');

      const reader = res.body.getReader(), decoder = new TextDecoder();
      let buffer = '';
      const abortStream = () => { try { reader.cancel(); } catch (e) {} };
      signal.addEventListener('abort', abortStream);
      try {
        while (true) {
          const { done, value } = await reader.read();
          if (done || signal.aborted) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split(/\r?\n/);
          buffer = lines.pop() || '';
          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed.startsWith('data:') || trimmed === 'data: [DONE]') continue;
            try {
              const delta = JSON.parse(trimmed.slice(5).trim())?.choices?.[0]?.delta;
              if (delta?.content) onProseDelta(delta.content);
            } catch (e) {}
          }
        }
      } finally {
        signal.removeEventListener('abort', abortStream);
      }
      if (signal.aborted) {
        const e = new Error('Aborted'); e.name = 'AbortError'; throw e;
      }
    }
  }

  /* Stage 2, ONE call: synthesize one segment and return its complete PCM
   * body. service_tier: 'priority' only on the session's first segment
   * (click-to-first-sound latency), default afterwards -- playback runs
   * slower than the engine, so later segments need no priority. */
  async function synthesizeSegmentOnce(text, tier, signal) {
    const stage = 'TTS STAGE 2 (speech synthesis, model ' + TTS_MODEL_ID + '), segment (' + text.length + ' chars)';
    let res;
    try {
      res = await apiFetch('v1/audio/speech', Object.assign({
        model: TTS_MODEL_ID,
        input: text,
        voice: CONFIG.ttsVoice,
        language: 'Auto',
        instruct: CONFIG.ttsInstruct,
        response_format: 'pcm'
      }, tier ? { service_tier: tier } : {}), signal);
    } catch (e) {
      if (e.name === 'AbortError') throw e;
      throw new Error(stage + ' failed to reach the server: ' + (e.message || e));
    }
    if (!res.ok) throw new Error(stage + ' failed: ' + await httpErrorDetail(res));
    let pcm = await res.arrayBuffer();
    if (!pcm.byteLength) throw new Error(stage + ' failed: the server returned an empty audio body');
    /* Defensive only: a body should always be whole-sample aligned; a stray
     * trailing byte is a server bug worth a console line, nothing more. */
    if (pcm.byteLength & 1) {
      console.warn(stage + ': odd-length PCM body, dropping final byte');
      pcm = pcm.slice(0, pcm.byteLength - 1);
    }
    return pcm;
  }

  /* Retry-once wrapper: transient hiccups get a second chance; a second
   * consecutive failure propagates (the caller then drains + reports). */
  async function synthesizeSegment(text, tier, signal) {
    try { return await synthesizeSegmentOnce(text, tier, signal); }
    catch (e) {
      if (e.name === 'AbortError') throw e;
      return await synthesizeSegmentOnce(text, tier, signal);
    }
  }

  /* THE PIPELINE. Two concurrent lanes, no barrier:
   *   - prep lane: streamTtsPrepText streams prose deltas into the prose
   *     sink; each completed paragraph becomes a queue entry.
   *   - synth lane: a FIFO worker, one segment at a time (never parallel:
   *     segment order must match scheduling order), each completed PCM body
   *     handed to onSegmentPcm the instant it lands.
   * The one-slot wake gate is safe by single-threadedness: the worker
   * re-checks queue/prepDone before suspending. Error precedence: a real
   * error from either lane aborts the other (whose teardown surfaces as a
   * deliberately unreported AbortError) and is rethrown; a genuine
   * AbortError (user cancel / target switch) propagates silently. */
  async function runTtsPipeline(rawMarkdown, controller, onSegmentPcm) {
    const queue = [];
    let prepDone = false, wake = null, first = true;
    const wakeAll = () => { if (wake) { const w = wake; wake = null; w(); } };

    const synthLane = (async () => {
      for (;;) {
        while (queue.length === 0 && !prepDone) await new Promise(r => { wake = r; });
        if (queue.length === 0) return;
        const text = queue.shift();
        const tier = first ? 'priority' : '';
        const pcm = await synthesizeSegment(text, tier, controller.signal);
        first = false;
        onSegmentPcm(pcm);
      }
    })();

    const sink = createProseSink(TTS_SYNTH_SEGMENT_CHARS, s => { queue.push(s); wakeAll(); });
    try {
      await streamTtsPrepText(rawMarkdown, controller.signal, d => sink.push(d));
      sink.end();
      prepDone = true; wakeAll();
      await synthLane;
    } catch (err) {
      prepDone = true; wakeAll();
      controller.abort();
      let synthErr = null;
      try { await synthLane; } catch (e) { synthErr = e; }
      throw (err.name === 'AbortError' && synthErr && synthErr.name !== 'AbortError') ? synthErr : err;
    }
  }

  function concatPcmBuffers(list) {
    const len = list.reduce((n, b) => n + b.byteLength, 0);
    const out = new Uint8Array(len);
    let off = 0;
    for (const b of list) { out.set(new Uint8Array(b), off); off += b.byteLength; }
    return out.buffer;
  }

  /* --- state machine transitions --- */

  function ttsReset() {
    TTS = { state: 'idle', contentEl: null, controller: null, ctx: null, scheduler: null, pcm: [], error: null };
  }

  /* Cancel: aborts everything and stops playback immediately. Used for a
   * tap on the busy button, and for switching the spoken target. A fully
   * completed message's cache survives (it lives in ttsAudioCache). */
  function ttsCancel() {
    if (TTS.state === 'idle') return;
    const el = TTS.contentEl;
    if (TTS.controller) TTS.controller.abort();
    if (TTS.scheduler) TTS.scheduler.stop();
    ttsReset();
    if (el) setSpeakIcon(el, 'idle');
  }

  function ttsPause() {
    if (TTS.state !== 'playing') return;
    TTS.state = 'paused';
    TTS.ctx.suspend();
    setSpeakIcon(TTS.contentEl, 'idle');
  }

  function ttsResume() {
    if (TTS.state !== 'paused') return;
    TTS.state = 'playing';
    TTS.ctx.resume();
    setSpeakIcon(TTS.contentEl, 'playing');
  }

  /* Drain: the last scheduled source has ended (or nothing was ever
   * scheduled). Full success caches the PCM for free replays; a recorded
   * error is reported on the message now that audio has run out. */
  function ttsDrained(el) {
    if (TTS.contentEl !== el || TTS.state === 'idle') return;
    const error = TTS.error;
    if (!error && TTS.pcm.length > 0) {
      ttsAudioCache.set(el, { pcm: concatPcmBuffers(TTS.pcm) });
    }
    ttsReset();
    setSpeakIcon(el, 'idle');
    if (error) setError(el, error + ' (audio stopped at the point of failure)');
  }

  /* Start the full pipeline on an uncached message. The AudioContext is
   * created synchronously inside the click gesture (before any await), so
   * autoplay policy never blocks playback. On a real failure the pipeline
   * has already stopped requesting segments; already-scheduled audio
   * drains and ttsDrained reports the error. */
  async function ttsStart(contentEl, rawMarkdown) {
    const controller = new AbortController();
    const ctx = new AudioContext({ sampleRate: TTS_PCM_RATE });
    ctx.resume();
    const scheduler = createPcmScheduler(ctx, () => ttsDrained(contentEl));
    TTS = { state: 'preparing', contentEl, controller, ctx, scheduler, pcm: [], error: null };
    setSpeakIcon(contentEl, 'busy');
    try {
      await runTtsPipeline(rawMarkdown, controller, (pcm) => {
        TTS.pcm.push(pcm);
        scheduler.schedule(pcm);
        if (TTS.state === 'preparing') { TTS.state = 'playing'; setSpeakIcon(contentEl, 'playing'); }
      });
      scheduler.close(); /* arm drain; state is 'playing' until the last source ends */
    } catch (err) {
      if (err.name === 'AbortError') { ttsCancel(); return; }
      TTS.error = (err.message || 'Speech synthesis failed') +
        ' (source reply: ' + rawMarkdown.length + ' chars)';
      scheduler.close(); /* drain, then ttsDrained reports the error */
    }
  }

  /* Replay a cached message through the same scheduler: one buffer, zero
   * API traffic, identical pause/resume semantics. */
  function ttsReplay(contentEl) {
    const cached = ttsAudioCache.get(contentEl);
    if (!cached) return;
    const ctx = new AudioContext({ sampleRate: TTS_PCM_RATE });
    ctx.resume();
    const scheduler = createPcmScheduler(ctx, () => ttsDrained(contentEl));
    TTS = { state: 'playing', contentEl, controller: null, ctx, scheduler, pcm: [cached.pcm], error: null };
    setSpeakIcon(contentEl, 'playing');
    scheduler.schedule(cached.pcm);
    scheduler.close();
  }

  /* Speaker-icon tap: pure dispatch on (active message?, state). */
  function toggleSpeak(contentEl, rawMarkdown) {
    if (!CONFIG || !contentEl || !speakBtnOf(contentEl)) return;
    if (TTS.contentEl === contentEl) {
      if (TTS.state === 'preparing') return ttsCancel();
      if (TTS.state === 'playing')   return ttsPause();
      if (TTS.state === 'paused')    return ttsResume();
      return;
    }
    ttsCancel(); /* switching targets: whatever was active stops; its cache survives */
    if (ttsAudioCache.get(contentEl)) return ttsReplay(contentEl);
    return ttsStart(contentEl, rawMarkdown);
  }

  /**
   * Adds the read-aloud icon button next to the retry button.
   */
  function addSpeakButton(contentEl, rawMarkdown) {
    if (!contentEl?.parentElement || !rawMarkdown) return;
    contentEl.parentElement.querySelector('.speak-btn')?.remove();
    const btn = document.createElement('button');
    btn.className = 'speak-btn term-font';
    btn.title = 'Read aloud';
    btn.setAttribute('aria-label', 'Read aloud');
    btn.innerHTML = useIcon('speech', 14, 14);
    btn.onclick = (e) => { e.stopPropagation(); toggleSpeak(contentEl, rawMarkdown); };
    contentEl.parentElement.appendChild(btn);
  }

  /**
   * Retries the specific turn whose retry icon was pressed -- rolls the
   * conversation (both DOM and conversationHistory) back to right before
   * that turn's user message, then resends the same prompt/payload. This
   * discards that turn and any turns that came after it, mirroring what a
   * fresh send of that same prompt would produce.
   *
   * ATTACHMENT PRESERVATION: the original fullPayload (which embeds the
   * turn's attachments) is resent as-is, so the retry itself keeps the
   * attachments. The recreated user message is also given the extracted
   * attachment parts, so a subsequent EDIT of the retried turn keeps them
   * too (no falling through the cracks, edit after retry).
   */
  async function retryTurn(assistantEl, isImage, displayPrompt, fullPayload) {
    if (isProcessing) return;
    const userEl = assistantEl?.previousElementSibling;
    if (!userEl || !userEl.classList.contains('user')) return;

    rollbackConversationToUserMessage(userEl);

    isProcessing = true;
    activeAbortController = new AbortController();
    try {
      setLoading(isImage ? sendImgBtn : sendBtn);
      await dismissKeyboard();
      /* displayText for the recreated bubble is the turn's display label;
       * editText is the REAL prompt recovered from the payload (see
       * promptTextFromPayload) so a later edit puts the true text into
       * the input box. For image turns the prompt text IS the display
       * text (image mode never attaches files). */
      const turnId = createUserMessage(displayPrompt, isImage ? displayPrompt : promptTextFromPayload(fullPayload), extractAttachmentParts(fullPayload));
      const newContentEl = mountAssistantMessage();
      if (isImage) await executeImageRequest(displayPrompt, newContentEl, activeAbortController.signal, turnId);
      else await executePromptRequest(fullPayload, displayPrompt, newContentEl, activeAbortController.signal, turnId);
    } finally {
      isProcessing = false;
      activeAbortController = null;
    }
  }

  async function sendPrompt() {
    if (isProcessing) return;
    const prompt = promptInput.value.trim();
    /* A send is valid with text, freshly picked files, OR attachment parts
     * carried over from an edited turn (an edited attachment-only turn has
     * empty prompt text but must still be re-submittable). */
    if ((!prompt && attachedFiles.length === 0 && pendingPayloadParts.length === 0) || !CONFIG) return;

    promptInput.value = ''; autoGrow(); lockConversationMode('chat'); isProcessing = true;
    activeAbortController = new AbortController();
    try {
      const fullPayload = await buildMultimodalContent(prompt, attachedFiles, pendingPayloadParts);
      /* Attachments (both freshly picked files and parts carried over from
       * an edited turn) are embedded into this turn's message content, which is
       * itself stored in conversationHistory and resent as part of the full
       * thread on every subsequent turn. So there's no need to keep them
       * around in the input bar to be re-embedded again on the next send. */
      attachedFiles = [];
      pendingPayloadParts = [];
      updateAttachButtonState();
      setLoading(sendBtn);
      await dismissKeyboard();
      const displayPrompt = prompt || '-- files attached --';
      /* The bubble shows the display label; the edit button carries the
       * REAL (possibly empty) prompt text, not the label. */
      const turnId = createUserMessage(displayPrompt, prompt, extractAttachmentParts(fullPayload));
      await executePromptRequest(fullPayload, displayPrompt, mountAssistantMessage(), activeAbortController.signal, turnId);
    } finally { 
      isProcessing = false; 
      activeAbortController = null;
    }
  }

  /* 
   * ==========================================================================
   * CHAT TURN MACHINERY
   * Single-purpose helpers used by executePromptRequest, the orchestrator
   * of the SSE streaming chat & function-call loop (below).
   * ==========================================================================
   */

  /* Base64 image parts are only sent for the CURRENT (latest) user turn.
   * When replaying older turns from conversationHistory, image parts are
   * substituted with a text placeholder: the vision model already received
   * the pixels once, and re-uploading hundreds of KB of base64 on every
   * subsequent turn was a pure bandwidth/serialization tax. */
  function stripStaleImages(content) {
    if (!Array.isArray(content)) return content;
    return content.map(p => (p && p.type === 'image_url')
      ? { type: 'text', text: '[image attachment omitted]' }
      : p);
  }

  /* Picks the model for a chat turn: image payloads route to the vision model. */
  function pickChatModel(fullPayload) {
    const hasImage = Array.isArray(fullPayload) && fullPayload.some(i => i && i.type === 'image_url');
    return (hasImage && CONFIG.visionModel) ? CONFIG.visionModel : CONFIG.model;
  }

  /* Turn-owning rounds only: pushes the user entry into conversationHistory
   * and replays the whole thread into apiMessages. NOTE ON THE REPLAY LOOP:
   * image-generation history entries ({ role: 'assistant', type: 'image',
   * url }) can never appear here. The mode lock (lockConversationMode) makes
   * a single timeline either chat or image generation, never both, and this
   * replay path only ever runs in chat-locked conversations. */
  function buildApiMessages(fullPayload, displayPrompt, turnId) {
    pushHistoryEntry({ role: 'user', content: fullPayload, displayPrompt, turnId });
    const messages = [{ role: 'system', content: getFormattedRuntimeContext() + CONFIG.systemPrompt }];
    for (let i = 0; i < conversationHistory.length - 1; i++) {
      const item = conversationHistory[i];
      messages.push({ role: item.role, content: stripStaleImages(item.content), ...(item.tool_calls ? { tool_calls: item.tool_calls } : {}) });
    }
    messages.push({ role: 'user', content: fullPayload });
    return messages;
  }

  /* Static tool schema list. Whether the model is OFFERED these tools is a
   * separate question, answered per-round by toolsForBudget. */
  const TOOL_DEFINITIONS = [
    {
      type: 'function',
      function: {
        name: 'get_youtube_transcript',
        description: 'Retrieves the transcript for a given YouTube video URL or Video ID; ' +
                     'sponsor-flagged segments are removed and marked "[...]". ' +
                     'Use this tool for YouTube. NEVER use web_search or fetch_web_page for YouTube. ' +
                     'When summarizing a video, start right away with the substance, without ' +
                     'introductions or boilerplate like the channel name or view count. ' +
                     'Write plain prose suited to be read aloud by a TTS engine, not bullet points. ' +
                     'Omit sponsored content and self-promotions. ' +
                     'Include timestamps as links in the form ([MM:SS](https://youtu.be/<video_ID>?&t=<timestamp_seconds>)).',
        parameters: {
          type: 'object',
          properties: {
            video_id: { type: 'string', description: 'The YouTube Video ID or full YouTube video URL.' },
            language: { type: 'string', description: 'Preferred language code (e.g. "en", "es"). Defaults to "en".' }
          },
          required: ['video_id']
        }
      }
    },
    {
      type: 'function',
      function: {
        name: 'web_search',
        description: 'Search the web. NEVER use this tool for Youtube',
        parameters: {
          type: 'object',
          properties: { query: { type: 'string' } },
          required: ['query']
        }
      }
    },
    {
      type: 'function',
      function: {
        name: 'fetch_web_page',
        description: 'Fetch a webpage. NEVER use this tool for Youtube',
        parameters: {
          type: 'object',
          properties: { urls: { type: 'array', items: { type: 'string' } } },
          required: ['urls']
        }
      }
    }
  ];

  /* Tools are offered only while budget remains AND the Tavily key exists.
   * Returns null (the tools key is OMITTED from the payload entirely) rather
   * than an empty array: several OpenAI-compatible providers reject
   * `tools: []`, and omission unambiguously means "nothing to call this
   * round". toolBudget <= 0 (configured 0 or spent) means the model has
   * nothing to call and must produce a textual answer. */
  function toolsForBudget(toolBudget) {
    return (!!CONFIG.tavilyApiKey && toolBudget > 0) ? TOOL_DEFINITIONS : null;
  }

  /* Runs ONE SSE chat-completion round and returns the accumulated tool
   * calls. The accumulated ANSWER TEXT is written into `live.text` live,
   * as it streams: `live` is a caller-owned accumulator, passed in empty
   * and mutated in place, so the caller's abort path can finalize the turn
   * with the partial text (the role the old function-scope fullText
   * played). Throws a plain Error on HTTP failure and an AbortError on
   * abort -- the caller owns both teardown paths. thinkText is LOCAL
   * deliberately: each tool-loop round is a fresh invocation, so each
   * round's reasoning phase starts clean and REPLACES the previous
   * round's text in the visible tail. */
  async function streamChatCompletion(apiMessages, activeModel, toolBudget, contentEl, signal, live) {
    const tools = toolsForBudget(toolBudget);
    const payload = Object.assign(
      { model: activeModel, messages: apiMessages, stream: true },
      tools ? { tools: tools } : {},
      (CONFIG.reasoningEffort && CONFIG.reasoningEffort !== 'none') ? { reasoning_effort: CONFIG.reasoningEffort } : {},
      (CONFIG.serviceTier === 'priority' || CONFIG.serviceTier === 'flex') ? { service_tier: CONFIG.serviceTier } : {},
      CONFIG.extraParams
    );

    const res = await apiFetch(CONFIG.apiPath, payload, signal);
    if (!res.ok) throw new Error(`Chat request (model ${activeModel}) failed: ` + await httpErrorDetail(res));

    const reader = res.body.getReader(), decoder = new TextDecoder();
    let buffer = '';
    const accToolCalls = {};
    let thinkText = '';

    /* Direct stream teardown on abort: fetch-signal propagation to the
     * body reader is not reliable in all engines (legacy Safari, some
     * webviews), so abort also cancels the ReadableStream directly.
     * reader.cancel() resolves the pending read() as {done:true} instead
     * of rejecting, hence the signal.aborted check after the loop. */
    const abortStream = () => { try { reader.cancel(); } catch (e) {} };
    signal.addEventListener('abort', abortStream);

    try {
      while (true) {
        const { done, value } = await reader.read();
        if (done || signal.aborted) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split(/\r?\n/);
        buffer = lines.pop() || '';

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed.startsWith('data:') || trimmed === 'data: [DONE]') continue;
          try {
            const delta = JSON.parse(trimmed.slice(5).trim())?.choices?.[0]?.delta;
            if (!delta) continue;
            /* DeepSeek-style APIs stream reasoning_content; some
             * OpenAI-compatible providers use reasoning. Accept both. */
            const thinkChunk = delta.reasoning_content || delta.reasoning;
            if (thinkChunk) {
              const thinkEl = contentEl.parentElement.querySelector('.thinking-scroll');
              if (thinkEl) {
                if (thinkEl.style.display === 'none') {
                  /* First reasoning delta of this round: clamp the tail
                   * to the viewport (minus the "Thinking..." line and
                   * breathing room) so the message can never grow the
                   * document and push the screen around. */
                  thinkEl.style.display = 'block';
                  thinkEl.style.maxHeight = Math.max(120, conversationWrap.clientHeight - 80) + 'px';
                  thinkEl.textContent = '';
                }
                thinkText += thinkChunk;
                renderThinkingThrottled(thinkEl, thinkText);
              }
            }
            if (delta.content) {
              if (!live.text) {
                /* First final-answer token: retire the thinking tail
                 * (display:none, NOT removal -- a later tool-loop round
                 * may stream reasoning again). The placeholder
                 * "Thinking..." line is replaced by the answer in this
                 * same frame. */
                const thinkEl = contentEl.parentElement.querySelector('.thinking-scroll');
                if (thinkEl) { thinkEl.style.display = 'none'; thinkEl.textContent = ''; }
                contentEl.classList.remove('placeholder');
                alignAssistantToTop(contentEl.parentElement);
              }
              live.text += delta.content;
              renderMarkdownThrottled(contentEl, live.text);
            }
            if (delta.tool_calls) {
              for (const tc of delta.tool_calls) {
                const idx = tc.index ?? 0;
                if (!accToolCalls[idx]) accToolCalls[idx] = { id: '', name: '', arguments: '' };
                if (tc.id) accToolCalls[idx].id = tc.id;
                if (tc.function?.name) accToolCalls[idx].name += tc.function.name;
                if (tc.function?.arguments) accToolCalls[idx].arguments += tc.function.arguments;
              }
            }
          } catch (e) {}
        }
      }
    } finally {
      signal.removeEventListener('abort', abortStream);
    }

    /* A cancelled stream ends "cleanly"; re-raise as an AbortError so the
     * caller's abort branch (finalizeStoppedResponse, partial-history
     * push, resetInput) runs. */
    if (signal.aborted) {
      const e = new Error('Aborted'); e.name = 'AbortError'; throw e;
    }

    return Object.values(accToolCalls);
  }

  /* A tool failure is a RESULT for the model, not a turn error. The error
   * names the failing tool and the actual failure so the model can react
   * sensibly; the hint steers it away from retrying the identical call in
   * a loop. */
  function toolErrorResult(toolName, message) {
    const hint = 'This tool call failed. DO NOT retry the same call with the same arguments. ' +
                 'Answer from what you already know, ' +
                 'tell the user the requested information could not be retrieved, ' +
                 'or try a different tool only if it will move things forward.';
    return JSON.stringify({
      error: (toolName ? `The '${toolName}' tool call failed: ` : '') + message,
      hint: hint
    });
  }

  /* Renders the telemetry line and runs ONE tool call, returning its
   * stringified result for the model. Only AbortError escapes: a stop
   * during a Tavily fetch tears down the whole turn rather than being
   * swallowed into a tool-error result. */
  async function executeToolCall(tc, contentEl, streamedText, signal) {
    const withTelemetry = (html) =>
      renderMarkdown(contentEl, (streamedText ? streamedText + '\n\n' : '') + html);
    try {
      const args = JSON.parse(tc.arguments || '{}');
      if (tc.name === 'get_youtube_transcript') {
        withTelemetry(`<div class="tool-status-msg green-txt term-font">-- FETCHING YOUTUBE TRANSCRIPT "${escapeHtml(args.video_id || '')}"... --</div>`);
        return await fetchYouTubeTranscript(args.video_id, args.language || 'en', signal);
      }
      if (tc.name === 'web_search') {
        withTelemetry(`<div class="tool-status-msg green-txt term-font">-- SEARCHING WEB "${escapeHtml(args.query || '')}"... --</div>`);
        return await executeTavilySearch(args.query, signal);
      }
      if (tc.name === 'fetch_web_page') {
        withTelemetry(`<div class="tool-status-msg green-txt term-font">-- FETCHING WEB PAGE... --</div>`);
        return await executeTavilyExtract(args.urls, signal);
      }
      /* Unknown tool name: an explicit error result, so the model does
       * not sit waiting for a response that never comes. */
      return toolErrorResult(null, 'Unknown tool: ' + tc.name);
    } catch (err) {
      if (err.name === 'AbortError') throw err;
      return toolErrorResult(tc.name, err.message);
    }
  }

  /* Shared "the chat turn is over" tail: render the final text, wire the
   * retry & read-aloud buttons, record the assistant entry (tagged with
   * the turn id so edit/retry rolls it back with the rest of the turn),
   * and re-arm the input controls. */
  function completeAssistantTurn(contentEl, fullText, displayPrompt, fullPayload, turnId) {
    /* The turn is over: retire the spacer so the scroll range ends at the
     * conversation's real bottom. The browser clamps scrollTop to the new
     * (smaller) maximum, which lands the viewport on the end of the
     * conversation instead of leaving the reply pinned at the top with a
     * screen of emptiness below it. */
    removeScrollSpacer();
    renderMarkdown(contentEl, fullText);
    addRetryButton(contentEl, () => retryTurn(contentEl.parentElement, false, displayPrompt, fullPayload));
    addSpeakButton(contentEl, fullText);
    pushHistoryEntry({ role: 'assistant', content: fullText, turnId });
    resetInput();
  }

  /* 
   * ==========================================================================
   * EXECUTE PROMPT REQUEST (SSE STREAMING CHAT & FUNCTION CALL LOOP)
   * ==========================================================================
   * Entry point and orchestrator for a chat turn. Parameters: what the
   * user submitted (fullPayload), what the bubble shows (displayPrompt),
   * where the answer streams (contentEl), how to abort (signal), and which
   * turn this is (turnId, for edit/retry rollback).
   *
   * TOOL BUDGET SEMANTICS: the budget is a quantity of remaining tool
   * calls, captured once at turn start and only ever decreased as calls
   * execute. A budget of 0 means "no tools offered this round" --
   * identically to a configured max of 0 -- so "exhausted" and "disabled"
   * are one and the same state: the model has nothing to call and must
   * answer from what it has. A settings change mid-turn can neither
   * extend nor shrink a turn already in flight, because the value is
   * captured once rather than re-read from CONFIG each round.
   * ==========================================================================
   */
  async function executePromptRequest(fullPayload, displayPrompt, contentEl, signal, turnId) {
    const activeModel = pickChatModel(fullPayload);
    updateStatusBar(activeModel);

    /* Turn-owned history work happens here, once, at entry: push the user
     * entry, build the replayed apiMessages thread. The round loop below
     * only ever APPENDS to apiMessages; it never touches
     * conversationHistory, so the single-owner cleanup rule is trivially
     * satisfied. */
    const apiMessages = buildApiMessages(fullPayload, displayPrompt, turnId);
    let toolBudget = getMaxTavilyCalls();

    /* Live accumulator: the stream writes the answer text into it as
     * tokens arrive, so the abort path below can finalize the turn with
     * the partial text. */
    const live = { text: '' };

    try {
      for (;;) {
        const toolCalls = await streamChatCompletion(apiMessages, activeModel, toolBudget, contentEl, signal, live);

        /* No tool calls: the model produced its final answer. Turn over. */
        if (toolCalls.length === 0) {
          completeAssistantTurn(contentEl, live.text, displayPrompt, fullPayload, turnId);
          return;
        }

        /* Tool calls arrived on a round where NO tools were offered
         * (budget at 0, whether configured that way or spent by earlier
         * calls -- a model emitting calls against an omitted tools key).
         * No further API round is made: the pending calls are discarded
         * and the turn finishes with whatever text streamed. apiMessages
         * is turn-scoped and dies here, and conversationHistory only ever
         * stores final text content, so nothing dangles. */
        if (toolBudget <= 0) {
          completeAssistantTurn(contentEl,
            live.text + '\n\n-- TOOL BUDGET EXHAUSTED; PENDING TOOL CALLS DISCARDED --',
            displayPrompt, fullPayload, turnId);
          return;
        }

        /* Execute the batch, then loop for the next round. The budget
         * decreases by the calls just executed, matching the "up to N
         * tool calls in total" line the runtime context gives the model;
         * if a batch overshoots the remaining budget, clamp to 0 (one
         * batch is the accepted overrun bound -- no partial-decline
         * logic). Each iteration re-runs streamChatCompletion, so each
         * round's thinking phase starts fresh in a clean local. */
        apiMessages.push({
          role: 'assistant',
          content: live.text || null,
          tool_calls: toolCalls.map(tc => ({ id: tc.id, type: 'function', function: { name: tc.name, arguments: tc.arguments } }))
        });
        for (const tc of toolCalls) {
          apiMessages.push({ role: 'tool', tool_call_id: tc.id, content: await executeToolCall(tc, contentEl, live.text, signal) });
        }
        toolBudget = Math.max(0, toolBudget - toolCalls.length);
      }
    } catch (err) {
      /* Stop button: whatever streamed in survives as a partial turn. */
      if (err.name === 'AbortError') {
        finalizeStoppedResponse(contentEl, live.text);
        addRetryButton(contentEl, () => retryTurn(contentEl.parentElement, false, displayPrompt, fullPayload));
        addSpeakButton(contentEl, live.text);
        /* Only partial content makes it into history; an empty abort
         * leaves the turn unrecorded (the retry button recreates it).
         * Either way the entry carries the turn's id, so rollback
         * filters it out correctly even though user/assistant entries
         * no longer strictly alternate. */
        if (live.text) pushHistoryEntry({ role: 'assistant', content: live.text, turnId });
        resetInput();
        return;
      }
      setError(contentEl, err.message || 'Request failed');
      addRetryButton(contentEl, () => retryTurn(contentEl.parentElement, false, displayPrompt, fullPayload));
      /* Failed turns end too: retire the spacer so the error message is
       * the scroll floor. (Abort turns are covered by
       * finalizeStoppedResponse.) */
      removeScrollSpacer();
      /* This entry point is the turn owner (there is no recursion), so it
       * pops the user entry it pushed in buildApiMessages. */
      conversationHistory.pop();
      resetInput();
    }
  }

  /* 
   * ==========================================================================
   * REASONING TOKEN STREAM
   * Same rAF-throttle contract as renderMarkdownThrottled: reasoning deltas
   * arrive per-token, DOM is touched once per frame. Single-flight safety
   * comes from the same guarantee the markdown throttle relies on (only one
   * response stream is live at a time).
   * ==========================================================================
   */
  let thinkRenderScheduled = false, pendingThinkText = '';

  function renderThinkingThrottled(thinkEl, text) {
    pendingThinkText = text;
    if (!thinkRenderScheduled) {
      thinkRenderScheduled = true;
      requestAnimationFrame(() => {
        /* textContent, not innerHTML: raw prose, no markdown pass, no
         * sanitizer round-trip, XSS-proof by construction. */
        thinkEl.textContent = pendingThinkText;
        /* Tail-follow on an overflow:hidden element: scrollTop works even
         * when the scrollbar is suppressed, which is what pins the newest
         * tokens on screen without ever growing the document. */
        thinkEl.scrollTop = thinkEl.scrollHeight;
        /* The reasoning tail grows the message too: keep the spacer
         * exactly fitted so no scrollable void accumulates below it. */
        sizeScrollSpacer(thinkEl.parentElement);
        thinkRenderScheduled = false;
      });
    }
  }

  /* Retires the reasoning tail. Removal (not display:none) here because these
   * call sites mean the turn is OVER -- no further rounds will stream. The
   * first-final-answer-token transition inside the SSE loop uses display:none
   * instead, because a tool-loop round may re-show the element later. */
  function dismissThinking(contentEl) {
    contentEl?.parentElement?.querySelector('.thinking-scroll')?.remove();
  }

  /* IMAGE GENERATION EXECUTION */
  async function sendImagePrompt() {
    if (isProcessing) return;
    const prompt = promptInput.value.trim();
    if (!prompt || !CONFIG) return;

    promptInput.value = ''; autoGrow(); lockConversationMode('image'); isProcessing = true;
    /* Attachments never apply to image mode; drop BOTH freshly picked files
     * and parts carried over from an edited turn, so neither can leak into a
     * later chat send. (The old code dropped only the carried parts, leaving
     * freshly picked files stranded on a now-disabled attach button, in
     * contradiction with this comment's stated intent.) */
    pendingPayloadParts = [];
    attachedFiles = [];
    updateAttachButtonState();
    activeAbortController = new AbortController();
    try {
      setLoading(sendImgBtn); await dismissKeyboard(); 
      const turnId = createUserMessage(prompt, prompt);
      await executeImageRequest(prompt, mountAssistantMessage(), activeAbortController.signal, turnId);
    } finally { 
      isProcessing = false; 
      activeAbortController = null;
    }
  }

  async function executeImageRequest(promptText, contentEl, signal, turnId) {
    /* DEFAULT_CONFIG is the single source of truth for image-generation
     * defaults; the fallbacks below only cover a strangely partial CONFIG. */
    const targetModel = CONFIG.imageModel || DEFAULT_CONFIG.imageModel;
    updateStatusBar(targetModel);

    /* One retry closure for every error/abort path below (image turns never
     * attach files, hence the null payload). */
    const onRetry = () => retryTurn(contentEl.parentElement, true, promptText, null);

    pushHistoryEntry({ role: 'user', content: promptText, displayPrompt: promptText, turnId });

    const payload = {
      model: targetModel,
      prompt: promptText,
      size: CONFIG.imageResolution || DEFAULT_CONFIG.imageResolution,
      quality: CONFIG.imageQuality || DEFAULT_CONFIG.imageQuality,
      style: CONFIG.imageStyle || DEFAULT_CONFIG.imageStyle
    };
    if (lastGeneratedImageUrl) payload.image = lastGeneratedImageUrl;

    try {
      const res = await apiFetch('v1/openai/images/generations', payload, signal);
      if (!res.ok) {
        const err = `Image request (model ${targetModel}) failed: ` + await httpErrorDetail(res);
        setError(contentEl, err);
        addRetryButton(contentEl, onRetry);
        removeScrollSpacer();
        conversationHistory.pop();
        resetInput();
        return;
      }

      const data = await res.json();
      const b64 = data?.data?.[0]?.b64_json;
      const imageUrl = data?.data?.[0]?.url || (b64 ? `data:image/png;base64,${b64}` : null);
      if (!imageUrl) throw new Error('No image returned');

      contentEl.classList.remove('placeholder');
      contentEl.innerHTML = '';
      const imgEl = document.createElement('img');
      imgEl.src = imageUrl;
      imgEl.className = 'img-thumbnail';
      imgEl.alt = promptText;
      imgEl.onclick = () => openLightbox(imageUrl);
      contentEl.appendChild(imgEl);
      addRetryButton(contentEl, onRetry);
      /* Turn over: retire the spacer. The image may still grow into its
       * natural size after load, but that only extends the NATURAL content
       * (and the natural scroll range) -- the phantom scrollable void is
       * gone either way. */
      removeScrollSpacer();

      lastGeneratedImageUrl = imageUrl;
      pushHistoryEntry({ role: 'assistant', type: 'image', url: imageUrl, turnId });
      resetInput();
    } catch (err) {
      if (err.name === 'AbortError') {
        finalizeStoppedResponse(contentEl, '');
        addRetryButton(contentEl, onRetry);
        resetInput();
        return;
      }
      setError(contentEl, err.message || 'Image request failed');
      addRetryButton(contentEl, onRetry);
      removeScrollSpacer();
      conversationHistory.pop();
      resetInput();
    }
  }

  sendBtn.onclick = () => { if (sendBtn.classList.contains('stop')) activeAbortController?.abort(); else if (!isProcessing) sendPrompt(); };
  sendImgBtn.onclick = () => { if (sendImgBtn.classList.contains('stop')) activeAbortController?.abort(); else if (!isProcessing) sendImagePrompt(); };

  /* 
   * ==========================================================================
   * DESKTOP KEYBOARD SUBMIT SHORTCUT
   * On devices with a fine pointer (desktop), Enter submits the prompt and
   * Shift+Enter inserts a newline (multi-paragraph input). On touch devices
   * (primary pointer: coarse), Enter keeps inserting newlines as before --
   * the Send button remains the submit gesture there. Submission routes to
   * the mode-appropriate handler: text send in chat mode, image generation
   * when the conversation is locked to image mode. e.isComposing guards
   * against submitting mid-IME-composition (CJK input, dead keys, etc.).
   * ==========================================================================
   */
  const isDesktopPointer = window.matchMedia('(hover: hover) and (pointer: fine)');

  promptInput.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
    if (!isDesktopPointer.matches) return;
    e.preventDefault();
    if (isProcessing) return;
    if (conversationMode === 'image') sendImagePrompt();
    else sendPrompt();
  });

  /* INITIALIZATION */
  const savedConfig = loadConfig();
  if (savedConfig) { 
    CONFIG = savedConfig; 
    updateStatusBar(); 
  } else { 
    CONFIG = null; 
    updateStatusBar(); 
    loadSettingsIntoForm(); 
    settingsScreen.style.display = 'flex'; 
  }
  checkEmptyState();
  /* Focus the prompt input on load (mobile & desktop alike) when the app
   * is ready for input. When no config exists, the settings screen covers
   * the page and owns the focus instead. */
  if (CONFIG) promptInput.focus();
</script>
</body>
</html>
