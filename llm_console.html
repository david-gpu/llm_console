<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=resizes-content">
<title>LLM CONSOLE</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
<script>
  /* 
   * ==========================================================================
   * DESIGN SPECIFICATION & TAXONOMY (JS/STATE LEVEL)
   * ==========================================================================
   * 1. INTERACTIVE CONTROLS : Enclosed in square brackets `[ BUTTON ]`.
   * 2. PROCESS TELEMETRY   : Prefixed and suffixed with double dashes `-- STATUS --`.
   * 3. SYSTEM ERRORS/ABORTS: Enclosed in angle brackets `< ERROR >`.
   * 4. USER PROMPT INPUT   : Prefixed with standard right angle `>`.
   * ==========================================================================
   */

  const CONFIG_KEY = 'llm-console-config';
  const HISTORY_PREFIX = 'llm-console-history-';

  const DEFAULT_CONFIG = {
    apiKey:          "",
    apiHost:         "https://api.deepinfra.com",
    apiPath:         "v1/openai/chat/completions",
    tavilyApiKey:    "",
    maxTavilyCalls:  3,
    model:           "deepseek-ai/DeepSeek-V4-Pro-0813",
    visionModel:     "Qwen/Qwen3-VL-30B-A3B-Instruct",
    imageModel:      "black-forest-labs/FLUX-2-klein-9b",
    reasoningEffort: "medium",
    imageResolution: "1280x720",
    imageQuality:    "standard",
    imageStyle:      "natural",
    systemPrompt:    "You are a helpful assistant.",
    extraParams:     {}
  };

  const ROBOT_SVG = `<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg" fill="#2BE060" stroke="#2BE060">
    <rect x="40" y="10" width="20" height="10" />
    <rect x="120" y="10" width="20" height="10" />
    <rect x="46" y="20" width="8" height="15" />
    <rect x="126" y="20" width="8" height="15" />
    <rect x="30" y="35" width="120" height="50" fill="none" stroke-width="6" />
    <rect x="20" y="45" width="10" height="30" />
    <rect x="150" y="45" width="10" height="30" />
    <rect x="52" y="48" width="20" height="20" />
    <rect x="108" y="48" width="20" height="20" />
    <path d="M 65 74 H 115" stroke-width="5" stroke-linecap="square" />
    <rect x="85" y="85" width="10" height="15" />
    <rect x="20" y="100" width="140" height="45" fill="none" stroke-width="6" />
    <rect x="35" y="110" width="110" height="25" fill="#2BE060" fill-opacity="0.2" stroke="none" />
    <line x1="55" y1="122.5" x2="125" y2="122.5" stroke-width="6" stroke-linecap="square" />
    <rect x="30" y="150" width="120" height="18" fill="none" stroke-width="5" />
    <line x1="40" y1="159" x2="140" y2="159" stroke-width="6" stroke-dasharray="12 6" />
  </svg>`;

  function loadConfig() {
    try {
      const raw = localStorage.getItem(CONFIG_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        return Object.assign({}, DEFAULT_CONFIG, parsed);
      }
    } catch (e) {
      console.warn('Failed to load config:', e);
    }
    return null;
  }

  function saveConfig(config) {
    localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
  }

  function getHistory(key) {
    try {
      const raw = localStorage.getItem(HISTORY_PREFIX + key);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function addHistoryValue(key, value) {
    if (!value || typeof value !== 'string') return;
    const val = value.trim();
    if (!val) return;
    let list = getHistory(key);
    list = list.filter(item => item !== val);
    list.unshift(val);
    if (list.length > 25) list = list.slice(0, 25);
    localStorage.setItem(HISTORY_PREFIX + key, JSON.stringify(list));
  }

  function removeHistoryValue(key, value) {
    let list = getHistory(key);
    list = list.filter(item => item !== value);
    localStorage.setItem(HISTORY_PREFIX + key, JSON.stringify(list));
  }

  function escapeHtml(value) {
    const div = document.createElement('div');
    div.textContent = value;
    return div.innerHTML;
  }

  function extractDomainName(urlStr) {
    if (!urlStr) return "";
    try {
      let host = urlStr.replace(/^https?:\/\//i, '').split('/')[0].split(':')[0];
      let parts = host.split('.');
      if (parts.length >= 2) {
        return parts[parts.length - 2];
      }
      return host;
    } catch (e) {
      return urlStr;
    }
  }
</script>
<style>
  /* 
   * ==========================================================================
   * DESIGN SPECIFICATION & CSS SYSTEM SPEC
   * ==========================================================================
   * COLOR PALETTE:
   * --amber-phosphor (#FFAE1A) : Primary color for user-associated input & prompt space.
   * --amber-dim      (#7A520B) : Dimmed state for disabled user-associated controls.
   * --green-phosphor (#2BE060) : Primary color for system/assistant output space.
   * --green-dim      (#13632B) : Dimmed state for secondary system decorations.
   * --red-phosphor   (#FF4A4A) : Critical alerts, errors, and aborted states.
   * 
   * TYPOGRAPHY & SIZING:
   * Single unified monospace typeface (--font-term) across standard text, inputs, 
   * headers, and code blocks. Base text size set to 20px.
   * ==========================================================================
   */

  :root {
    --bg:               #080C08;
    --panel:            #0F150F;
    --border:           #1C331C;
    
    --amber-phosphor:   #FFAE1A;
    --amber-dim:        #7A520B;
    --green-phosphor:   #2BE060;
    --green-dim:        #13632B;
    --red-phosphor:     #FF4A4A;
    
    --font-term:        "Courier New", Courier, "Liberation Mono", VT323, Consolas, monospace;
    --font-size-base:   19px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--green-phosphor);
    font-family: var(--font-term);
    font-size: var(--font-size-base);
    line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }

  /* FULL-SCREEN CRT OVERLAY (SCANLINES, SUBPIXELS, SOFTENED VIGNETTE) */
  .crt-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    background:
      /* 1. Horizontal Scanlines */
      repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.45) 0px,
        rgba(0, 0, 0, 0.45) 1px,
        transparent 1px,
        transparent 2px
      ),
      /* 2. Vertical RGB Subpixel Mask */
      repeating-linear-gradient(
        90deg,
        rgba(255, 0, 0, 0.03),
        rgba(0, 255, 0, 0.03) 1px,
        rgba(0, 0, 255, 0.03) 2px,
        transparent 3px
      ),
      /* 3. Outer Edge Vignette (Toned Down) */
      radial-gradient(
        circle at center,
        transparent 75%,
        rgba(0, 0, 0, 0.3) 100%
      );
    animation: overlay-crt-fadeout 4s ease-in-out forwards;
  }

  /* MAIN WRAPPER FOR BLOOM & CHROMATIC ABERRATION */
  .crt-screen-content {
    display: flex;
    flex-direction: column;
    height: var(--app-height, 100dvh);
    width: 100%;
    animation: content-crt-fadeout 4s ease-in-out forwards;
  }

  /* TIMED CRT FADE ANIMATIONS: FULL STRENGTH (0-2s) -> MODERN UI (4s) */
  @keyframes overlay-crt-fadeout {
    0%, 50% {
      opacity: 1;
      visibility: visible;
    }
    100% {
      opacity: 0;
      visibility: hidden;
    }
  }

  @keyframes content-crt-fadeout {
    0%, 50% {
      filter: blur(1.1px) contrast(1.15) brightness(1.1);
      text-shadow: 0 0 3px currentColor, -1px 0 1px rgba(255, 0, 0, 0.5), 1px 0 1px rgba(0, 255, 0, 0.5);
    }
    100% {
      filter: blur(0px) contrast(1) brightness(1);
      text-shadow: none;
    }
  }

  /* REUSED TAXONOMY UTILITIES */
  .term-font { 
    font-family: var(--font-term) !important; 
    font-size: var(--font-size-base) !important; 
  }

  .amber-txt { color: var(--amber-phosphor) !important; }
  .green-txt { color: var(--green-phosphor) !important; }
  .red-txt   { color: var(--red-phosphor) !important; text-align: left !important; }

  /* SPARSE TOP BAR */
  .statusbar {
    flex: 0 0 auto;
    padding: 8px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    white-space: nowrap;
    overflow: hidden;
    gap: 12px;
  }

  .statusbar #statusHost {
    text-align: left;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 0 1 auto;
  }
  
  .statusbar #statusModel {
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 0 1 auto;
  }

  .conversation-wrap {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 16px 14px 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .scroll-spacer {
    flex: 0 0 auto;
    pointer-events: none;
  }

  /* EMPTY SPLASH STATE */
  .empty-splash {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: auto;
    text-align: center;
    user-select: none;
    opacity: 0.85;
    padding: 20px;
  }

  .empty-splash svg {
    width: 180px;
    height: 180px;
    margin-bottom: 14px;
  }

  .empty-splash .splash-title {
    font-size: 0.9em;
    color: var(--green-phosphor);
    letter-spacing: 0.12em;
  }

  .message {
    max-width: 100%;
    word-wrap: break-word;
    text-align: left;
  }

  .message.user {
    align-self: flex-start;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .user-content-wrap {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    width: 100%;
  }

  .user-prompt-prefix {
    font-weight: bold;
    flex: 0 0 auto;
    user-select: none;
  }

  .user-prompt-text {
    white-space: pre-wrap;
    flex: 1 1 auto;
  }

  /* EDIT PROMPT BUTTON (USER AMBER SPACE) */
  .edit-prompt-btn {
    align-self: flex-start;
    background: transparent;
    border: 1px solid var(--amber-phosphor);
    color: var(--amber-phosphor);
    border-radius: 2px;
    padding: 3px 8px;
    font-family: var(--font-term);
    font-size: 0.8em;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-left: 18px;
  }

  .edit-prompt-btn:hover {
    background: var(--amber-phosphor);
    color: var(--bg);
  }

  .message.assistant {
    align-self: flex-start;
    width: 100%;
    color: var(--green-phosphor);
    text-align: left;
  }

  /* PROCESS TELEMETRY / TOOL EXECUTION STYLE (-- STATUS --) */
  .tool-status-msg {
    margin: 8px 0;
    padding: 6px 10px;
    border-left: 2px solid var(--green-phosphor);
    background: rgba(43, 224, 96, 0.05);
    font-size: var(--font-size-base);
    text-align: left;
    color: var(--green-phosphor);
  }

  /* SYSTEM ERROR AND ABORT NOTIFICATIONS (< ERROR >) */
  .error-msg-text {
    color: var(--red-phosphor) !important;
    font-family: var(--font-term) !important;
    font-size: var(--font-size-base) !important;
    text-align: left !important;
    margin-top: 8px;
    display: block;
  }

  /* PLACEHOLDER & THINKING ANIMATION */
  .placeholder {
    display: inline-flex;
    align-items: center;
    text-align: left;
  }

  .placeholder::before {
    content: "-";
    display: inline-block;
    margin-right: 6px;
    animation: ascii-spin 0.6s steps(4) infinite;
  }

  .placeholder::after {
    content: "█";
    display: inline-block;
    margin-left: 4px;
    animation: blink-cursor 0.8s infinite;
  }

  @keyframes ascii-spin {
    0% { content: "-"; }
    25% { content: "\\"; }
    50% { content: "|"; }
    75% { content: "/"; }
  }

  /* BINARY ON/OFF CURSOR TOGGLE (NO FADING) */
  @keyframes blink-cursor {
    0%, 49.9% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  /* INPUT BAR CONTROLS */
  .inputbar {
    flex: 0 0 auto;
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
    display: flex;
    align-items: flex-end;
    gap: 8px;
    flex-wrap: nowrap;
    transition: transform 0.3s ease;
    will-change: transform;
  }

  /* GPU-TRANSFORM ONLY HIDE TO PREVENT FLEX-LAYOUT CONTAINER RESIZING */
  .inputbar.hidden {
    transform: translateY(100%);
    pointer-events: none;
  }

  .inputbar-main {
    display: flex;
    flex: 1 1 auto;
    align-items: stretch;
    gap: 8px;
    min-width: 0;
  }

  .prompt-prefix {
    flex: 0 0 auto;
    padding-top: 8px;
    font-weight: bold;
    color: var(--amber-phosphor);
  }

  textarea#promptInput {
    flex: 1 1 auto;
    min-width: 0;
    width: 100%;
    resize: vertical;
    background: var(--bg);
    color: var(--amber-phosphor);
    border: 1px solid var(--amber-phosphor);
    border-radius: 2px;
    padding: 8px 10px;
    font-family: var(--font-term);
    font-size: var(--font-size-base);
    line-height: 1.45;
    min-height: 86px;
    height: 86px;
    max-height: 240px;
  }

  textarea#promptInput:focus-visible {
    outline: none;
    border-color: var(--amber-phosphor);
    box-shadow: 0 0 6px rgba(255, 174, 26, 0.4);
  }

  .action-stack {
    display: grid;
    grid-template-columns: repeat(2, 40px);
    gap: 6px;
    flex: 0 0 auto;
  }

  .attach-btn,
  .gear-btn {
    width: 40px;
    height: 40px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--panel);
    border: 1px solid var(--amber-phosphor);
    color: var(--amber-phosphor);
    border-radius: 2px;
    font-family: var(--font-term);
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }

  .attach-btn:hover,
  .gear-btn:hover {
    background: var(--amber-phosphor);
    color: var(--bg);
  }

  button.send,
  button.send-img {
    width: 40px;
    height: 40px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--panel);
    border: 2px solid var(--amber-phosphor);
    color: var(--amber-phosphor);
    border-radius: 2px;
    font-family: var(--font-term);
    font-weight: bold;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }

  button.send svg,
  button.send-img svg {
    stroke-width: 2.8px;
  }

  button.send:not(:disabled):hover,
  button.send-img:not(:disabled):hover {
    color: var(--bg);
    background: var(--amber-phosphor);
  }

  button.send:disabled,
  button.send-img:disabled,
  .attach-btn:disabled {
    color: var(--amber-dim);
    border-color: var(--border);
    opacity: 0.7;
    cursor: not-allowed;
  }

  button.send.stop,
  button.send-img.stop {
    color: var(--red-phosphor);
    border-color: var(--red-phosphor);
  }

  button.send.stop:not(:disabled):hover,
  button.send-img.stop:not(:disabled):hover {
    background: var(--red-phosphor);
    color: var(--bg);
  }

  .attachment-preview {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin: 4px 4px 0 0;
    padding: 4px 8px;
    background: var(--panel);
    border: 1px solid var(--amber-phosphor);
    border-radius: 2px;
    font-size: 0.8em;
    color: var(--amber-phosphor);
  }

  .remove-attachment-btn {
    background: transparent;
    border: none;
    color: var(--amber-phosphor);
    cursor: pointer;
    padding: 0 2px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .remove-attachment-btn:hover { color: var(--red-phosphor); }

  .img-thumbnail {
    max-height: 240px;
    max-width: 100%;
    border-radius: 2px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: border-color 0.15s;
    object-fit: contain;
  }

  .img-thumbnail:hover {
    border-color: var(--green-phosphor);
  }

  .lightbox-overlay {
    position: fixed;
    inset: 0;
    background: rgba(8, 12, 8, 0.95);
    z-index: 5000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    touch-action: none;
  }

  .lightbox-img {
    max-width: 95vw;
    max-height: 95vh;
    border: 1px solid var(--green-phosphor);
    object-fit: contain;
  }

  .lightbox-close {
    position: absolute;
    top: 16px;
    right: 24px;
    color: var(--green-phosphor);
    cursor: pointer;
    z-index: 5001;
  }

  /* RETRY BUTTON MATCHES ASSISTANT GREEN PHOSPHOR */
  .retry-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin: 8px 0 0;
    padding: 4px 10px;
    background: transparent;
    border: 1px solid var(--green-phosphor);
    color: var(--green-phosphor);
    border-radius: 2px;
    font-size: 0.8em;
    font-family: var(--font-term);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .retry-btn:hover {
    background: var(--green-phosphor);
    color: var(--bg);
  }

  /* FULL-SCREEN CONFIG SCREEN OVERLAY */
  .settings-screen {
    position: fixed;
    inset: 0;
    z-index: 4000;
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }

  .settings-form {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }

  .settings-header {
    flex: 0 0 auto;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--amber-phosphor);
    color: var(--amber-phosphor);
    font-size: var(--font-size-base);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .settings-body {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .settings-body .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .settings-body label {
    font-size: 0.75em;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--amber-phosphor);
  }

  .settings-body input,
  .settings-body select,
  .settings-body textarea {
    width: 100%;
    background: var(--bg);
    color: var(--amber-phosphor);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 8px 10px;
    font-family: var(--font-term);
    font-size: var(--font-size-base);
  }

  .settings-body input:focus-visible,
  .settings-body select:focus-visible,
  .settings-body textarea:focus-visible {
    outline: none;
    border-color: var(--amber-phosphor);
    box-shadow: 0 0 6px rgba(255, 174, 26, 0.4);
  }

  .field-history-wrap {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
  }

  .field-history-wrap input[type="text"] {
    border-top-right-radius: 0;
    border-bottom-right-radius: 0;
  }

  .history-toggle-btn {
    flex: 0 0 auto;
    height: 41px;
    padding: 0 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-left: none;
    color: var(--amber-phosphor);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .history-toggle-btn:hover {
    background: var(--panel);
    border-color: var(--amber-phosphor);
  }

  .history-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    z-index: 100;
    background: var(--panel);
    border: 1px solid var(--amber-phosphor);
    max-height: 180px;
    overflow-y: auto;
    margin-top: 2px;
  }

  .history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    font-size: 0.85em;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }

  .history-item:hover {
    background: var(--amber-phosphor);
    color: var(--bg);
  }

  .history-item-del {
    background: transparent;
    border: none;
    color: var(--amber-phosphor);
    cursor: pointer;
    padding: 2px 6px;
  }

  .history-item:hover .history-item-del { color: var(--red-phosphor); }

  .settings-footer {
    flex: 0 0 auto;
    padding: 12px 14px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
  }

  .settings-footer button.primary {
    flex: 1 1 auto;
    background: var(--amber-phosphor);
    color: var(--bg);
    border: 1px solid var(--amber-phosphor);
    padding: 10px 14px;
    font-family: var(--font-term);
    font-size: 0.85em;
    text-transform: uppercase;
    cursor: pointer;
    font-weight: bold;
  }

  .settings-footer button.primary:hover {
    background: transparent;
    color: var(--amber-phosphor);
  }

  .settings-footer button.secondary {
    flex: 0 0 auto;
    background: transparent;
    color: var(--amber-phosphor);
    border: 1px solid var(--border);
    padding: 10px 14px;
    font-family: var(--font-term);
    font-size: 0.85em;
    text-transform: uppercase;
    cursor: pointer;
  }

  .settings-footer button.secondary:hover {
    border-color: var(--amber-phosphor);
  }

  /* MARKDOWN & CODE BLOCKS - UNIFIED TYPEFACE & SIZE */
  .markdown-body {
    font-family: var(--font-term) !important;
    font-size: var(--font-size-base) !important;
    line-height: 1.45;
    color: var(--green-phosphor);
    text-align: left;
  }

  .markdown-body pre,
  .markdown-body code {
    font-family: var(--font-term) !important;
    font-size: var(--font-size-base) !important;
  }

  .markdown-body pre {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 12px;
    overflow-x: auto;
    margin: 0;
    text-align: left;
  }

  .code-block-wrapper {
    margin: 10px 0;
    border: 1px solid var(--border);
    background: var(--panel);
    position: relative;
    cursor: pointer;
  }

  .code-block-wrapper.collapsed pre {
    max-height: 14.5em;
    overflow-y: hidden;
  }

  .code-expand-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: var(--bg);
    border-top: 1px solid var(--border);
    cursor: pointer;
    font-size: 0.75em;
    color: var(--green-phosphor);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* CODE CONTEXT MENU / EPHEMERAL TOAST */
  .code-context-menu {
    position: fixed;
    z-index: 3000;
    background: var(--panel);
    border: 1px solid var(--green-phosphor);
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px;
  }

  .code-context-menu button {
    background: transparent;
    border: 1px solid transparent;
    color: var(--green-phosphor);
    padding: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .code-context-menu button:hover {
    background: var(--green-phosphor);
    color: var(--bg);
  }

  .markdown-body table {
    border-collapse: collapse;
    margin: 8px 0;
    width: 100%;
    border: 1px solid var(--border);
  }

  .markdown-body th,
  .markdown-body td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: left;
  }

  .markdown-body thead th {
    background: var(--panel);
    color: var(--green-phosphor);
  }

  .error-container {
    position: fixed;
    top: 45px;
    right: 15px;
    background: var(--bg);
    border: 1px solid var(--red-phosphor);
    color: var(--red-phosphor);
    padding: 10px 14px;
    z-index: 1000;
    display: none;
    max-width: 340px;
    font-family: var(--font-term);
    font-size: var(--font-size-base);
    text-align: left;
  }
</style>
</head>
<body>

  <!-- FULLSCREEN SCANLINE & SUBPIXEL OVERLAY -->

            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>

  <input type="file" id="fileInput" multiple style="display:none;" />

  <div class="error-container term-font" id="errorContainer"></div>

  <div id="lightbox" class="lightbox-overlay" style="display:none;">
    <span class="lightbox-close" id="lightboxClose">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </span>
    <img id="lightboxImg" class="lightbox-img" src="" alt="Fullscreen View" />
  </div>

<script>
  const conversationWrap = document.getElementById('conversationWrap');
  const promptInput = document.getElementById('promptInput');
  const sendBtn = document.getElementById('sendBtn');
  const sendImgBtn = document.getElementById('sendImgBtn');
  const statusHost = document.getElementById('statusHost');
  const statusModel = document.getElementById('statusModel');
  const settingsScreen = document.getElementById('settingsScreen');
  const inputbar = document.getElementById('inputbar');
  const gearBtn = document.getElementById('gearBtn');
  const fileInput = document.getElementById('fileInput');
  const attachBtn = document.getElementById('attachBtn');
  const errorContainer = document.getElementById('errorContainer');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxClose = document.getElementById('lightboxClose');

  let CONFIG = null;
  let conversationHistory = [];
  let abortController = null;
  let attachedFiles = [];
  let isProcessing = false;
  let isAutoScrolling = false;
  let lastPromptPayload = null;
  let conversationMode = null;
  let lastGeneratedImageUrl = null;
  let scrollSpacer = null;
  const expandedCodeBlocksState = new Map();

  const SVG_ICONS = {
    send: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>`,
    image: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>`,
    stop: `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"></rect></svg>`,
    edit: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`,
    copy: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`,
    download: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>`,
    retry: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>`,
    chevronDown: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>`,
    chevronUp: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>`,
    file: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>`,
    close: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`,
    trash: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`
  };

  // ==== EMPTY STATE SPLASH MANAGEMENT ====

  function renderEmptySplash() {
    if (document.getElementById('emptySplash')) return;
    const splashDiv = document.createElement('div');
    splashDiv.id = 'emptySplash';
    splashDiv.className = 'empty-splash term-font';
    splashDiv.innerHTML = `${ROBOT_SVG}<div class="splash-title">READY FOR INPUT</div>`;
    conversationWrap.appendChild(splashDiv);
  }

  function removeEmptySplash() {
    const splash = document.getElementById('emptySplash');
    if (splash) splash.remove();
  }

  function checkEmptyState() {
    if (conversationHistory.length === 0) {
      renderEmptySplash();
    } else {
      removeEmptySplash();
    }
  }

  // ==== LIGHTBOX PINCH-TO-ZOOM ====

  let scale = 1;
  let startDist = 0;
  let initialScale = 1;
  let translateX = 0;
  let translateY = 0;
  let startX = 0;
  let startY = 0;

  function resetZoom() {
    scale = 1;
    translateX = 0;
    translateY = 0;
    startDist = 0;
    initialScale = 1;
    updateTransform();
  }

  function updateTransform() {
    lightboxImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
  }

  function getTouchDistance(touches) {
    return Math.hypot(
      touches[0].clientX - touches[1].clientX,
      touches[0].clientY - touches[1].clientY
    );
  }

  lightboxImg.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      startDist = getTouchDistance(e.touches);
      initialScale = scale;
    } else if (e.touches.length === 1 && scale > 1) {
      startX = e.touches[0].clientX - translateX;
      startY = e.touches[0].clientY - translateY;
    }
  }, { passive: true });

  lightboxImg.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2) {
      const currentDist = getTouchDistance(e.touches);
      if (startDist > 0) {
        scale = Math.min(Math.max(1, initialScale * (currentDist / startDist)), 4);
        updateTransform();
      }
    } else if (e.touches.length === 1 && scale > 1) {
      translateX = e.touches[0].clientX - startX;
      translateY = e.touches[0].clientY - startY;
      updateTransform();
    }
  }, { passive: true });

  lightboxImg.addEventListener('touchend', (e) => {
    if (e.touches.length < 2) {
      startDist = 0;
    }
  });

  function openLightbox(src) {
    lightboxImg.src = src;
    lightbox.style.display = 'flex';
    resetZoom();
  }

  function closeLightbox() {
    lightbox.style.display = 'none';
    lightboxImg.src = '';
    resetZoom();
  }

  lightboxClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox || e.target === lightboxClose) {
      closeLightbox();
    }
  });

  // ==== RUNTIME CONTEXT ====

  function getFormattedRuntimeContext() {
    const now = new Date();
    if (now.getMinutes() >= 30) {
      now.setHours(now.getHours() + 1);
    }
    now.setMinutes(0, 0, 0);

    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    const dateStr = `${year}-${month}-${day}`;

    const hours = String(now.getHours()).padStart(2, '0');
    const timeStr = `${hours}:00`;

    return `\n\n[Runtime Context]\nDate: ${dateStr}\nTime: ~${timeStr}`;
  }

  // ==== TAVILY SERVICE INTEGRATION ====

  async function executeTavilySearch(query) {
    if (!CONFIG?.tavilyApiKey) throw new Error('Tavily API key not configured');
    const res = await fetch('https://api.tavily.com/search', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + CONFIG.tavilyApiKey
      },
      body: JSON.stringify({ query: query, max_results: 5, search_depth: 'basic' })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => null);
      throw new Error((err && err.detail) || res.statusText || 'Search failed');
    }
    const data = await res.json();
    return JSON.stringify(data.results || []);
  }

  async function executeTavilyExtract(urls) {
    if (!CONFIG?.tavilyApiKey) throw new Error('Tavily API key not configured');
    const urlList = Array.isArray(urls) ? urls : [urls];
    const res = await fetch('https://api.tavily.com/extract', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + CONFIG.tavilyApiKey
      },
      body: JSON.stringify({ urls: urlList })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => null);
      throw new Error((err && err.detail) || res.statusText || 'Extraction failed');
    }
    const data = await res.json();
    return JSON.stringify(data.results || []);
  }

  // ==== MODE LOCKING ====

  function lockConversationMode(mode) {
    if (!conversationMode) {
      conversationMode = mode;
      if (mode === 'chat') {
        sendImgBtn.disabled = true;
      } else if (mode === 'image') {
        sendBtn.disabled = true;
        attachBtn.disabled = true;
      }
    }
  }

  // ==== HELPER & SANITIZATION FUNCTIONS ====

  let renderScheduled = false;
  let pendingRenderData = null;

  function renderMarkdownThrottled(container, text) {
    pendingRenderData = { container, text };
    if (!renderScheduled) {
      renderScheduled = true;
      requestAnimationFrame(() => {
        if (pendingRenderData) {
          renderMarkdown(pendingRenderData.container, pendingRenderData.text);
        }
        renderScheduled = false;
      });
    }
  }

  function renderMarkdown(container, text) {
    container.classList.remove('placeholder');
    if (typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
      container.innerHTML = DOMPurify.sanitize(marked.parse(text));
    } else if (typeof marked !== 'undefined') {
      container.innerHTML = marked.parse(text);
    } else {
      container.textContent = text;
    }
    enhanceCodeBlocks(container);
  }

  async function generateLLMFilename(codeText) {
    if (!CONFIG || !CONFIG.apiKey) return 'snippet.txt';

    const snippetSample = codeText.slice(0, 1024);
    const url = CONFIG.apiHost.replace(/\/$/, '') + '/' + CONFIG.apiPath.replace(/^\//, '');

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 5000);

    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + CONFIG.apiKey
        },
        body: JSON.stringify({
          model: CONFIG.model,
          messages: [
            {
              role: 'user',
              content: `Generate a clean, descriptive filename for the following code snippet. Output ONLY 1 to 7 lowercase words separated by underscores with a matching file extension (e.g., process_data.py, main_component.jsx, schema.sql). Do not output markdown, quotes, or explanations:\n\n${snippetSample}`
            }
          ],
          reasoning_effort: 'none',
          service_tier: 'priority',
          temperature: 0.1,
          max_tokens: 25,
          stream: false
        }),
        signal: controller.signal
      });

      clearTimeout(timeoutId);

      if (!res.ok) throw new Error('Failed filename generation response');
      const data = await res.json();
      let filename = data?.choices?.[0]?.message?.content?.trim() || '';
      filename = filename.replace(/[`"'\s]/g, '').toLowerCase();

      if (!filename || !filename.includes('.')) {
        return 'snippet.txt';
      }
      return filename;
    } catch (err) {
      clearTimeout(timeoutId);
      console.warn('LLM filename generation fallback:', err);
      return 'snippet.txt';
    }
  }

  // ==== CONTEXT MENU & EPHEMERAL DOWNLOAD NOTIFICATION ====

  let activeContextMenu = null;

  function dismissContextMenu() {
    if (activeContextMenu) {
      activeContextMenu.remove();
      activeContextMenu = null;
    }
  }

  document.addEventListener('click', (e) => {
    if (activeContextMenu && !activeContextMenu.contains(e.target)) {
      dismissContextMenu();
    }

    if (!e.target.closest('.field-history-wrap')) {
      document.querySelectorAll('.history-dropdown').forEach(el => el.style.display = 'none');
    }
  });

  function showCodeContextMenu(x, y, codeText) {
    dismissContextMenu();

    const menu = document.createElement('div');
    menu.className = 'code-context-menu';

    const menuWidth = 84;
    const menuHeight = 44;
    const posX = Math.min(x, window.innerWidth - menuWidth - 10);
    const posY = Math.min(y, window.innerHeight - menuHeight - 10);

    menu.style.left = `${posX}px`;
    menu.style.top = `${posY}px`;

    const copyBtn = document.createElement('button');
    copyBtn.innerHTML = SVG_ICONS.copy;
    copyBtn.title = 'Copy Code';
    copyBtn.setAttribute('aria-label', 'Copy Code');
    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(codeText);
      } catch (err) {
        console.error('Failed to copy code:', err);
      }
      dismissContextMenu();
    });

    const downloadBtn = document.createElement('button');
    downloadBtn.innerHTML = SVG_ICONS.download;
    downloadBtn.title = 'Download Code';
    downloadBtn.setAttribute('aria-label', 'Download Code');
    downloadBtn.addEventListener('click', async () => {
      copyBtn.style.display = 'none';
      downloadBtn.style.display = 'none';

      const filename = await generateLLMFilename(codeText);
      const blob = new Blob([codeText], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);

      const toast = document.createElement('span');
      toast.className = 'green-txt term-font';
      toast.style.padding = '4px 8px';
      toast.style.fontSize = '0.85em';
      toast.style.whiteSpace = 'nowrap';
      toast.textContent = `-- Downloaded ${filename} --`;
      menu.appendChild(toast);

      setTimeout(() => {
        dismissContextMenu();
      }, 2000);
    });

    menu.appendChild(copyBtn);
    menu.appendChild(downloadBtn);
    document.body.appendChild(menu);
    activeContextMenu = menu;
  }

  function enhanceCodeBlocks(container) {
    const preElements = container.querySelectorAll('pre');
    preElements.forEach((pre) => {
      const codeEl = pre.querySelector('code');
      const codeText = codeEl ? codeEl.textContent : pre.textContent;
      const snippetKey = codeText.slice(0, 120);

      let wrapper = pre.parentElement;
      if (!wrapper || !wrapper.classList.contains('code-block-wrapper')) {
        wrapper = document.createElement('div');
        wrapper.className = 'code-block-wrapper';
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);
      }

      const lineCount = codeText.split('\n').length;
      if (lineCount > 10) {
        const isExpanded = expandedCodeBlocksState.get(snippetKey) === true;
        
        if (isExpanded) {
          wrapper.classList.remove('collapsed');
        } else {
          wrapper.classList.add('collapsed');
        }

        let expandBar = wrapper.querySelector('.code-expand-bar');
        if (!expandBar) {
          expandBar = document.createElement('div');
          expandBar.className = 'code-expand-bar';
          wrapper.appendChild(expandBar);
        }

        expandBar.innerHTML = isExpanded 
          ? `${SVG_ICONS.chevronUp} COLLAPSE`
          : `${SVG_ICONS.chevronDown} EXPAND`;

        expandBar.onclick = (e) => {
          e.stopPropagation();
          const collapsed = wrapper.classList.toggle('collapsed');
          const nowExpanded = !collapsed;
          expandedCodeBlocksState.set(snippetKey, nowExpanded);
          expandBar.innerHTML = nowExpanded 
            ? `${SVG_ICONS.chevronUp} COLLAPSE`
            : `${SVG_ICONS.chevronDown} EXPAND`;
        };
      }

      if (!wrapper.dataset.gesturesBound) {
        wrapper.dataset.gesturesBound = 'true';
        let touchStartX = 0;
        let touchStartY = 0;

        wrapper.addEventListener('pointerdown', (e) => {
          if (e.target.closest('.code-expand-bar')) return;
          touchStartX = e.clientX;
          touchStartY = e.clientY;
        });

        wrapper.addEventListener('pointerup', (e) => {
          if (e.target.closest('.code-expand-bar')) return;

          const dist = Math.hypot(e.clientX - touchStartX, e.clientY - touchStartY);
          if (dist > 8) return;

          const selection = window.getSelection();
          if (selection && selection.toString().trim().length > 0) return;

          e.stopPropagation();
          showCodeContextMenu(e.clientX, e.clientY, codeText);
        });
      }
    });
  }

  function populateHistoryDropdown(key) {

    const list = getHistory(key);
    if (list.length === 0) {

      return;

    dropdown.innerHTML = html;

    dropdown.querySelectorAll('.history-item').forEach(el => {

        if (delBtn) {

  function formatFileSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  async function readFileAsText(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsText(file);
    });
  }

  async function readFileAsDataURL(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function buildMultimodalContent(promptText, files) {
    const contentParts = [];

    if (promptText) {
      contentParts.push({ type: 'text', text: promptText });
    }

    for (const file of files) {
      if (file.type.startsWith('image/')) {
        const dataUrl = await readFileAsDataURL(file);
        contentParts.push({
          type: 'image_url',
          image_url: { url: dataUrl }
        });
      } else {
        const textContent = await readFileAsText(file);
        contentParts.push({
          type: 'text',
          text: `\n=== FILE: ${file.name} ===\n${textContent}\n=== END FILE ===`
        });
      }
    }

    return contentParts.length === 1 && contentParts[0].type === 'text'
      ? contentParts[0].text
      : contentParts;
  }

  // ==== CHAT & SCROLL BEHAVIOR ====

  function autoGrow() {
    promptInput.style.height = 'auto';
    promptInput.style.height = Math.max(86, Math.min(promptInput.scrollHeight, 240)) + 'px';
  }
  promptInput.addEventListener('input', autoGrow);

  let lastScrollTop = 0;
  const scrollThreshold = 10;

  conversationWrap.addEventListener('scroll', () => {
    if (isAutoScrolling || isProcessing) return;

    const currentScrollTop = conversationWrap.scrollTop;
    const maxScroll = conversationWrap.scrollHeight - conversationWrap.clientHeight;
    const diff = currentScrollTop - lastScrollTop;

    if (diff < -scrollThreshold && currentScrollTop > 20) {
      inputbar.classList.add('hidden');
    } else if (diff > scrollThreshold || currentScrollTop >= maxScroll - 20) {
      inputbar.classList.remove('hidden');
    }

    lastScrollTop = Math.max(0, currentScrollTop);
  });

  promptInput.addEventListener('focus', () => {
    inputbar.classList.remove('hidden');
    setTimeout(() => {
      promptInput.scrollIntoView({ block: 'end', behavior: 'smooth' });
    }, 50);
  });

  // ==== KEYBOARD-AWARE VIEWPORT HEIGHT ====
  function updateAppHeight() {
    const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-height', vh + 'px');
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', updateAppHeight);
    window.visualViewport.addEventListener('scroll', updateAppHeight);
  } else {
    window.addEventListener('resize', updateAppHeight);
  }
  updateAppHeight();

  // Polls until the visual viewport height stops changing across consecutive frames
  async function dismissKeyboard() {
    if (document.activeElement) {
      document.activeElement.blur();
    }
    promptInput.blur();

    if (window.visualViewport) {
      let lastHeight = window.visualViewport.height;
      let stableCount = 0;
      const start = Date.now();

      while (Date.now() - start < 800) {
        await new Promise(r => requestAnimationFrame(r));
        updateAppHeight();
        const currentHeight = window.visualViewport.height;
        if (Math.abs(currentHeight - lastHeight) < 1) {
          stableCount++;
          if (stableCount >= 5) break;
        } else {
          stableCount = 0;
          lastHeight = currentHeight;
        }
      }
    } else {
      await new Promise(r => setTimeout(r, 350));
    }

    updateAppHeight();
    await new Promise(r => requestAnimationFrame(r));
    await new Promise(r => requestAnimationFrame(r));
  }

  // ==== SCROLL-TO-TOP SPACER & ALIGNMENT ====
  function removeScrollSpacer() {
    if (scrollSpacer && scrollSpacer.parentElement === conversationWrap) {
      scrollSpacer.remove();
    }
    scrollSpacer = null;
  }

  function addScrollSpacer() {
    removeScrollSpacer();
    scrollSpacer = document.createElement('div');
    scrollSpacer.className = 'scroll-spacer';
    scrollSpacer.style.height = conversationWrap.clientHeight + 'px';
    conversationWrap.appendChild(scrollSpacer);
    return scrollSpacer;
  }

  function alignAssistantToTop(div) {
    if (!div || !div.parentElement) return;
    if (scrollSpacer) {
      scrollSpacer.style.height = conversationWrap.clientHeight + 'px';
    }
    const containerTop = conversationWrap.getBoundingClientRect().top;
    const targetTop = div.getBoundingClientRect().top;
    const delta = targetTop - containerTop;
    conversationWrap.scrollTop += delta;
  }

  function scrollAssistantToTop(div) {
    if (!div) return;
    isAutoScrolling = true;

    requestAnimationFrame(() => {
      alignAssistantToTop(div);
      requestAnimationFrame(() => {
        alignAssistantToTop(div);
        setTimeout(() => {
          isAutoScrolling = false;
        }, 100);
      });
    });
  }

  function createUserMessage(text) {
    removeEmptySplash();
    removeScrollSpacer();
    document.querySelectorAll('.edit-prompt-btn').forEach(btn => btn.remove());

    const div = document.createElement('div');
    div.className = 'message user term-font';

    contentWrap.className = 'user-content-wrap';

    const prefixSpan = document.createElement('span');

    prefixSpan.textContent = '>';
    contentWrap.appendChild(prefixSpan);

    const textSpan = document.createElement('span');
    textSpan.className = 'user-prompt-text amber-txt';
    textSpan.textContent = text;
    contentWrap.appendChild(textSpan);

    const editBtn = document.createElement('button');
    editBtn.className = 'edit-prompt-btn';
    editBtn.title = 'Edit prompt';
    editBtn.innerHTML = SVG_ICONS.edit;
    editBtn.addEventListener('click', () => {

    });

    div.appendChild(contentWrap);
    div.appendChild(editBtn);

    conversationWrap.appendChild(div);
  }

  function editLastPrompt(text, userMsgDiv) {
    if (isProcessing) return;

    const allUserMsgs = Array.from(conversationWrap.querySelectorAll('.message.user'));
    const uIdx = allUserMsgs.indexOf(userMsgDiv);

    let nextSibling = userMsgDiv.nextElementSibling;
    while (nextSibling) {
      const toRemove = nextSibling;
      nextSibling = nextSibling.nextElementSibling;
      toRemove.remove();
    }
    userMsgDiv.remove();

    if (uIdx !== -1) {
      conversationHistory = conversationHistory.slice(0, uIdx * 2);
    }

    if (conversationHistory.length === 0) {
      conversationMode = null;
      lastGeneratedImageUrl = null;
      attachedFiles = [];
      updateAttachmentPreview();
      sendBtn.disabled = false;
      sendImgBtn.disabled = false;
      attachBtn.disabled = false;
      checkEmptyState();
    }

    promptInput.value = text;
    autoGrow();
    promptInput.focus();

    const remainingUserMsgs = conversationWrap.querySelectorAll('.message.user');
    if (remainingUserMsgs.length > 0) {
      const lastUserMsg = remainingUserMsgs[remainingUserMsgs.length - 1];
      if (!lastUserMsg.querySelector('.edit-prompt-btn')) {
        const prevText = lastUserMsg.querySelector('.user-prompt-text')?.textContent || '';
        const prevEditBtn = document.createElement('button');
        prevEditBtn.className = 'edit-prompt-btn';
        prevEditBtn.title = 'Edit prompt';
        prevEditBtn.innerHTML = SVG_ICONS.edit;
        prevEditBtn.addEventListener('click', () => {
          editLastPrompt(prevText, lastUserMsg);
        });
        lastUserMsg.appendChild(prevEditBtn);
      }
    }
  }

  function addRetryButton(container, retryFn) {
    const existingRetry = container.parentElement.querySelector('.retry-btn');
    if (existingRetry) existingRetry.remove();
    
    const retryBtn = document.createElement('button');

    container.parentElement.appendChild(retryBtn);

  async function retryLastPrompt() {
    if (isProcessing || !lastPromptPayload) return;
    
    const failedContainer = lastPromptPayload.failedContainer;
    if (failedContainer && failedContainer.parentElement) {
      const assistantDiv = failedContainer.parentElement;
      const userDiv = assistantDiv.previousElementSibling;
      if (userDiv && userDiv.classList.contains('user')) {
        userDiv.remove();
      }
      assistantDiv.remove();
    }

    if (conversationHistory.length > 0 && conversationHistory[conversationHistory.length - 1].role === 'assistant') {
      conversationHistory.pop();
    }
    if (conversationHistory.length > 0 && conversationHistory[conversationHistory.length - 1].role === 'user') {
      conversationHistory.pop();
    }
    
    await dismissKeyboard();
    createUserMessage(lastPromptPayload.displayPrompt);
    const newContainer = createAssistantMessageContainer();
    if (lastPromptPayload.isImage) {
      await executeImageRequest(lastPromptPayload.displayPrompt, newContainer);
    } else {
      await sendPromptWithFullText(lastPromptPayload.fullPayload, lastPromptPayload.displayPrompt, newContainer);
    }
  }

  async function sendPrompt() {
    if (isProcessing) return;
    
    const prompt = promptInput.value.trim();
    if ((!prompt && attachedFiles.length === 0) || !CONFIG) return;

    promptInput.value = '';
    autoGrow();

    lockConversationMode('chat');
    isProcessing = true;

    try {
      const fullPayload = await buildMultimodalContent(prompt, attachedFiles);
      setLoading(sendBtn);

      await dismissKeyboard();

      const displayPrompt = prompt || '-- files attached --';
      createUserMessage(displayPrompt);
      const contentEl = createAssistantMessageContainer();

      await executePromptRequest(fullPayload, displayPrompt, contentEl);
    } finally {
      isProcessing = false;
    }
  }

  async function sendPromptWithFullText(fullPayload, displayPrompt, contentEl) {
    if (isProcessing) return;
    isProcessing = true;
    try {
      setLoading(sendBtn);
      await executePromptRequest(fullPayload, displayPrompt, contentEl);
    } finally {
      isProcessing = false;
    }
  }

  async function executePromptRequest(fullPayload, displayPrompt, contentEl, existingApiMessages = null, toolRoundCount = 0) {
    lastPromptPayload = {
      isImage: false,
      displayPrompt: displayPrompt,
      fullPayload: fullPayload,
      failedContainer: contentEl
    };

    const hasImage = Array.isArray(fullPayload) && fullPayload.some(item => item.type === 'image_url');
    const activeModel = (hasImage && CONFIG.visionModel) ? CONFIG.visionModel : CONFIG.model;

    updateStatusBar(activeModel);

    let apiMessages;
    if (existingApiMessages) {
      apiMessages = existingApiMessages;
    } else {
      const contextSuffix = getFormattedRuntimeContext();

      conversationHistory.push({ role: 'user', content: fullPayload, displayPrompt: displayPrompt });
      apiMessages = [
        { role: 'system', content: CONFIG.systemPrompt + contextSuffix }
      ];
      for (let i = 0; i < conversationHistory.length - 1; i++) {
        const item = conversationHistory[i];
        apiMessages.push({
          role: item.role,
          content: item.content,
          ...(item.tool_calls ? { tool_calls: item.tool_calls } : {})
        });
      }
      apiMessages.push({ role: 'user', content: fullPayload });
    }

    const url = CONFIG.apiHost.replace(/\/$/, '') + '/' + CONFIG.apiPath.replace(/^\//, '');
    const body = Object.assign(
      {
        model: activeModel,
        messages: apiMessages,
        stream: true
      },
      CONFIG.tavilyApiKey ? {
        tools: [
          {
            type: 'function',
            function: {
              name: 'web_search',
              description: 'Search the live web for up-to-date information, news, or factual verification.',
              parameters: {
                type: 'object',
                properties: {
                  query: { type: 'string', description: 'The search query' }
                },
                required: ['query']
              }
            }
          },
          {
            type: 'function',
            function: {
              name: 'fetch_web_page',
              description: 'Fetch and extract full text content from one or more web page URLs.',
              parameters: {
                type: 'object',
                properties: {
                  urls: {
                    type: 'array',
                    items: { type: 'string' },
                    description: 'List of full HTTP/HTTPS URLs to fetch'
                  }
                },
                required: ['urls']
              }
            }
          }
        ]
      } : {},
      (CONFIG.reasoningEffort && CONFIG.reasoningEffort !== 'none') ? { reasoning_effort: CONFIG.reasoningEffort } : {},
      CONFIG.extraParams
    );

    let fullText = '';
    let accumulatedToolCalls = {};
    abortController = new AbortController();

    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + CONFIG.apiKey
        },
        body: JSON.stringify(body),
        signal: abortController.signal
      });

      if (!res.ok) {
        const data = await res.json().catch(() => null);
        const msg = (data && data.error && (data.error.message || data.error)) || res.statusText;
        setError(contentEl, typeof msg === 'string' ? msg : JSON.stringify(msg));
        addRetryButton(contentEl, retryLastPrompt);
        if (!existingApiMessages) conversationHistory.pop();
        showError(typeof msg === 'string' ? msg : JSON.stringify(msg));
        resetInput();
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });

        const lines = buffer.split(/\r?\n/);
        buffer = lines.pop() || '';

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed.startsWith('data:')) continue;

          const data = trimmed.slice(5).trim();
          if (data === '[DONE]') continue;

          try {
            const parsed = JSON.parse(data);
            const delta = parsed?.choices?.[0]?.delta;
            if (delta) {
              if (delta.content) {
                if (!fullText) {
                  contentEl.classList.remove('placeholder');
                  alignAssistantToTop(contentEl.parentElement);
                }
                fullText += delta.content;
                renderMarkdownThrottled(contentEl, fullText);
              }
              if (delta.tool_calls) {
                for (const tc of delta.tool_calls) {
                  const idx = tc.index ?? 0;
                  if (!accumulatedToolCalls[idx]) {
                    accumulatedToolCalls[idx] = { id: '', name: '', arguments: '' };
                  }
                  if (tc.id) accumulatedToolCalls[idx].id = tc.id;
                  if (tc.function?.name) accumulatedToolCalls[idx].name += tc.function.name;
                  if (tc.function?.arguments) accumulatedToolCalls[idx].arguments += tc.function.arguments;
                }
              }
            }
          } catch (e) {
            // Ignore invalid JSON frame
          }
        }
      }

      const toolCallList = Object.values(accumulatedToolCalls);

      if (toolCallList.length > 0) {
        const maxCalls = parseInt(CONFIG.maxTavilyCalls, 10) || 3;
        if (toolRoundCount >= maxCalls) {
          fullText += `\n\n-- MAX TAVILY CALLS REACHED (${maxCalls}). STOPPING TOOL LOOP --`;
          renderMarkdown(contentEl, fullText);
          addRetryButton(contentEl, retryLastPrompt);
          conversationHistory.push({ role: 'assistant', content: fullText });
          resetInput();
          return;
        }

        const assistantMsg = {
          role: 'assistant',
          content: fullText || null,
          tool_calls: toolCallList.map(tc => ({
            id: tc.id,
            type: 'function',
            function: { name: tc.name, arguments: tc.arguments }
          }))
        };
        apiMessages.push(assistantMsg);

        for (const tc of toolCallList) {
          let resultStr = '';
          try {
            const args = JSON.parse(tc.arguments || '{}');
            if (tc.name === 'web_search') {
              const statusDiv = `<div class="tool-status-msg green-txt term-font">-- TOOL EXEC: SEARCHING WEB "${escapeHtml(args.query || '')}"... --</div>`;
              renderMarkdown(contentEl, (fullText ? fullText + '\n\n' : '') + statusDiv);
              resultStr = await executeTavilySearch(args.query);
            } else if (tc.name === 'fetch_web_page') {
              const statusDiv = `<div class="tool-status-msg green-txt term-font">-- TOOL EXEC: FETCHING WEB PAGE CONTENT... --</div>`;
              renderMarkdown(contentEl, (fullText ? fullText + '\n\n' : '') + statusDiv);
              resultStr = await executeTavilyExtract(args.urls);
            } else {
              resultStr = JSON.stringify({ error: `Unknown tool: ${tc.name}` });
            }
          } catch (err) {
            resultStr = JSON.stringify({ error: err.message || 'Tool execution failed' });
          }

          apiMessages.push({
            role: 'tool',
            tool_call_id: tc.id,
            content: resultStr
          });
        }

        return await executePromptRequest(fullPayload, displayPrompt, contentEl, apiMessages, toolRoundCount + 1);
      }

      renderMarkdown(contentEl, fullText);
      addRetryButton(contentEl, retryLastPrompt);

      conversationHistory.push({ role: 'assistant', content: fullText });
      resetInput();
    } catch (err) {
      if (err.name === 'AbortError') {
        finalizeStoppedResponse(contentEl, fullText);
        addRetryButton(contentEl, retryLastPrompt);
        if (fullText) {
          conversationHistory.push({ role: 'assistant', content: fullText });
        }
        resetInput();
        return;
      }

      const errorMessage = err.message || 'network request failed';
      setError(contentEl, errorMessage);
      addRetryButton(contentEl, retryLastPrompt);
      showError(errorMessage);
      if (!existingApiMessages) conversationHistory.pop();
      resetInput();
    } finally {
      abortController = null;
    }
  }

  // ==== IMAGE GENERATION ====

  async function sendImagePrompt() {
    if (isProcessing) return;

    const prompt = promptInput.value.trim();
    if (!prompt || !CONFIG) return;

    promptInput.value = '';
    autoGrow();

    lockConversationMode('image');
    isProcessing = true;

    try {
      setLoading(sendImgBtn);

      await dismissKeyboard();

      createUserMessage(prompt);
      const contentEl = createAssistantMessageContainer();

      await executeImageRequest(prompt, contentEl);
    } finally {
      isProcessing = false;
    }
  }

  async function executeImageRequest(promptText, contentEl) {
    lastPromptPayload = {
      isImage: true,
      displayPrompt: promptText,
      failedContainer: contentEl
    };

    const targetModel = CONFIG.imageModel || 'black-forest-labs/FLUX-2-klein-9b';
    updateStatusBar(targetModel);

    conversationHistory.push({ role: 'user', content: promptText, displayPrompt: promptText });

    const url = CONFIG.apiHost.replace(/\/$/, '') + '/v1/openai/images/generations';
    const payload = {
      model: targetModel,
      prompt: promptText,
      size: CONFIG.imageResolution || '1280x720',
      quality: CONFIG.imageQuality || 'standard',
      style: CONFIG.imageStyle || 'natural'
    };

    if (lastGeneratedImageUrl) {
      payload.image = lastGeneratedImageUrl;
    }

    abortController = new AbortController();

    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + CONFIG.apiKey
        },
        body: JSON.stringify(payload),
        signal: abortController.signal
      });

      if (!res.ok) {
        const data = await res.json().catch(() => null);
        const msg = (data && data.error && (data.error.message || data.error)) || res.statusText;
        setError(contentEl, typeof msg === 'string' ? msg : JSON.stringify(msg));
        addRetryButton(contentEl, retryLastPrompt);
        conversationHistory.pop();
        showError(typeof msg === 'string' ? msg : JSON.stringify(msg));
        resetInput();
        return;
      }

      const data = await res.json();
      const imageUrl = data?.data?.[0]?.url || (data?.data?.[0]?.b64_json ? `data:image/png;base64,${data.data[0].b64_json}` : null);

      if (!imageUrl) {
        throw new Error('No image returned in response payload');
      }

      contentEl.classList.remove('placeholder');
      contentEl.innerHTML = '';

      const imgEl = document.createElement('img');
      imgEl.src = imageUrl;
      imgEl.className = 'img-thumbnail';
      imgEl.alt = promptText;
      imgEl.addEventListener('click', () => openLightbox(imageUrl));

      contentEl.appendChild(imgEl);
      addRetryButton(contentEl, retryLastPrompt);

      lastGeneratedImageUrl = imageUrl;
      conversationHistory.push({ role: 'assistant', type: 'image', url: imageUrl });
      resetInput();
    } catch (err) {
      if (err.name === 'AbortError') {
        finalizeStoppedResponse(contentEl, '');
        addRetryButton(contentEl, retryLastPrompt);
        resetInput();
        return;
      }

      const errorMessage = err.message || 'Image generation failed';
      setError(contentEl, errorMessage);
      addRetryButton(contentEl, retryLastPrompt);
      showError(errorMessage);
      conversationHistory.pop();
      resetInput();
    } finally {
      abortController = null;
    }
  }

  function handleSendOrStop() {
    if (sendBtn.classList.contains('stop')) {
      if (abortController) abortController.abort();
    } else if (!isProcessing) {
      sendPrompt();
    }
  }

  function handleImageSendOrStop() {
    if (sendImgBtn.classList.contains('stop')) {
      if (abortController) abortController.abort();
    } else if (!isProcessing) {
      sendImagePrompt();
    }
  }

  sendBtn.addEventListener('click', handleSendOrStop);
  sendImgBtn.addEventListener('click', handleImageSendOrStop);

  // ==== INIT ====

  let autoFocusArmed = true;
  function disarmAutoFocus() {
    autoFocusArmed = false;
    document.removeEventListener('pointerdown', tryAutoFocus, true);
    document.removeEventListener('touchstart', tryAutoFocus, true);
  }
  function tryAutoFocus(e) {
    if (!autoFocusArmed) return;
    disarmAutoFocus();
    if (!CONFIG) return;
    if (document.activeElement === promptInput) return;
    if (e.target.closest('button, a, input, select, textarea, [role="button"]')) return;
    promptInput.focus();
  }
  document.addEventListener('pointerdown', tryAutoFocus, true);
  document.addEventListener('touchstart', tryAutoFocus, true);

  const savedConfig = loadConfig();
  if (savedConfig) {
    CONFIG = savedConfig;
    updateStatusBar();
    hideSettingsScreen();
  } else {
    CONFIG = null;
    updateStatusBar();
    showSettingsScreen();
  }

  checkEmptyState();
</script>
